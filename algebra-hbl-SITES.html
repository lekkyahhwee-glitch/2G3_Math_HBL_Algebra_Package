<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>2G3 Algebra HBL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Lexend:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: a phone-style app column. Home = dashboard (avatar, XP, gems, week chart, missions, activity).
   Mission = full-screen player: header → stage chips → scroll area → math toolbar → Back/Next footer. */
:root{
  --paper:#F3F2EC; --card:#FFFFFF; --ink:#1D1A2C; --muted:#6A6680; --line:#E2DFD4;
  --accent:#EE5A3C; --accent-soft:#FFE3DA; --blue:#2E66F5; --blue-soft:#E3EBFF;
  --good:#17A564; --good-soft:#DDF5E8; --amber:#FFB627; --pink:#FF2D85; --coral:#FF5A45;
  --violet:#7A4DFF; --violet-soft:#ECE5FF;
  --f-pixel:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math:"STIX Two Text", "Times New Roman", serif;
  --toolbar-h:52px; --footer-h:68px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:radial-gradient(#DAD7CB 1px,transparent 1px);background-size:18px 18px;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
html{color-scheme:light}
input,select,textarea{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink);background-color:#FFFDF6;opacity:1}
input::placeholder{color:#9A96AA;-webkit-text-fill-color:#9A96AA}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.m{font-family:var(--f-math);font-size:1.12em;white-space:nowrap}
.m i{font-style:italic}
.m sup{font-size:.68em;line-height:0}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
.pix{font-family:var(--f-pixel);letter-spacing:.02em}

/* ---------- HOME ---------- */
#home{max-width:720px;margin:0 auto;padding-block:14px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-pixel);font-size:26px;font-weight:700}
.badge-chip{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero h1{font-family:var(--f-pixel);font-size:30px}
.hero .sub{color:var(--muted);font-size:15px}
.lvl{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px;background:var(--violet-soft);color:var(--violet);padding:3px 10px;border-radius:999px;margin-top:6px}
.xpbar{height:14px;border:2px solid var(--ink);border-radius:999px;background:#F1EEE6;overflow:hidden;margin-top:8px}
.xpbar>span{display:block;height:100%;background:var(--accent);transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.small{font-size:14px;color:var(--muted)}
.section-h{font-family:var(--f-pixel);font-size:20px;margin:6px 2px 0}
.gems{display:flex;flex-direction:column;gap:10px}
.gem{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.gem .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);font-size:18px}
.gem .t{font-weight:600;font-size:15px}
.gem .d{font-size:13px;color:var(--muted)}
.gem button{border:2px solid var(--ink);background:var(--amber);border-radius:10px;padding:5px 12px;font-weight:700;font-size:14px}
.gem button:disabled{background:#EEE;color:#999;border-color:#CCC;cursor:default}
.gem .got{font-weight:700;color:var(--good);font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:10px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .bar{width:70%;max-width:34px;background:#E5E1D6;border-radius:6px 6px 2px 2px;min-height:4px}
.week .bar.on{background:var(--accent)}
.week .bar.today{background:var(--accent);box-shadow:0 0 0 2px var(--ink)}
.week .lab{font-size:12px;color:var(--muted);font-weight:600}
.week .val{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums}
.missions{display:flex;flex-direction:column;gap:10px}
.mission{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px;box-shadow:3px 3px 0 var(--ink)}
.mission:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mission .num{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-pixel);font-size:22px;background:var(--accent);color:#fff;border:2px solid var(--ink)}
.mission .tt{font-weight:700}
.mission .meta{font-size:13px;color:var(--muted)}
.mission .go{font-weight:700;font-size:14px;color:var(--accent)}
.mission.locked{opacity:.6;box-shadow:none;border-style:dashed;cursor:default}
.mission.locked .num{background:#D8D4C8;color:#6A6680}
.mprog{height:8px;background:#EEE;border-radius:9px;overflow:hidden;margin-top:6px}
.mprog span{display:block;height:100%;background:var(--good)}
.act{display:flex;flex-direction:column}
.act .day{font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.act .item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#FCFBF8;margin-bottom:6px}
.act .item .a1{font-weight:600;font-size:15px}
.act .item .a2{font-size:12px;color:var(--muted)}
.act .item .sc{text-align:right;font-variant-numeric:tabular-nums}
.act .item .sc b{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px}

/* ---------- MISSION PLAYER ---------- */
#player{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);background-image:radial-gradient(#DAD7CB 1px,transparent 1px);background-size:18px 18px;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.ph{display:flex;align-items:center;gap:10px;padding-block:10px 6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:2px solid var(--ink)}
.ph .home{white-space:nowrap;flex:none;border:2px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px}
.ph .tt{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xppill{margin-left:auto;font-family:var(--f-pixel);font-size:18px;background:var(--amber);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;white-space:nowrap;position:relative}
.xpfloat{position:absolute;right:8px;top:-4px;font-family:var(--f-pixel);color:var(--good);font-size:18px;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:2px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#EEEBE2;color:var(--muted);border:1.5px solid transparent}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.now{background:var(--ink);color:#fff}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:smooth}
.page{max-width:780px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.page h2{font-family:var(--f-pixel);font-size:30px}
.page h3{font-size:19px}
.lead{font-size:17px;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:3px 3px 0 var(--ink)}
.card.soft{border-color:var(--line);box-shadow:none}
.hl{background:linear-gradient(transparent 45%,rgba(255,182,39,.62) 45%);font-weight:700;padding:0 2px}
.keychip{display:inline-block;background:var(--blue-soft);color:var(--blue);font-weight:700;padding:1px 8px;border-radius:7px}
.bignum{font-family:var(--f-math);font-size:30px;text-align:center;padding:6px 0}
.list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.toolbar{height:var(--toolbar-h);flex:none;display:flex;gap:6px;align-items:center;overflow-x:auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:#2A2740;scrollbar-width:thin}
.toolbar .tg{flex:none;color:#B9B4D6;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 4px 0 8px}
.toolbar button{flex:none;min-width:40px;height:38px;border:none;border-radius:8px;background:#3D3958;color:#fff;font-family:var(--f-math);font-size:19px;padding:0 8px}
.toolbar button:active{background:var(--accent)}
.footer{height:calc(var(--footer-h) + env(safe-area-inset-bottom,0px));flex:none;display:flex;gap:10px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--card);border-top:2px solid var(--ink)}
.footer .msg{flex:1;min-width:0;font-size:13px;color:var(--muted);text-align:center}
.nav{border:2px solid var(--ink);border-radius:12px;padding:10px 20px;font-weight:700;font-size:16px;background:var(--card);box-shadow:3px 3px 0 var(--ink)}
.nav.next{background:var(--accent);color:#fff}
.nav:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.nav:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- FLIP CARDS ---------- */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.flip{display:grid;perspective:1200px;cursor:pointer;border:none;background:none;padding:0;text-align:left;width:100%}
.flip>.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:14px;padding:18px;transition:transform .5s cubic-bezier(.4,0,.2,1);min-height:150px;display:flex;flex-direction:column;gap:8px}
.flip .front{background:var(--amber);animation:pulse 1.8s ease-in-out infinite;justify-content:center}
.flip .front .q{font-family:var(--f-pixel);font-size:23px;line-height:1.2}
.flip .front .tap{font-size:13px;font-weight:700;opacity:.75}
.flip .back{background:var(--card);transform:rotateY(180deg);box-shadow:3px 3px 0 var(--ink)}
.flip .backtxt{line-height:1.5}.flip .backtxt>div+div,.flip .backtxt>.formula,.flip .backtxt>.small{margin-top:8px}
.flip .back .tap{font-size:12px;color:var(--muted);margin-top:auto}
.flip.on .front{transform:rotateY(-180deg);animation:none}
.flip.on .back{transform:rotateY(0)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,133,0);transform:scale(1)}50%{box-shadow:0 0 22px 6px rgba(255,45,133,.75);transform:scale(1.015)}}
.formula{font-family:var(--f-math);font-size:22px;background:var(--blue-soft);border-radius:10px;padding:10px 12px;text-align:center}

/* ---------- ANSWERS ---------- */
.qcard{display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet)}
.tag.think{background:#FFE0EE;color:#C2185B}
.qtext{font-size:19px}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans{flex:1;min-width:180px;font-family:var(--f-math);font-size:22px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#FFFDF6}
.ans.ok{border-color:var(--good);background:var(--good-soft)}
.ans.bad{border-color:var(--coral);animation:shake .35s}
.btn{border:2px solid var(--ink);border-radius:10px;padding:10px 16px;font-weight:700;background:var(--blue);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.hint{background:#FFF3C4;color:var(--ink)}
.btn.hint.glow{animation:hintglow 1.2s ease-in-out infinite}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
@keyframes hintglow{0%,100%{box-shadow:0 0 0 0 rgba(255,182,39,0)}50%{box-shadow:0 0 0 6px rgba(255,182,39,.8)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{font-size:15px;font-weight:600;border-radius:10px;padding:10px 12px}
.fb.good{background:var(--good-soft);color:#0E6B40}
.fb.warn{background:#FFF3C4;color:#7A5300}
.fb.bad{background:var(--coral);color:#fff}
.ask{font-size:14px;font-weight:600;color:var(--blue)}
.hintbox{background:#FFF8DD;border:2px dashed var(--amber);border-radius:10px;padding:10px 12px;font-size:15px}
.hintbox b{color:#7A5300}
.sol{border:2px solid var(--ink);border-radius:12px;background:#F7F5FF;padding:12px 14px}
.sol .h{font-weight:700;font-size:14px;color:var(--violet);margin-bottom:6px}
.sol .ln{font-family:var(--f-math);font-size:20px;padding:3px 0;display:flex;flex-wrap:wrap;column-gap:14px;row-gap:0;align-items:baseline}
.sol .ln>span:first-child{flex:0 0 auto;max-width:100%}
.sol .ln .why{flex:1 1 150px;min-width:0}
.sol .ln .why{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.askfriend{background:var(--violet);color:#fff;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:12px 14px;font-size:17px;box-shadow:2px 2px 0 var(--ink)}
.opt .L{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.opt.wrong{background:#FFE5E1;border-color:var(--coral);opacity:.75}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt:disabled{cursor:default}
.diag{width:100%;max-width:520px;margin:0 auto;display:block}
.diagwrap{overflow-x:auto}

/* ---------- AREA GRID ---------- */
.agrid{display:grid;gap:4px;margin:0 auto;width:100%;max-width:520px}
.agrid .hd{font-family:var(--f-math);font-size:24px;display:grid;place-items:center;padding:8px;border-radius:10px;background:var(--blue-soft);font-weight:500;transition:box-shadow .3s,background .3s}
.agrid .corner{background:var(--ink);color:#fff;font-family:var(--f-body);font-size:20px}
.agrid .cell{border:2px solid var(--ink);border-radius:10px;min-height:96px;display:grid;place-items:center;padding:6px;background:#FFFDF6;transition:box-shadow .3s,background .3s}
.agrid .cell .ans{min-width:0;width:100%;text-align:center;font-size:21px;padding:8px 4px}
@media (max-width:480px){.agrid .cell{padding:3px;min-height:80px}.agrid .cell .ans{font-size:17px;padding:8px 1px;letter-spacing:-.3px}.agrid .hd{font-size:20px;padding:6px 2px}}
svg .glow{stroke:#FF2D85!important;stroke-width:5px!important;filter:drop-shadow(0 0 6px rgba(255,45,133,.9));box-shadow:none!important;background:none!important}
svg text.glow{fill:#FF2D85!important;stroke:none!important;font-weight:700}
.glow{box-shadow:0 0 0 4px var(--amber),0 0 22px 6px rgba(255,45,133,.55)!important;background:#FFF4D6!important}

/* ---------- WORKED EXAMPLE ---------- */
.we{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.weq{font-size:20px}
.solve{display:flex;flex-direction:column;gap:10px}
.slot{border:2px solid var(--good);background:var(--good-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slot .sn{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.slot .st{font-weight:600}
.slot .work{font-family:var(--f-math);font-size:21px}
.slot.lit{animation:lit 1.2s ease-out}
@keyframes lit{0%{box-shadow:0 0 0 0 rgba(23,165,100,.9)}100%{box-shadow:0 0 0 16px rgba(23,165,100,0)}}
.pick h4{margin:0 0 8px;font-size:15px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px}
.stepbtn{text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:12px 14px;font-size:16px;box-shadow:2px 2px 0 var(--ink)}
.stepbtn.no{background:#FFE5E1;border-color:var(--coral);animation:shake .35s}
.expr-big{font-family:var(--f-math);font-size:32px;text-align:center;padding:14px 6px;border:2px solid var(--ink);border-radius:14px;background:#FFFDF6}
.expr-big .fr span{border-radius:0}
.expr-big span{border-radius:8px;padding:0 4px;transition:box-shadow .3s,background .3s}

/* ---------- TRAPS ---------- */
.trap{display:flex;flex-direction:column;gap:10px}
.trap .who{font-size:14px;color:var(--muted);font-weight:600}
.trap .claim{font-family:var(--f-math);font-size:24px}
.trap .claim .m,.qtext .m,.weq .m,.miss .m,.lead .m{white-space:normal}
.sol{overflow-x:auto}
.trap .tb{display:flex;gap:10px;flex-wrap:wrap}
.callout{background:var(--coral);color:#fff;border-radius:12px;padding:12px 14px;font-size:16px}
.callout .m{color:#fff}
.callout.ok{background:var(--good)}
.callout .fix{background:rgba(255,255,255,.16);border-radius:8px;padding:8px 10px;margin-top:8px}
.callout .fix div{font-family:var(--f-math);font-size:20px}

/* ---------- SUMMARY ---------- */
.shot{background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:4px 4px 0 var(--ink);animation:pulse 1.8s infinite}
.shot .big{font-size:42px}
.shot b{font-family:var(--f-pixel);font-size:24px;display:block}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sumgrid .card h3{margin-bottom:8px;font-family:var(--f-pixel);font-size:20px}
.signs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-family:var(--f-math);font-size:19px}
.signs div{background:var(--blue-soft);border-radius:8px;padding:6px;text-align:center}

/* ---------- MISC ---------- */
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ctrls button{border:2px solid var(--ink);border-radius:9px;padding:6px 12px;background:var(--card);font-weight:600;font-size:14px}
.ctrls button.on{background:var(--ink);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent);height:36px}
.modal-bg{position:fixed;inset:0;background:rgba(29,26,44,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--f-pixel);font-size:24px}
.modal .ans{font-family:var(--f-body);font-size:18px}
.everyrow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.everyrow .ic{width:44px;height:44px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px;background:var(--card)}
.everyrow b{display:block}
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.stat3 div{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px}
.stat3 b{display:block;font-family:var(--f-pixel);font-size:28px;color:var(--accent)}

<script>
/* =====================================================================
   STORAGE + XP
   ===================================================================== */
const KEY='2g3-algebra-hbl-v1';
const WS_PDF={};
const DAILY_GOAL=120;
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fresh(){return {name:'',xp:0,daily:{},gems:{},activity:[],mods:{}}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mod(id){if(!S.mods[id])S.mods[id]={page:0,maxPage:0,ans:{},flags:{},order:{},completed:false};return S.mods[id]}
function todayXP(){return S.daily[today()]||0}
function level(){return Math.floor(S.xp/100)+1}
function addXP(n){
  if(!n)return; S.xp+=n; const t=today(); S.daily[t]=(S.daily[t]||0)+n; save();
  const pill=document.querySelector('.xppill');
  if(pill){pill.firstChild.textContent=S.xp+' XP';const f=document.createElement('span');f.className='xpfloat';f.textContent='+'+n;pill.appendChild(f);
    f.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-30px)',opacity:0}],{duration:1100,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});setTimeout(()=>f.remove(),1150)}
}
function logActivity(title,detail,xp){S.activity.unshift({t:Date.now(),title,detail,xp});S.activity=S.activity.slice(0,60);save()}

/* =====================================================================
   MATH FORMATTING  —  M('(2x+3)(x-5)') → nicely typeset span
   ===================================================================== */
/* M('(2x+3)(x-5)') formats maths. Stacked fractions: M('{3a}/{4b^2}') — braces mark numerator and denominator. */
function fmtMath(s){
  let t=String(s).replace(/&lt;/g,'<').replace(/&/g,'&amp;').replace(/<=/g,'≤').replace(/</g,'\uE000');
  t=t.replace(/sqrt/g,'√').replace(/(^|[^a-z])pi(?![a-z])/g,'$1π');
  {let o='',i=0;while(i<t.length){if(t[i]==='√'&&t[i+1]==='('){let d=0,j=i+1;for(;j<t.length;j++){if(t[j]==='(')d++;if(t[j]===')'){d--;if(!d)break}}
     if(j<t.length){o+='\uE032\uE030'+t.slice(i+2,j)+'\uE031';i=j+1;continue}}o+=t[i++]}t=o}   // √(…) → √ with a bar over the whole expression
  t=t.replace(/&amp;gt;/g,'>').replace(/>=/g,'≥').replace(/>/g,'\uE001');
  t=t.replace(/-/g,'−').replace(/\*/g,'×');
  t=t.replace(/([^(\s=×−+≤≥\uE000\uE001÷])([+−=≤≥÷\uE000\uE001])/g,'$1 $2 ');t=t.replace(/^=/,'= ');
  {let d=0,o='';for(const ch of t){if(ch==='(')d++;if(ch===')')d=Math.max(0,d-1);o+=(d>0&&ch===' ')?'\u00a0':ch}t=o.replace(/\)\(/g,')\u2060(')}   // never break inside a bracket or between brackets
  t=t.replace(/\^\(([^()]*)\)/g,'<sup>$1</sup>').replace(/\^(−?\d+|[a-z])/g,'<sup>$1</sup>');
  const W=[];t=t.replace(/\b(or|and|so|if|then|when|where|check|for|is|not|both|each)\b|(?<=[\s\d])(cm|km|kg|mm|min)\b/g,w=>{W.push(w);return '\uE020'+(W.length-1)+'\uE021'});   // English words stay upright
  t=t.replace(/([a-zA-Z])(?![^<]*>)/g,'<i>$1</i>');
  t=t.replace(/\uE032\uE030/g,'<span class="sqw"><span class="rad">√</span><span class="sqrt">').replace(/\uE031/g,'</span></span>');
  t=t.replace(/\uE020(\d+)\uE021/g,(_,i)=>W[+i]);
  return t.replace(/ {2,}/g,' ').replace(/\uE000/g,'&lt;').replace(/\uE001/g,'&gt;');
}
function M(s){
  s=String(s);const fr=[];let guard=0;
  const re=/\{([^{}]*)\}\/\{([^{}]*)\}/;
  while(re.test(s)&&guard++<30)s=s.replace(re,(m,a,b)=>{fr.push([a,b]);return '\u0001'+(fr.length-1)+'\u0002'});
  const sub=x=>x.replace(/\u0001(\d+)\u0002/g,(m,i)=>{const [a,b]=fr[+i];return '<span class="fr"><span>'+sub(fmtMath(a))+'</span><span>'+sub(fmtMath(b))+'</span></span>'});
  return '<span class="m">'+sub(fmtMath(s))+'</span>';
}
/* stacked fraction from ready-made HTML parts */
function F(n,d){return '<span class="m"><span class="fr"><span>'+n+'</span><span>'+d+'</span></span></span>'}

/* =====================================================================
   ANSWER CHECKING  —  expression parser + numeric equivalence
   ===================================================================== */
function normDashes(s){return String(s).replace(/[−‒–—―﹣－]/g,'-')}
function parseStudentNumber(raw){let s=normDashes(String(raw).trim()).replace(/\s+/g,'').replace(/,/g,'.');if(/^[-+]?\d*\.?\d+$/.test(s))return parseFloat(s);return numVal(s)}
function normExpr(raw){return normDashes(String(raw)).toLowerCase().replace(/\s+/g,'').replace(/²/g,'^2').replace(/³/g,'^3').replace(/[×·∙]/g,'*').replace(/÷/g,'/')}
function tokenize(s){
  const out=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;out.push({t:'n',v:parseFloat(s.slice(i,j))});i=j;continue}
    if(s.startsWith('sqrt',i)||c==='√'){out.push({t:'f',v:'sqrt'});i+=c==='√'?1:4;continue}
    if(s.startsWith('pi',i)||c==='π'){out.push({t:'f',v:'pi'});i+=c==='π'?1:2;continue}
    if(/[a-z]/.test(c)){out.push({t:'v',v:c});i++;continue}
    if('+-*/^()'.includes(c)){out.push({t:c});i++;continue}
    throw new Error('bad char')}
  const res=[];
  for(let k=0;k<out.length;k++){const a=out[k-1],b=out[k];
    if(a&&(a.t==='n'||a.t==='v'||a.t===')'||(a.t==='f'&&a.v==='pi'))&&(b.t==='n'||b.t==='v'||b.t==='('||b.t==='f'))res.push({t:'*',implicit:true});
    res.push(b)}
  return res;
}
function compile(raw){
  const tk=tokenize(normExpr(raw));let p=0;
  const peek=()=>tk[p],eat=t=>{if(!tk[p]||tk[p].t!==t)throw new Error('expected '+t);p++};
  function expr(){let f=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=tk[p++].t,g=f,h=term();f=op==='+'?e=>g(e)+h(e):e=>g(e)-h(e)}return f}
  function term(){let f=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=tk[p++].t,g=f,h=unary();f=op==='*'?e=>g(e)*h(e):e=>g(e)/h(e)}return f}
  function unary(){if(peek()&&peek().t==='-'){p++;const g=unary();return e=>-g(e)}if(peek()&&peek().t==='+'){p++;return unary()}return power()}
  function power(){const b=primary();if(peek()&&peek().t==='^'){p++;const ex=unary();return e=>Math.pow(b(e),ex(e))}return b}
  function primary(){const x=tk[p];if(!x)throw new Error('end');
    if(x.t==='n'){p++;return()=>x.v}
    if(x.t==='v'){p++;return e=>(x.v in e?e[x.v]:NaN)}
    if(x.t==='f'){p++;if(x.v==='pi')return()=>Math.PI;const a=power();return e=>Math.sqrt(a(e))}
    if(x.t==='('){p++;const f=expr();eat(')');return f}
    throw new Error('unexpected')}
  if(!tk.length)throw new Error('empty');
  const f=expr();if(p!==tk.length)throw new Error('trailing');return f;
}
function varsOf(s){return [...new Set((normExpr(s).replace(/sqrt|pi/g,'').match(/[a-z]/g)||[]))]}
function equiv(student,expected){
  let fs,fe;try{fs=compile(student)}catch(e){return null}fe=compile(String(expected));
  const vs=varsOf(String(expected)),extra=varsOf(student).filter(v=>!vs.includes(v));
  const pts=[1.37,-2.11,0.73,3.19,-0.58,2.41,4.3,0.29,5.7,1.91,-3.4,2.77];let n=0;
  for(let i=0;i<12;i++){const env={};vs.forEach((v,j)=>env[v]=pts[(i+j*5)%12]+j*0.173);extra.forEach((v,j)=>env[v]=pts[(i+j*3+7)%12]+0.311);
    const b=fe(env);if(!isFinite(b))continue;            // e.g. √ of a negative test value: skip that point
    const a=fs(env);if(!isFinite(a))return false;if(Math.abs(a-b)>1e-6*Math.max(1,Math.abs(b)))return false;n++}
  return n>=3;
}
/* inequality "x >= 5/2", "2 < x", "x≤−1" → {v,rel,val} */
function parseIneq(raw){let s=normExpr(raw).replace(/≥|=>/g,'>=').replace(/≤|=</g,'<=');let m;
  const flip={'>':'<','<':'>','>=':'<=','<=':'>='};
  if((m=/^([a-z])(>=|<=|>|<)(.+)$/.exec(s)))return {v:m[1],rel:m[2],val:numVal(m[3])};
  if((m=/^(.+?)(>=|<=|>|<)([a-z])$/.exec(s)))return {v:m[3],rel:flip[m[2]],val:numVal(m[1])};
  return null}
/* top-level bracket contents, e.g. "2(x+1)(x-3)" → ["x+1","x-3"] */
function bracketGroups(s){s=normExpr(s);const out=[];let d=0,st=-1;for(let i=0;i<s.length;i++){if(s[i]==='('){if(d===0)st=i+1;d++}else if(s[i]===')'){d--;if(d===0)out.push(s.slice(st,i))}}return out}
function topTerms(s){s=normExpr(s);const out=[];let d=0,cur='';for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;if(c===')')d--;
  if((c==='+'||c==='-')&&d===0&&i>0&&!'^*/('.includes(s[i-1])){out.push(cur);cur=c==='-'?'-':''}else cur+=c}out.push(cur);return out.filter(t=>t!==''&&t!=='+')}
/* do all the terms share a number or a letter? ("4x-6" yes, "x^2+2x" yes, "2x+3" no) */
function hasCommonFactor(s){const T=topTerms(s);if(T.length<2)return false;
  const co=t=>{const m=/^[+-]?(\d+)/.exec(t.replace(/\(.*\)/g,''));return m?+m[1]:1};
  const lets=t=>new Set((t.replace(/\(.*\)/g,'').match(/[a-z]/g)||[]));
  let g=co(T[0]);T.forEach(t=>g=gcd(g,co(t)));if(g>1)return true;
  const L=T.map(lets);return [...L[0]].some(v=>L.every(x=>x.has(v)))}
/* number of non-constant factors: 2(x+2)(x+3) → 2, (x-4)^2 → 2, a(x+y) → 2 */
function nFactors(s){s=normExpr(s);let n=0,d=0,st=-1;for(let i=0;i<s.length;i++){if(s[i]==='('){if(d===0)st=i;d++}else if(s[i]===')'){d--;if(d===0){const m=/^\^(\d+)/.exec(s.slice(i+1));if(/[a-z]/.test(s.slice(st,i)))n+=m?+m[1]:1}}}
  const out=s.replace(/\([^()]*\)(\^\d+)?/g,'');n+=(out.match(/[a-z]/g)||[]).length?new Set(out.match(/[a-z]/g)).size:0;return n}
/* split "N/D" at the first top-level "/" (null if there is none) */
function fracParts(s){s=normExpr(s);let d=0;for(let i=0;i<s.length;i++){if(s[i]==='(')d++;if(s[i]===')')d--;if(s[i]==='/'&&d===0){
    // the denominator is only what "/" binds to: a bracket, a number or one letter ("7/2x" means (7/2)x)
    const r=s.slice(i+1);let den;if(r[0]==='('){let e=0,j=0;for(;j<r.length;j++){if(r[j]==='(')e++;if(r[j]===')'){e--;if(!e)break}}den=r.slice(0,j+1);let k=j+1;while(r[k]==='^'||/[\d.]/.test(r[k]||''))k++;den=r.slice(0,k)}
    else{const m=/^(\d+(\.\d+)?|[a-z])(\^\d+)?/.exec(r);den=m?m[0]:r}
    return [s.slice(0,i),den]}}return null}
/* degree of the denominator as a polynomial (all letters grow together): (x+3)(x-3) → 2, 2(x+3) → 1, 4 → 0 */
function denDeg(s){const fp=fracParts(s);if(!fp)return 0;let f;try{f=compile(fp[1])}catch(e){return 0}
  const vs=varsOf(fp[1]);const at=t=>{const env={};vs.forEach((v,j)=>env[v]=t*(1+0.13*j)+0.37);return Math.abs(f(env))};
  const a=at(1000),b=at(2000);if(!isFinite(a)||!isFinite(b)||a===0)return 0;return Math.round(Math.log(b/a)/Math.LN2)}
function notSimplest(s){s=normExpr(s);if(/sqrt|√|pi|π/.test(s))return false;if(topTerms(s).length>1)return false;let d=0,k=-1;for(let i=0;i<s.length;i++){if(s[i]==='(')d++;if(s[i]===')')d--;if(s[i]==='/'&&d===0){k=i;break}}
  if(k<0)return false;const num=s.slice(0,k),den=s.slice(k+1);
  const strip=x=>{if(x[0]!=='(')return x;let d=0;for(let i=0;i<x.length;i++){if(x[i]==='(')d++;if(x[i]===')'){d--;if(d===0)return i===x.length-1?x.slice(1,-1):x}}return x};
  const bn=bracketGroups(num),bd=bracketGroups(den);if(bn.some(b=>bd.includes(b)))return true;
  const mono=x=>x.replace(/\([^()]*\)/g,'');
  const co=x=>{const m=/^[+-]?(\d+)/.exec(mono(x));return m?+m[1]:1};
  if(topTerms(strip(num)).length===1&&topTerms(strip(den)).length===1){
    const N=strip(num),D=strip(den);if(gcd(co(N),co(D))>1)return true;
    const ln=new Set(mono(N).match(/[a-z]/g)||[]),ld=new Set(mono(D).match(/[a-z]/g)||[]);if([...ln].some(v=>ld.has(v)))return true}
  else if(topTerms(strip(den)).length===1&&/^\d+$/.test(strip(den))){let g=+strip(den);topTerms(strip(num)).forEach(t=>{const m=/^[+-]?(\d+)/.exec(t);g=gcd(g,m?+m[1]:1)});if(g>1)return true}
  return false}
function termCount(raw){const s=normExpr(raw);let d=0,n=1;
  for(let i=0;i<s.length;i++){const c=s[i];if(c==='(')d++;else if(c===')')d--;
    else if((c==='+'||c==='-')&&d===0&&i>0&&!'^*/('.includes(s[i-1]))n++}return n}

/* =====================================================================
   UI HELPERS
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function solHTML(lines,title){return '<div class="h">'+(title||'Worked solution')+'</div>'+lines.map(l=>{const [w,why]=Array.isArray(l)?l:[l,''];return '<div class="ln"><span>'+M(w)+'</span><span class="why">'+(why||'')+'</span></div>'}).join('')}
function modal(html,buttons){
  const root=$('#modalRoot');root.innerHTML='';const bg=el('div','modal-bg');const m=el('div','modal',html);
  const row=el('div','ansrow');buttons.forEach(b=>{const x=el('button','btn'+(b.ghost?' ghost':''),b.label);x.onclick=()=>{if(b.fn&&b.fn(m)===false)return;root.innerHTML=''};row.appendChild(x)});
  m.appendChild(row);bg.appendChild(m);root.appendChild(bg);const inp=m.querySelector('input');if(inp)setTimeout(()=>inp.focus(),50);
}

/* ---------- Answer box (expression or number), 2 attempts ---------- */
function answerBox(host,cfg,onResolve){
  // cfg: key, type ('expr'|'num'), ans, terms, hint, sol, xp:[first,second], placeholder
  const m=S.mods[curMod.id];const st=m.ans[cfg.key]||(m.ans[cfg.key]={tries:0,res:null,solved:false,val:''});const t0=Date.now();
  const wrap=el('div','qcard');
  const askText=cfg.ask||(cfg.placeholder==='?'?'':cfg.type==='num'?'Type the number only.':cfg.type==='ineq'?'Type your answer as an inequality, e.g. x ≥ 3 (use the ≤ ≥ buttons or type <= and >=).':cfg.factorised?'Type your answer fully factorised.':(cfg.terms||/[\/(]/.test(String(cfg.ans)))?'Type your final answer only, fully simplified.':'');
  if(askText)wrap.appendChild(el('div','ask','✏️ '+askText));
  const row=el('div','ansrow');
  const inp=el('input','ans');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.setAttribute('autocapitalize','off');
  inp.id='in-'+cfg.key;inp.placeholder=cfg.placeholder||'Type your answer';inp.value=st.val||'';inp.inputMode='text';
  const chk=el('button','btn','Check');
  row.append(inp,chk);
  let hb=null;if(cfg.hint){hb=el('button','btn hint','💡 Hint');row.appendChild(hb)}
  const hintBox=el('div','hintbox');hintBox.hidden=true;hintBox.innerHTML='<b>💡 Think about it:</b> '+(cfg.hint||'');
  const fb=el('div','fb');fb.hidden=true;
  const ask=el('div','askfriend','🤝 Two tries used. Have a look at the working below, then talk it through with a friend or your teacher. You can still type the answer, but no XP this time.');ask.hidden=true;
  const sol=el('div','sol');sol.hidden=true;if(cfg.sol)sol.innerHTML=solHTML(cfg.sol);
  wrap.append(row,hintBox,fb,ask,sol);host.appendChild(wrap);
  if(cfg.type!=='num'&&cfg.placeholder!=='?')attachPreview(inp);
  if(hb)hb.onclick=()=>{hintBox.hidden=!hintBox.hidden;hb.classList.remove('glow');st.hintSeen=true;save()};
  function show(kind,msg){fb.hidden=false;fb.className='fb '+kind;fb.innerHTML=msg}
  function paint(){
    if(st.solved){inp.classList.add('ok');inp.disabled=true;chk.disabled=true;if(hb)hb.classList.remove('glow')}
    if(st.res==='missed'){ask.hidden=false;sol.hidden=!cfg.sol}
    if(st.solved&&st.res==='first')show('good','✓ Correct on the first try!');
    else if(st.solved&&st.res==='second')show('good','✓ Correct! Nice recovery.');
    else if(st.solved&&st.res==='missed')show('good','✓ That\'s it. The method is yours now.');
    else if(st.tries===1){show('warn','Not quite. '+(cfg.hint?'Tap <b>💡 Hint</b> and have one more go.':'Check each term and have one more go.'));if(hb&&!st.hintSeen)hb.classList.add('glow')}
  }
  function check(){
    const v=inp.value.trim();if(!v)return;st.val=v;
    let ok;
    if(cfg.type==='num'){const n=parseStudentNumber(v);if(!isFinite(n)){show('warn','Type a number only (fractions like 5/2 are fine).');return}ok=Math.abs(n-numVal(cfg.ans))<(cfg.tol||1e-9)}
    else if(cfg.type==='ineq'){const a=parseIneq(v),e=parseIneq(cfg.ans);
      if(!a||!isFinite(a.val)){show('warn','Type an inequality, like x ≥ 3 or x < −2.');return}
      ok=a.v===e.v&&a.rel===e.rel&&Math.abs(a.val-e.val)<1e-9}
    else{
      let w=v;
      w=w.replace(/^\s*=/,'');
      if(cfg.lhs){const re=new RegExp('^\\s*'+cfg.lhs+'\\s*=','i');w=w.replace(re,'')}
      if(/=/.test(w)){show('warn','Type just the expression'+(cfg.lhs?' for '+cfg.lhs:'')+', without another "=".');return}
      if(!/[cm]/.test(normExpr(String(cfg.ans))))w=w.replace(/\s*(cm\^?2|cm²|m\^?2|m²|cm|m)\s*\.?$/i,'');   // ignore units like "cm²"
      if(/[a-z]\d/i.test(normExpr(w))){show('warn','For powers, tap the ² button or type ^ : write x² (or x^2), not x2.');return}
      const noBr=cfg.noBrackets===false||cfg.allowBrackets||cfg.factorised?false:(cfg.noBrackets===true||!/[()\/]|sqrt/.test(String(cfg.ans)));
      if(noBr&&/[()]/.test(w)){show('warn','Expand fully: your answer should have no brackets.');return}
      const nudge=(cfg.nudges||[]).find(n=>equiv(w,n.ans)===true);
      if(nudge&&st.res!=='missed'){show('warn',nudge.msg);return}   // on the right track: no try used
      ok=equiv(w,cfg.ans);
      if(ok===null){show('warn','I can\'t read that. Check your signs and powers (use the ² button for squares).');return}
      if(ok&&cfg.terms&&termCount(w)>cfg.terms){show('warn','Right value! Now <b>collect the like terms</b> so it is fully simplified.');return}
      if(ok&&cfg.minTerms&&termCount(w)<cfg.minTerms){show('warn','Show this line <b>before</b> collecting like terms: keep every term and just change the signs.');return}
      if(ok&&cfg.factorised&&(topTerms(w).length>1||!/\(/.test(w))){show('warn','That has the right value, but it is not factorised. Write it as a <b>product</b>, for example ( … )( … ).');return}
      if(ok&&cfg.factorised&&cfg.fully!==false&&nFactors(w)<nFactors(String(cfg.ans))){show('warn','Good start, but it is not <b>fully</b> factorised yet: one bracket can still be factorised. Keep going.');return}
      if(ok&&cfg.factorised&&cfg.fully!==false&&bracketGroups(w).some(hasCommonFactor)){show('warn','Factorised, but not <b>fully</b>: one bracket still has a common factor. Take it out too.');return}
      const ansS=String(cfg.ans),oneFrac=topTerms(ansS).length===1&&!!fracParts(ansS);
      if(ok&&oneFrac&&!cfg.lhs&&cfg.simplest!==false&&topTerms(w).length>1){show('warn','Right value! Now write it as a <b>single fraction</b>.');return}
      if(ok&&cfg.simplest!==false&&!/sqrt/.test(ansS)&&denDeg(w)>denDeg(ansS)){show('warn','Right value! Now <b>simplify</b> it: the top and bottom still share a common factor. Cancel it.');return}
      if(ok&&cfg.simplest!==false&&!cfg.lhs&&notSimplest(w)){show('warn','Right value! Now <b>simplify</b> it: the top and bottom still share a common factor.');return}
    }
    if(st.res==='missed'){if(ok){st.solved=true;save();paint()}else{inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');show('warn','Compare your answer with the working above, line by line.')}return}
    if(ok){st.res=st.tries===0?'first':'second';st.solved=true;if(cfg.xp)addXP(st.res==='first'?cfg.xp[0]:cfg.xp[1]);save();paint();trackResult(cfg,st.res,st,t0);onResolve&&onResolve(st.res);return}
    (st.wrong=st.wrong||[]).push(v);st.tries++;inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');
    if(st.tries>=2){st.res='missed';fb.hidden=true;save();paint();trackResult(cfg,'missed',st,t0);onResolve&&onResolve('missed');return}
    save();paint();
  }
  chk.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  inp.addEventListener('input',()=>{st.val=inp.value;save()});
  window.__AUTO&&(window.__AUTO[cfg.key]=()=>{inp.value=String(cfg.ans);st.val=inp.value;check()});
  paint();return st;
}

/* ---------- MCQ, 2 attempts, randomised order (kept stable per student) ---------- */
function mcq(host,cfg,onResolve){
  const m=S.mods[curMod.id];const st=m.ans[cfg.key]||(m.ans[cfg.key]={tries:0,res:null,solved:false,picked:[]});if(!st.picked)st.picked=[];const t0=Date.now();
  if(!m.order[cfg.key]){m.order[cfg.key]=shuffle(cfg.opts.map((_,i)=>i));save()}   // uniform: correct answer equally likely in A, B, C or D
  const order=m.order[cfg.key];
  const wrap=el('div','qcard');const grid=el('div','opts');
  let hb=null,hintBox=null;
  const fb=el('div','fb');fb.hidden=true;
  const ask=el('div','askfriend','🤝 Two tries used. Read the working below, then talk it through with a friend or your teacher. Tap the right option to carry on (no XP this time).');ask.hidden=true;
  const sol=el('div','sol');sol.hidden=true;if(cfg.sol)sol.innerHTML=solHTML(cfg.sol,cfg.solTitle);
  const btns=[];
  order.forEach((oi,pos)=>{const b=el('button','opt','<span class="L">'+'ABCD'[pos]+'</span><span>'+cfg.opts[oi]+'</span>');b.dataset.i=oi;b.onclick=()=>pick(oi,b);btns.push(b);grid.appendChild(b)});
  wrap.appendChild(grid);
  if(cfg.hint){const r=el('div','ansrow');hb=el('button','btn hint','💡 Hint');r.appendChild(hb);wrap.appendChild(r);hintBox=el('div','hintbox');hintBox.hidden=true;hintBox.innerHTML='<b>💡 Think about it:</b> '+cfg.hint;wrap.appendChild(hintBox);
    hb.onclick=()=>{hintBox.hidden=!hintBox.hidden;hb.classList.remove('glow')}}
  wrap.append(fb,ask,sol);host.appendChild(wrap);
  function show(k,msg){fb.hidden=false;fb.className='fb '+k;fb.innerHTML=msg}
  function paint(){
    btns.forEach(b=>{const i=+b.dataset.i;if(st.picked.includes(i)&&i!==0)b.classList.add('wrong');
      if(st.solved&&i===0)b.classList.add('right');
      if(st.solved||st.picked.includes(i))b.disabled=true});
    if(st.res==='missed'){ask.hidden=false;sol.hidden=!cfg.sol}
    if(st.solved){show('good',st.res==='first'?'✓ Correct on the first try!':st.res==='second'?'✓ Correct! Nice recovery.':'✓ That\'s the one.');if(cfg.after){sol.hidden=false}}
    else if(st.tries===1)show('warn','Not quite. '+(cfg.hint?'Tap <b>💡 Hint</b>, then try again.':'Think again and try once more.'));
    if(st.tries===1&&hb&&!st.solved)hb.classList.add('glow');if(st.solved&&hb)hb.classList.remove('glow');
  }
  function pick(i,b){
    if(st.solved)return;st.picked.push(i);
    if(st.res==='missed'){if(i===0){st.solved=true;save();paint()}else{save();paint()}return}
    if(i===0){st.res=st.tries===0?'first':'second';st.solved=true;if(cfg.xp)addXP(st.res==='first'?cfg.xp[0]:cfg.xp[1]);save();paint();trackResult(cfg,st.res,st,t0);onResolve&&onResolve(st.res);return}
    (st.wrong=st.wrong||[]).push(textify(cfg.opts[i]));st.tries++;b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300});
    if(st.tries>=2){st.res='missed';fb.hidden=true;save();paint();trackResult(cfg,'missed',st,t0);onResolve&&onResolve('missed');return}
    save();paint();
  }
  window.__AUTO&&(window.__AUTO[cfg.key]=()=>{const b=btns.find(x=>x.dataset.i==='0');if(b)b.click()});
  paint();return st;
}

/* Answers and progress are queued on this device and sent in small batches.
   If the tracker is busy or the internet drops, the device simply tries again later. */
const OUTKEY=KEY+'-outbox';
let OUTBOX;try{OUTBOX=JSON.parse(localStorage.getItem(OUTKEY))||[]}catch(e){OUTBOX=[]}
function saveOut(){try{localStorage.setItem(OUTKEY,JSON.stringify(OUTBOX.slice(-400)))}catch(e){}}
let flushTimer=null,flushing=false;

  if(!BACKEND_URL)return;
  OUTBOX.push(Object.assign({ts:Date.now(),mission:curMod?('M'+curMod.n+' '+curMod.title):'',missionId:curMod?curMod.id:'',attemptId:curMod?attemptId():''},o));
  saveOut();scheduleFlush(OUTBOX.length>=10?0:12000);

async function flush(opts){
  if(!BACKEND_URL||flushing||!S.sid)return;
  const batch=OUTBOX.slice(0,40);
  if(!batch.length&&!(opts&&opts.state))return;
  flushing=true;
  const skills={};batch.forEach(ev=>{if(ev.skill&&SKILLS[ev.skill])skills[ev.skill]=SKILLS[ev.skill]});
  const text=JSON.stringify({action:'logBatch',sid:S.sid,teacher:S.teacher||'',cca:S.cca||'',student:S.name||'',events:batch,state:compactState(),skills});
  let delivered=false,retry=30000;
  try{const r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:text,keepalive:text.length<60000});
    delivered=true;
    try{const j=await r.json();if(j&&j.ok===false){delivered=false;retry=15000+Math.random()*20000}}catch(e){}   // unreadable reply = sent
  }catch(e){delivered=false}
  flushing=false;
  if(delivered){OUTBOX.splice(0,batch.length);saveOut();if(OUTBOX.length)scheduleFlush(1500)}else scheduleFlush(retry);
}

  [...d.querySelectorAll('svg')].forEach(s=>s.remove());
  return d.textContent.replace(/\u2060/g,'').replace(/\s+/g,' ').trim()}

}

/* ---------- student sign-in (name + teacher + CCA) ----------
   Teacher and CCA lists come from the teacher panel (saved to the tracker), so they update on every
   student's device the next time the site opens. A student whose saved choice is not in the new list
   is asked to pick again. */
const NOT_SURE='Not sure yet';
function idNeedsUpdate(){
  if(!S.name||!S.teacher||!S.cca)return true;
  const T=CFG.teachers||[],C=CFG.ccas||[];
  if(T.length&&!T.includes(S.teacher))return true;
  if(C.length&&!C.includes(S.cca))return true;
  return false;
}
function askIdentity(force,pre){pre=pre||{};
  if(!force&&!idNeedsUpdate())return;
  const T=CFG.teachers||[],C=CFG.ccas||[];
  const returning=!force&&S.name&&S.teacher;
  const tField=T.length
    ?`<select class="ans" id="tIn"><option value="">Choose your maths teacher</option>${T.map(t=>`<option ${t===S.teacher?'selected':''}>${esc(t)}</option>`).join('')}</select>`
    :`<select class="ans" id="tIn" disabled><option>${NOT_SURE}</option></select><div class="small">Your teacher's name will appear here soon. You'll be asked to choose it then.</div>`;
  const cField=C.length
    ?`<select class="ans" id="cIn"><option value="">Choose your CCA</option>${C.map(c=>`<option ${c===(pre.cca||S.cca)?'selected':''}>${esc(c)}</option>`).join('')}</select>`
    :`<input class="ans" id="cIn" maxlength="40" placeholder="e.g. AV" value="${esc(pre.cca||S.cca||'')}">`;
  modal(`<div style="display:flex;gap:12px;align-items:center">${mascot(64,1)}<h3>${returning?'Quick update!':'Hi! I\'m Bracko.'}</h3></div>
   <p style="margin:0">${returning?'Your teacher has updated the list. Please check your details.':'Tell me who you are so your teacher can see your progress.'}</p>
   <label class="small" for="nameIn">Your full name</label><input class="ans" id="nameIn" maxlength="40" placeholder="e.g. Tan Wei Ling" value="${esc(pre.name!=null?pre.name:(S.name||''))}" ${S.nameLocked?'disabled':''}>${S.nameLocked?'<div class="small">Your teacher set this name. Ask them if it needs changing.</div>':''}
   <label class="small" for="tIn">Maths teacher</label>${tField}
   <label class="small" for="cIn">CCA</label>${cField}
   <div class="fb warn" id="idmsg" hidden></div>`,
   [{label:"Let's go!",fn:m=>{const n=S.nameLocked?S.name:m.querySelector('#nameIn').value.trim(),t=m.querySelector('#tIn').value,c=m.querySelector('#cIn').value.trim();
     const msg=m.querySelector('#idmsg');const say=x=>{msg.hidden=false;msg.textContent=x;return false};
     if(!n)return say('Type your name first.');
     if(T.length&&!t)return say('Choose your maths teacher.');
     if(!c)return say(C.length?'Choose your CCA.':'Type your CCA.');
     const fresh=!S.xp&&!Object.keys(S.mods).filter(k=>k!=='review').length&&!S.restoreChecked;
     S.name=n;S.teacher=T.length?t:NOT_SURE;S.cca=c;save();renderHome();
     logEvent({kind:'signin',round:'signed in'});
     if(fresh&&BACKEND_URL)setTimeout(tryRestore,50)}}]);
}
/* new or cleared device: look for this student's saved progress on the tracker */
async function tryRestore(){
  S.restoreChecked=true;save();
  const enc=encodeURIComponent;let j=null;
  try{j=await (await fetch(BACKEND_URL+'?action=find&name='+enc(S.name)+'&cca='+enc(S.cca)+'&teacher='+enc(S.teacher)+'&t='+Date.now())).json()}catch(e){}
  const ms=((j&&j.matches)||[]).filter(x=>x.sid&&x.sid!==S.sid).sort((a,b)=>new Date(b.lastSeen)-new Date(a.lastSeen));
  if(!ms.length||$('#modalRoot').innerHTML)return;
  const m=ms[0];
  modal(`<div style="display:flex;gap:12px;align-items:center">${mascot(56,level())}<h3>Welcome back?</h3></div><p style="margin:0">We found saved progress for <b>${esc(S.name)}</b> (${esc(S.cca)}): <b>${m.xp} XP</b>, last active ${new Date(m.lastSeen).toLocaleDateString('en-SG',{day:'numeric',month:'short'})}. Is this you?</p>`,
    [{label:'No, start fresh',ghost:true},{label:'Yes, restore it',fn:()=>{restoreFrom(m.sid)}}]);
}
async function restoreFrom(sid){
  try{const j=await (await fetch(BACKEND_URL+'?action=state&sid='+encodeURIComponent(sid)+'&t='+Date.now())).json();
    if(!j.ok||!j.state)return;const st=j.state;
    S.sid=sid;S.xp=st.xp||0;S.daily=st.daily||{};S.activity=st.activity||[];S.mistakes=st.mistakes||[];
    S.mods={};Object.keys(st.mods||{}).forEach(id=>{const m=st.mods[id]||{};S.mods[id]={page:m.page||0,maxPage:m.maxPage||0,ans:{},flags:m.flags||{},order:{},completed:!!m.completed,attemptId:m.attemptId,started:m.started}});
    if(j.name)S.name=j.name;
    save();renderHome();checkMyName();
    logActivity('Progress restored',S.xp+' XP',0);renderHome();
  }catch(e){}
}

  function addSlot(i,animateFrom){
    const s=W.steps[i];$('#wempty',p)&&$('#wempty',p).remove();
    const slot=el('div','slot');slot.innerHTML='<span class="sn">Step '+(i+1)+'</span><span class="st">'+s.t+'</span>';
    if(s.work)slot.insertAdjacentHTML('beforeend','<div class="work">'+(s.workHtml?s.work:(s.work.match(/[=^{]/)?M(s.work):s.work))+'</div>');
    solve.appendChild(slot);
    if(animateFrom){const a=animateFrom.getBoundingClientRect(),b=slot.getBoundingClientRect();
      slot.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px)`,opacity:.6},{transform:'translate(0,0)',opacity:1}],{duration:650,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
      setTimeout(()=>{slot.classList.add('lit');const sc=$('#scroll'),r=slot.getBoundingClientRect(),s=sc.getBoundingClientRect();if(r.bottom>s.bottom||r.top<s.top)sc.scrollBy({top:r.top-s.top-80,behavior:'smooth'})},650)}
    return slot;
  }
  const cellOK=id=>{const a=ansOf(W.id+'-'+id);return !!(a&&(a.solved||a.res==='missed'))};
  // Attach the step's interaction. Returns true if the step is already finished.
  function stepInputs(i,slot,cb){
    const s=W.steps[i];
    if(s.cells){
      const finish1=()=>slot.insertAdjacentHTML('beforeend','<div class="work">'+M(s.cells.map(c=>c[1]).join('+').replace(/\+-/g,'-'))+'</div>');
      s.cells.forEach(([id,a])=>{const c=$('#'+id,p);c.innerHTML='';
        answerBox(c,{key:W.id+'-'+id,type:'expr',ans:a,terms:1,placeholder:'?',sol:[[a,'']]},check);
        compactCell(c.querySelector('.qcard'));if(!cellOK(id))c.classList.add('glow')});
      if(s.cells.every(([id])=>cellOK(id))){finish1();return true}
      slot.insertAdjacentHTML('beforeend','<div class="small" data-cellnote>👉 Fill in the four cells in the grid above.</div>');
      function check(){s.cells.forEach(([id])=>{if(cellOK(id))$('#'+id,p).classList.remove('glow')});
        if(s.cells.every(([id])=>cellOK(id))&&!slot.querySelector('.work')){const n=slot.querySelector('[data-cellnote]');n&&n.remove();finish1();cb()}}
      return false}
    if(s.input){const h=el('div');slot.appendChild(h);const key=W.id+'-in'+i;
      renderQ(h,Object.assign({type:'expr',sol:[[String(s.input.ans),'']]},s.input),{key,placeholder:'Type this line'},()=>cb());
      return resolved(key)}
    return true;
  }
  function afterStep(i){if(W.steps[i].final)finish();else showOptions()}
  function showOptions(){
    stepsBox.innerHTML='';fb.hidden=true;
    if(st.done>=W.steps.length){pick.hidden=true;return}
    pick.hidden=false;
    m.order[W.id].forEach(code=>{const isStep=code[0]==='s',idx=+code.slice(1);if(isStep&&idx<st.done)return;
      const txt=isStep?W.steps[idx].t:W.distract[idx].t;const b=el('button','stepbtn',txt);
      b.onclick=()=>{
        if(isStep&&idx===st.done){const slot=addSlot(idx,b);glow(W.steps.map(s=>s.glow||[]).flat(),false);glow(W.steps[idx].glow,true);pick.hidden=true;st.done++;save();
          if(stepInputs(idx,slot,()=>afterStep(idx)))afterStep(idx);return}
        b.classList.remove('no');void b.offsetWidth;b.classList.add('no');fb.hidden=false;fb.className='fb warn';
        fb.innerHTML='🤔 '+(isStep?(W.steps[idx].nudge||'That step comes later. What has to happen first?'):W.distract[idx].why);
      };stepsBox.appendChild(b)});
  }
  function finish(){if(!flag(W.id)){addXP(20);logActivity(W.title+' · '+curMod.title,'Solution built',20)}setFlag(W.id);
    if(!$('.we-done',p)){const d=el('div','fb good we-done','🎉 Solution complete! Read your steps from top to bottom: that is exactly what your written working should look like.');solve.appendChild(d)}}
  // restore saved progress
  for(let i=0;i<st.done;i++){const slot=addSlot(i);
    const finished=stepInputs(i,slot,()=>afterStep(i));
    if(!finished){glow(W.steps[i].glow,true);pick.hidden=true;return}
    if(i===st.done-1)glow(W.steps[i].glow,true)}
  if(st.done&&W.steps[st.done-1].final){finish();pick.hidden=true;return}
  showOptions();
}

function b64ToBytes(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function downloadWorksheet(mid){
  const name='Mission'+mid.slice(1)+'-'+curMod.title.replace(/[^A-Za-z]+/g,'-')+'-Worksheet.pdf';
  let b64=WS_PDF[mid];
  if(!b64&&BACKEND_URL){try{const j=await (await fetch(BACKEND_URL+'?action=ws&m='+mid+'&t='+Date.now())).json();if(j&&j.ok)b64=j.b64}catch(e){}}
  if(!b64)return 'nofile';
  let blob;try{blob=new Blob([b64ToBytes(b64)],{type:'application/pdf'})}catch(e){return 'failed'}
  if(window.claude&&window.claude.use){
    let d=null;try{d=await window.claude.use('downloads')}catch(e){}
    if(d){try{await d.save({filename:name,data:blob});return 'saved'}catch(e){return e&&e.code==='declined'?'declined':'failed'}}
  }
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);return 'started'}catch(e){return 'failed'}
}

/* =====================================================================
   MISTAKE FILE — every practice/worksheet question missed on both tries is saved.
   It comes back later as a FRESH question on the same skill (new numbers each time):

function rng(seed){let s=Math.abs(Math.floor(seed))%2147483647;if(s===0)s=1;return()=>(s=s*16807%2147483647)/2147483647}
function ri(r,a,b){return a+Math.floor(r()*(b-a+1))}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
/* polynomial text from [[coef,'x^2'],[coef,'x'],[coef,'']] — keeps every listed term (used for unsimplified lines too) */
function poly(terms){let s='';terms.forEach(([c,v])=>{if(c===0)return;const a=Math.abs(c);const body=(a===1&&v?'':String(a))+v;s+=s?(c<0?'-':'+')+body:(c<0?'-':'')+body});return s||'0'}
function lin(a,b,v){v=v||'x';return '('+poly([[a,v],[b,'']])+')'}
function twinOf(mk){const d=MDEF[mk.mission];if(!d||!mk.qkey)return null;const q=[...d.PRACTICE,...d.WSQ].find(z=>z.key===mk.qkey);return q&&q.twin?qMerge(q,q.twin):null}
function reviewQ(mk,seed){return GEN[mk.skill]?GEN[mk.skill](seed):twinOf(mk)}
function openMistakes(){return (S.mistakes||[]).filter(x=>!x.fixed&&(GEN[x.skill]||twinOf(x)))}
function addMistake(cfg){
  if(!curMod||!cfg.track||!MD)return;
  const q=[...PRACTICE,...WSQ].find(z=>z.key===cfg.key);
  if(!GEN[cfg.track.skill]&&!(q&&q.twin))return;
  S.mistakes=S.mistakes||[];
  if(S.mistakes.some(x=>x.mission===curMod.id&&x.from===cfg.track.round))return;
  S.mistakes.push({id:'mk'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),mission:curMod.id,missionN:curMod.n,qkey:cfg.key,skill:cfg.track.skill,from:cfg.track.round,q:textify(cfg.track.q||''),added:Date.now(),fixed:false,reviews:0});
  save();
}
/* pick up to n open mistakes, one per skill, oldest first; optionally skip the current mission's own mistakes */
function pickMistakes(n,excludeMission){
  const seen=new Set(),out=[];
  openMistakes().filter(x=>x.mission!==excludeMission).sort((a,b)=>a.added-b.added).forEach(x=>{if(out.length<n&&!seen.has(x.skill)){seen.add(x.skill);out.push(x)}});
  return out;
}

/* =====================================================================
   GENERIC MISSION ENGINE
   Missions 2–16 are pure data (src/missions/mN.js → MDEF.mN). This file turns that data into
   pages, and provides the extra question types and interactive tools they use.
   Mission 1 keeps its hand-built pages (MDEF.m1.PAGES) but shares everything below.
   ===================================================================== */

/* ---------- small helpers ---------- */
const dg=d=>typeof d==='function'?d():(d||'');                     // diagram: string or function
function qMerge(parent,twin){const o=Object.assign({},parent,twin);delete o.twin;return o}
function numVal(v){                                                   // number, or expression with no letters: "5/2", "-3", "√5", "2π"
  if(typeof v==='number')return v;
  const s=normExpr(v);if(/[a-z]/.test(s.replace(/sqrt|pi/g,'')))return NaN;
  try{return compile(s)({})}catch(e){return NaN}}

/* ---------- AUTO hooks (used only by the automated tests) ---------- */
window.__AUTO=window.__AUTO||{};

/* =====================================================================
   QUESTION DISPATCHER — every question in every mission goes through here
   q: the question object from the mission data (already merged with its twin when needed)
   extra: {key, xp, track, placeholder, ask}
   ===================================================================== */
function renderQ(host,q,extra,onResolve){
  const cfg=Object.assign({},q,extra);
  if(cfg.type==='mcq')return mcq(host,cfg,onResolve);
  if(cfg.type==='multi')return multiBox(host,cfg,onResolve);
  if(cfg.type==='plot')return plotBox(host,cfg,onResolve);
  if(cfg.type==='numline')return numlineBox(host,cfg,onResolve);
  return answerBox(host,cfg,onResolve);       // expr, num, ineq
}

/* Shared 2-try state machine for the new question types (same rules as answerBox):
   1st wrong → hint glows; 2nd wrong → full working + ask-a-friend; can still answer, no XP. */
function twoTry(host,cfg,onResolve,build){
  const m=S.mods[curMod.id];const st=m.ans[cfg.key]||(m.ans[cfg.key]={tries:0,res:null,solved:false});const t0=Date.now();
  const wrap=el('div','qcard');
  if(cfg.ask)wrap.appendChild(el('div','ask','✏️ '+cfg.ask));
  const body=el('div');wrap.appendChild(body);
  const row=el('div','ansrow');const chk=el('button','btn','Check');row.appendChild(chk);
  let hb=null;if(cfg.hint){hb=el('button','btn hint','💡 Hint');row.appendChild(hb)}
  const hintBox=el('div','hintbox');hintBox.hidden=true;hintBox.innerHTML='<b>💡 Think about it:</b> '+(cfg.hint||'');
  const fb=el('div','fb');fb.hidden=true;
  const askf=el('div','askfriend','🤝 Two tries used. Have a look at the working below, then talk it through with a friend or your teacher. You can still answer, but no XP this time.');askf.hidden=true;
  const sol=el('div','sol');sol.hidden=true;if(cfg.sol)sol.innerHTML=solHTML(cfg.sol,cfg.solTitle);
  wrap.append(row,hintBox,fb,askf,sol);host.appendChild(wrap);
  if(hb)hb.onclick=()=>{hintBox.hidden=!hintBox.hidden;hb.classList.remove('glow');st.hintSeen=true;save()};
  const show=(k,msg)=>{fb.hidden=false;fb.className='fb '+k;fb.innerHTML=msg};
  const W=build(body,st,show);           // returns {read():value|null, check(v):true|false|{nudge}, lock(), reveal(), text(v), auto()}
  function paint(){
    if(st.solved){chk.disabled=true;W.lock&&W.lock();if(hb)hb.classList.remove('glow')}
    if(st.res==='missed'){askf.hidden=false;sol.hidden=!cfg.sol;W.reveal&&W.reveal()}
    if(st.solved&&st.res==='first')show('good','✓ Correct on the first try!');
    else if(st.solved&&st.res==='second')show('good','✓ Correct! Nice recovery.');
    else if(st.solved&&st.res==='missed')show('good','✓ That\'s it. The method is yours now.');
    else if(st.tries===1){show('warn','Not quite. '+(cfg.hint?'Tap <b>💡 Hint</b> and have one more go.':'Check your work and have one more go.'));if(hb&&!st.hintSeen)hb.classList.add('glow')}
  }
  function check(){
    if(st.solved)return;
    const v=W.read();if(v==null)return;
    const r=W.check(v);
    if(r&&r.nudge){show('warn',r.nudge);return}
    const ok=r===true;st.last=v;
    if(st.res==='missed'){if(ok){st.solved=true;save();paint()}else show('warn','Compare your answer with the working below, step by step.');return}
    if(ok){st.res=st.tries===0?'first':'second';st.solved=true;if(cfg.xp)addXP(st.res==='first'?cfg.xp[0]:cfg.xp[1]);save();paint();trackResult(cfg,st.res,st,t0);onResolve&&onResolve(st.res);return}
    (st.wrong=st.wrong||[]).push(W.text?W.text(v):String(v));st.tries++;
    wrap.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:280});
    if(st.tries>=2){st.res='missed';fb.hidden=true;save();paint();trackResult(cfg,'missed',st,t0);onResolve&&onResolve('missed');return}
    save();paint();
  }
  chk.onclick=check;W.onEnter=check;
  window.__AUTO[cfg.key]=()=>{W.auto();check()};
  paint();return st;
}

/* ---------- several answers checked together (x and y, two roots, a table row) ---------- */
const mneg=v=>String(v).replace(/^-(?=\d)/,'−');   // table numbers: proper minus sign
function multiBox(host,cfg,onResolve){
  cfg=Object.assign({ask:cfg.layout==='table'?'Fill in every empty box in the table.':'Type each answer in its own box.'},cfg);
  return twoTry(host,cfg,onResolve,(body,st)=>{
    const F=cfg.fields;st.vals=st.vals||F.map(()=>'');
    let inner;
    if(cfg.layout==='table'){
      inner=el('div','mtable');
      const t=el('table');
      t.innerHTML=`<tr><th>${cfg.colHead||''}</th>${cfg.cols.map(c=>`<th>${mneg(c)}</th>`).join('')}</tr><tr><th>${cfg.rowHead||''}</th>${F.map((f,i)=>f.given!=null?`<td class="given">${mneg(f.given)}</td>`:`<td><input class="ans mf" data-i="${i}" autocomplete="off" spellcheck="false" autocapitalize="off"></td>`).join('')}</tr>`;
      inner.appendChild(t);
    }else{
      inner=el('div','mfields');
      F.forEach((f,i)=>{const w=el('label','mfield');w.innerHTML=`<span class="mlab">${f.label||''}</span><input class="ans mf" data-i="${i}" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="${f.ph||'?'}">${f.after?`<span class="mlab">${f.after}</span>`:''}`;inner.appendChild(w)});
    }
    body.appendChild(inner);
    const ins=[...inner.querySelectorAll('input.mf')];
    ins.forEach(inp=>{const i=+inp.dataset.i;inp.id='in-'+cfg.key+'-'+i;inp.value=st.vals[i]||'';
      inp.oninput=()=>{st.vals[i]=inp.value;save()};inp.onkeydown=e=>{if(e.key==='Enter')W.onEnter()}});
    const fieldOK=(f,v)=>{if(f.type==='expr'){const r=equiv(v,String(f.ans));return r===true}const n=numVal(v);return isFinite(n)&&Math.abs(n-numVal(f.ans))<(f.tol||1e-9)};
    const W={
      read(){const vals=F.map((f,i)=>f.given!=null?String(f.given):(inner.querySelector(`input[data-i="${i}"]`).value.trim()));
        if(vals.some(v=>v===''))return null;return vals},
      check(vals){
        const open=F.map((f,i)=>i).filter(i=>F[i].given==null);
        for(const i of open){const f=F[i];if(f.type!=='expr'&&!isFinite(numVal(vals[i])))return {nudge:'Type a number in each box (fractions like 5/2 are fine).'}}
        if(cfg.orderless){const want=open.map(i=>F[i]),got=open.map(i=>vals[i]);const used=new Set();
          return got.every(v=>{const j=want.findIndex((f,k)=>!used.has(k)&&fieldOK(f,v));if(j<0)return false;used.add(j);return true})}
        return open.every(i=>fieldOK(F[i],vals[i]))},
      text(vals){return F.map((f,i)=>f.given!=null?null:((f.label||'').replace(/<[^>]+>/g,'')+' '+vals[i]).trim()).filter(Boolean).join(', ')},
      lock(){ins.forEach(i=>{i.disabled=true;i.classList.add('ok')})},
      reveal(){},
      auto(){ins.forEach(inp=>{const f=F[+inp.dataset.i];inp.value=String(f.ans);st.vals[+inp.dataset.i]=inp.value})}
    };
    if(cfg.preview!==false)ins.forEach(inp=>attachPreview(inp));
    return W;
  });
}

/* =====================================================================
   COORDINATE GRID — draw graphs (display) and tap-to-plot questions
   grid:{xmin,xmax,ymin,ymax,step?,ystep?,label?}; fns:[{fn:'2x+1',color,label,dom:[a,b]}]
   ===================================================================== */
const GCOL=['#2E66F5','#EE5A3C','#17A564','#7A4DFF'];let GRIDN=0;
function gridSVG(G,opts){
  opts=opts||{};
  const xs=G.step||1,ys=G.ystep||xs;
  const nx=(G.xmax-G.xmin)/xs,ny=(G.ymax-G.ymin)/ys;
  const u=Math.max(26,Math.min(48,Math.floor(560/Math.max(nx,ny*0.75))));   // px per grid square: big enough for fingers
  const pad=46,W=nx*u+pad*2,H=ny*u+pad*2;
  const X=x=>pad+(x-G.xmin)/xs*u,Y=y=>pad+(G.ymax-y)/ys*u,afs=Math.min(22,Math.max(14,Math.round(W/30))),lfs=Math.min(26,Math.max(18,Math.round(W/25)));
  let s=`<svg class="grid-svg" viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" data-u="${u}" role="img" aria-label="${esc(opts.aria||'Coordinate grid')}">`;
  const cid='gclip'+(++GRIDN);
  s+=`<defs><clipPath id="${cid}"><rect x="${pad}" y="${pad}" width="${nx*u}" height="${ny*u}"/></clipPath></defs>`;
  s+=`<rect x="${pad}" y="${pad}" width="${nx*u}" height="${ny*u}" fill="#fff"/>`;
  for(let i=0;i<=nx;i++)s+=`<line x1="${X(G.xmin+i*xs)}" y1="${pad}" x2="${X(G.xmin+i*xs)}" y2="${H-pad}" stroke="#D9D5E8" stroke-width="1"/>`;
  for(let j=0;j<=ny;j++)s+=`<line x1="${pad}" y1="${Y(G.ymin+j*ys)}" x2="${W-pad}" y2="${Y(G.ymin+j*ys)}" stroke="#D9D5E8" stroke-width="1"/>`;
  const ax0=Math.min(Math.max(0,G.xmin),G.xmax),ay0=Math.min(Math.max(0,G.ymin),G.ymax);
  // axes with arrowheads
  s+=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1A2C"/></marker></defs>`;
  s+=`<line x1="${pad-14}" y1="${Y(ay0)}" x2="${W-pad+16}" y2="${Y(ay0)}" stroke="#1D1A2C" stroke-width="2" marker-end="url(#ah)"/>`;
  s+=`<line x1="${X(ax0)}" y1="${H-pad+14}" x2="${X(ax0)}" y2="${pad-16}" stroke="#1D1A2C" stroke-width="2" marker-end="url(#ah)"/>`;
  s+=`<text x="${W-pad+14}" y="${Y(ay0)-8}" font-family="STIX Two Text,serif" font-style="italic" font-size="18" fill="#1D1A2C">${G.xlab||'x'}</text>`;
  s+=`<text x="${X(ax0)+8}" y="${pad-6}" font-family="STIX Two Text,serif" font-style="italic" font-size="18" fill="#1D1A2C">${G.ylab||'y'}</text>`;
  // numbers sit next to the actual axis lines (not the grid edge); skip the x-axis 0 (the y-axis shows it)
  const lx=G.labelEvery||1,ly=G.ylabelEvery||lx;
  for(let i=0;i<=nx;i++){const v=+(G.xmin+i*xs).toFixed(6);if(v===0||Math.round(v/xs)%lx)continue;
    s+=`<text x="${X(v)}" y="${Y(ay0)+6+afs}" text-anchor="middle" font-family="Lexend,sans-serif" font-size="${afs}" fill="#1D1A2C">${String(v).replace('-','−')}</text>`}
  for(let j=0;j<=ny;j++){const v=+(G.ymin+j*ys).toFixed(6);if(Math.round(v/ys)%ly)continue;
    s+=`<text x="${X(ax0)-7}" y="${Y(v)+afs*0.35}" text-anchor="end" font-family="Lexend,sans-serif" font-size="${afs}" fill="#1D1A2C">${String(v).replace('-','−')}</text>`}
  // graphs
  (opts.fns||[]).forEach((f,k)=>{const c=f.color||GCOL[k%4];let fn;try{fn=compile(f.fn)}catch(e){return}
    const env=Object.assign({},opts.env||{});const [a,b]=f.dom||[G.xmin,G.xmax];let d='',pen=false;
    for(let t=0;t<=400;t++){const x=a+(b-a)*t/400;env.x=x;const y=fn(env);
      if(!isFinite(y)||y<G.ymin-(G.ymax-G.ymin)*.05||y>G.ymax+(G.ymax-G.ymin)*.05){pen=false;continue}
      d+=(pen?'L':'M')+X(x).toFixed(1)+','+Y(y).toFixed(1);pen=true}
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" clip-path="url(#${cid})"/>`;
    if(f.label){const lxv=f.lx!=null?f.lx:a+(b-a)*0.82;env.x=lxv;const lyv=fn(env);env.x=lxv+0.01;const slope=(fn(env)-lyv)/0.01;
      const tw=String(f.label).replace(/<[^>]+>/g,'').length*lfs*0.5;const lab=/</.test(f.label)?f.label:String(f.label).replace(/\b([a-z])\b/g,'<tspan font-style="italic">$1</tspan>');
      // rising line: label up-left of the point; falling line: label up-right, so the line never runs through it
      let anchor='end',tx=Math.min(W-pad-4,X(lxv)+6);
      if(slope<-1e-9){anchor='start';tx=X(lxv)+8;if(tx+tw>W-pad){anchor='end';tx=X(lxv)-8}}
      if(isFinite(lyv))s+=`<text x="${tx}" y="${Math.max(pad+16,Math.min(H-pad-6,Y(lyv)-10))}" text-anchor="${anchor}" font-family="STIX Two Text,serif" font-size="${lfs}" font-weight="600" fill="${c}" paint-order="stroke" stroke="#fff" stroke-width="5">${lab}</text>`}});
  (opts.vlines||[]).forEach(v=>{s+=`<line x1="${X(v.x)}" y1="${pad}" x2="${X(v.x)}" y2="${H-pad}" stroke="${v.color||'#7A4DFF'}" stroke-width="2.5" stroke-dasharray="7 5"/>`;
    if(v.label)s+=`<text x="${X(v.x)+6}" y="${pad+16}" font-family="STIX Two Text,serif" font-size="16" fill="${v.color||'#7A4DFF'}">${v.label}</text>`});
  (opts.points||[]).forEach(pt=>{s+=`<circle cx="${X(pt.x)}" cy="${Y(pt.y)}" r="6" fill="${pt.color||'#1D1A2C'}"/>`;
    if(pt.label)s+=`<text x="${X(pt.x)+9}" y="${Y(pt.y)-9}" font-family="STIX Two Text,serif" font-size="15" fill="#1D1A2C" paint-order="stroke" stroke="#fff" stroke-width="4">${pt.label}</text>`});
  s+=`<g class="plotlayer"></g></svg>`;
  return {svg:s,X,Y,u,pad,W,H};
}
function graphHTML(spec){return '<div class="diagwrap gridwrap">'+gridSVG(spec.grid,spec).svg+'</div>'}

/* tap-to-plot question: student places the target points (tap again to remove) */
function plotBox(host,cfg,onResolve){
  cfg=Object.assign({ask:'Plot the points on the grid.'},cfg);
  return twoTry(host,cfg,onResolve,(body,st)=>{
    st.pts=st.pts||[];
    const G=cfg.grid,snap=cfg.snap||G.step||1;
    const g=gridSVG(G,{fns:cfg.show||[],vlines:cfg.showV||[],points:cfg.given||[],aria:'Grid for plotting'});
    const wrap=el('div','diagwrap gridwrap plotwrap',g.svg);body.appendChild(wrap);
    body.appendChild(el('div','small','👆 Tap a grid point to place a point. Tap it again to remove it.'));
    const svg=wrap.querySelector('svg'),layer=svg.querySelector('.plotlayer');
    let locked=false,showAns=false;
    const key=p=>p[0].toFixed(4)+','+p[1].toFixed(4);
    function draw(){
      let s='';
      if(showAns)cfg.target.forEach(p=>{s+=`<circle cx="${g.X(p[0])}" cy="${g.Y(p[1])}" r="9" fill="none" stroke="#17A564" stroke-width="3" stroke-dasharray="4 3"/>`});
      if(cfg.line&&st.solved&&st.pts.length>=2){const ps=st.pts.slice().sort((a,b)=>a[0]-b[0]);
        if(cfg.line==='curve'){   // smooth curve through the points (Catmull-Rom → cubic Bézier), never ruler-straight
          const P=ps.map(p=>[g.X(p[0]),g.Y(p[1])]);let d='M'+P[0][0]+','+P[0][1];
          for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
            const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
            d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}s+=`<path d="${d}" fill="none" stroke="#2E66F5" stroke-width="3"/>`}
        else{const [a,b]=[ps[0],ps[ps.length-1]];const m=(b[1]-a[1])/((b[0]-a[0])||1e-9);const x1=G.xmin,x2=G.xmax;
          s+=`<line x1="${g.X(x1)}" y1="${g.Y(a[1]+m*(x1-a[0]))}" x2="${g.X(x2)}" y2="${g.Y(a[1]+m*(x2-a[0]))}" stroke="#2E66F5" stroke-width="3" clip-path="inset(0)"/>`}}
      st.pts.forEach(p=>{s+=`<circle cx="${g.X(p[0])}" cy="${g.Y(p[1])}" r="8" fill="${st.solved?'#17A564':'#EE5A3C'}" stroke="#1D1A2C" stroke-width="2"/>`});
      layer.innerHTML=s;
    }
    svg.addEventListener('pointerdown',e=>{
      if(locked)return;e.preventDefault();
      const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
      const x=G.xmin+(q.x-g.pad)/g.u*(G.step||1),y=G.ymax-(q.y-g.pad)/g.u*(G.ystep||G.step||1);
      const sx=Math.round(x/snap)*snap,sy=Math.round(y/(cfg.ysnap||snap))*(cfg.ysnap||snap);
      if(Math.hypot((x-sx)/(G.step||1),(y-sy)/(G.ystep||G.step||1))>0.48)return;               // generous, distance-based
      if(sx<G.xmin||sx>G.xmax||sy<G.ymin||sy>G.ymax)return;
      const k=key([sx,sy]),i=st.pts.findIndex(p=>key(p)===k);
      if(i>=0)st.pts.splice(i,1);else st.pts.push([+sx.toFixed(6),+sy.toFixed(6)]);
      save();draw();
    });
    draw();
    const same=(a,b)=>a.length===b.length&&a.every(p=>b.some(q=>Math.abs(p[0]-q[0])<1e-6&&Math.abs(p[1]-q[1])<1e-6));
    return {
      read(){return st.pts.length?st.pts.map(p=>p.slice()):null},
      check(v){if(cfg.minPts&&v.length<cfg.minPts)return {nudge:'Plot at least '+cfg.minPts+' points.'};
        if(v.length<cfg.target.length&&v.every(p=>cfg.target.some(q=>Math.abs(p[0]-q[0])<1e-6&&Math.abs(p[1]-q[1])<1e-6)))return {nudge:'Those points are right so far. Plot all '+cfg.target.length+' points.'};
        return same(v,cfg.target)},
      text(v){return 'points '+v.map(p=>'('+p[0]+', '+p[1]+')').join(' ')},
      lock(){locked=true;draw()},
      reveal(){showAns=true;draw()},
      auto(){st.pts=cfg.target.map(p=>p.slice());draw()}
    };
  });
}

/* =====================================================================
   NUMBER LINE — show an inequality: place the circle, open or closed, and the direction
   ans:{v:2, closed:false, dir:'right'}; range:[-5,5]
   ===================================================================== */
function numlineSVG(range,st,showAns,ans){
  const [a,b]=range,n=b-a,u=Math.max(34,Math.min(56,Math.floor(560/n))),pad=28,W=n*u+pad*2,H=126,Y=64;
  const X=v=>pad+(v-a)*u,fs=Math.max(15,Math.round(W/24)),cr=Math.max(10,Math.round(W/48));   // text and circles scale with the drawing so they stay readable on phones
  let s=`<svg class="nl-svg" viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="Number line">`;
  s+=`<defs><marker id="nah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1A2C"/></marker></defs>`;
  s+=`<line x1="${pad-18}" y1="${Y}" x2="${W-pad+18}" y2="${Y}" stroke="#1D1A2C" stroke-width="2" marker-end="url(#nah)" marker-start="url(#nah)"/>`;
  for(let v=a;v<=b;v++){s+=`<line x1="${X(v)}" y1="${Y-8}" x2="${X(v)}" y2="${Y+8}" stroke="#1D1A2C" stroke-width="2"/><text x="${X(v)}" y="${Y+18+fs}" text-anchor="middle" font-family="Lexend,sans-serif" font-size="${fs}" fill="#1D1A2C">${String(v).replace('-','−')}</text>`}
  const drawRay=(o,col)=>{if(o.v==null)return '';let r='';
    if(o.dir){const end=o.dir==='right'?W-pad+8:pad-8;r+=`<line x1="${X(o.v)}" y1="${Y-26}" x2="${end}" y2="${Y-26}" stroke="${col}" stroke-width="5" marker-end="url(#nah)"/><line x1="${X(o.v)}" y1="${Y-26}" x2="${X(o.v)}" y2="${Y-8}" stroke="${col}" stroke-width="3"/>`}
    r+=`<circle cx="${X(o.v)}" cy="${Y-26}" r="${cr}" fill="${o.closed?col:'#fff'}" stroke="${col}" stroke-width="3.5"/>`;return r};
  if(showAns&&ans)s+=`<g opacity=".55">${drawRay(ans,'#17A564')}</g>`;
  s+=drawRay(st,'#EE5A3C');
  return {svg:s+'</svg>',X,u,pad};
}
function numlineBox(host,cfg,onResolve){
  cfg=Object.assign({ask:'Show the answer on the number line.'},cfg);
  return twoTry(host,cfg,onResolve,(body,st)=>{
    st.nl=st.nl||{v:null,closed:null,dir:null};
    const box=el('div','diagwrap nlwrap');body.appendChild(box);
    const ctr=el('div','ansrow nlctrl');
    ctr.innerHTML=`<span class="small">Circle:</span><button class="btn ghost" data-c="0">○ open</button><button class="btn ghost" data-c="1">● closed</button><span class="small" style="margin-left:8px">Arrow:</span><button class="btn ghost" data-d="left">← left</button><button class="btn ghost" data-d="right">right →</button>`;
    body.appendChild(ctr);body.appendChild(el('div','small','👆 Tap the number line to place the circle, then choose open or closed, and the arrow direction.'));
    let locked=false,showAns=false;
    function draw(){const g=numlineSVG(cfg.range,st.nl,showAns,cfg.ans);box.innerHTML=g.svg;
      ctr.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('sel',String(+st.nl.closed)===b.dataset.c&&st.nl.closed!=null));
      ctr.querySelectorAll('[data-d]').forEach(b=>b.classList.toggle('sel',st.nl.dir===b.dataset.d));
      const svg=box.querySelector('svg');
      svg.addEventListener('pointerdown',e=>{if(locked)return;e.preventDefault();const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
        const v=Math.round(cfg.range[0]+(q.x-g.pad)/g.u);if(v<cfg.range[0]||v>cfg.range[1])return;st.nl.v=v;save();draw()})}
    ctr.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(locked)return;st.nl.closed=b.dataset.c==='1';save();draw()});
    ctr.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(locked)return;st.nl.dir=b.dataset.d;save();draw()});
    draw();
    return {
      read(){const n=st.nl;if(n.v==null||n.closed==null||!n.dir)return null;return {v:n.v,closed:n.closed,dir:n.dir}},
      check(v){return v.v===cfg.ans.v&&v.closed===cfg.ans.closed&&v.dir===cfg.ans.dir},
      text(v){return (v.closed?'closed':'open')+' circle at '+v.v+', arrow '+v.dir},
      lock(){locked=true;ctr.querySelectorAll('button').forEach(b=>b.disabled=true)},
      reveal(){showAns=true;draw()},
      auto(){st.nl={v:cfg.ans.v,closed:cfg.ans.closed,dir:cfg.ans.dir};draw()}
    };
  });
}
function blankNumline(range){return numlineSVG(range,{v:null},false).svg}

   Static version for flips, worked examples and the summary; live version to try pairs.
