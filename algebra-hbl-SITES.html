 goals:[
  'explain why '+M('ax+by=c')+' has infinitely many solutions, and check whether a point lies on a line',
  'complete a table of values and draw the graph of '+M('ax+by=c'),
  'rearrange '+M('ax+by=c')+' into the form '+M('y=mx+c')+' and read off the gradient and the '+M('y')+'-intercept',
  'find where a line cuts the '+M('x')+'-axis and the '+M('y')+'-axis',
  'recognise and write down horizontal lines '+M('y=k')+' and vertical lines '+M('x=h')
 ],
 hook:{

  poll:{q:'How many pairs (x, y) make 2x + y = 8 true?',opts:['Just one pair','A few pairs, like 4','Infinitely many pairs'],right:2,
    feedback:['Try a few: (1, 6) works. Does (2, 4) work too? Look at the graph below.','You can find more than 4! Is (2.5, 3) a solution? Look at the graph below.','Yes! Every point on the line works. Play with the graph below.']},
  widget:{type:'graph',title:'Drag the sliders: graph of ax + by = c',grid:{xmin:-2,xmax:6,ymin:-2,ymax:10},
    fns:[{fn:'(c-a*x)/b',label:'ax + by = c'}],
    sliders:[{var:'a',min:-3,max:4,step:1,value:2},{var:'b',min:1,max:4,step:1,value:1},{var:'c',min:-6,max:12,step:1,value:8}],
    note:'Start at a = 2, b = 1, c = 8: that is 2x + y = 8. Now change a, b and c. Can you ever make it bend?'},
  reveal:'<b>Infinitely many!</b> '+M('(1, 6)')+', '+M('(2, 4)')+', '+M('(3, 2)')+', even '+M('(2.5, 3)')+': every point on the line makes '+M('2x+y=8')+' true. And whatever '+M('a')+', '+M('b')+' and '+M('c')+' you choose, the graph is always a <b>straight line</b>. That is why '+M('ax+by=c')+' is called a <b>linear</b> equation.'+
    m11G({grid:{xmin:-1,xmax:6,ymin:-2,ymax:9},fns:[{fn:'8-2x',label:'2x + y = 8',lx:0.3}],points:[{x:1,y:6,label:'(1, 6)'},{x:2,y:4,label:'(2, 4)'},{x:3,y:2,label:'(3, 2)'}]})

/* =====================================================================
   MISSION 12 — Simultaneous Equations: Substitution & Elimination   (syllabus N7.8)
   Two equations, two unknowns, ONE pair (x, y) that fits both.
   ===================================================================== */

/* ---------- helpers (all prefixed m12) ---------- */
function m12Eq(a,b,c,u,v){return poly([[a,u||'x'],[b,v||'y']])+'='+c}                 // "3x-2y=7"
function m12N(n){return String(n).replace('-','−')}                                    // number for plain text
function m12P(x,y){return '('+m12N(x)+', '+m12N(y)+')'}                                // "(3, −1)" plain text
function m12C(a,x){return (a===1?'':a===-1?'-':a)+'('+x+')'}                           // "3(2)", "-(4)"
function m12Sub(a,b,x,y){const s=(a===1?String(x):m12C(a,x)),t=m12C(Math.abs(b),y);return s+(b<0?'-':'+')+t}   // "3(2)-2(-1)"
function m12Cb(a,x){return a===1?String(x):m12C(a,x)}                                  // bare number when the coefficient is 1
function m12XY(x,y){return [{label:M('x')+' =',ans:x,v:'x'},{label:M('y')+' =',ans:y,v:'y'}]}
function m12Lines(L){return L.map(l=>'<div>'+M(l)+'</div>').join('')}
function m12Pair(a,b){return '<div class="formula" style="text-align:left;display:inline-block;min-width:240px">'+M(a)+' &nbsp;<span class="small">(1)</span><br>'+M(b)+' &nbsp;<span class="small">(2)</span></div>'}

/* ---------- hook: bubble tea + kaya toast price finder ---------- */
function m12HookRows(b,k){
  const c1=b+2*k,c2=2*b+k,ok1=Math.abs(c1-7)<1e-9,ok2=Math.abs(c2-9.5)<1e-9;
  const row=(ok,txt,want)=>`<div style="border-radius:10px;padding:8px 10px;margin-top:6px;font-weight:600;background:${ok?'#DDF5E8':'#FFF3C4'};color:${ok?'#0E6B40':'#7A5300'}">${txt}<div style="font-weight:500;font-size:14px">${ok?'✓ matches':'✗ should be '+want}</div></div>`;
  let msg;
  if(ok1&&ok2)msg='🎉 <b>Both clues match!</b> Bubble tea $4.00 and kaya toast $1.50. Is there any other pair that works? Try to find one.';
  else if(ok1)msg='Clue 1 is happy… but Clue 2 is not. Keep Clue 1 happy and look for a pair that pleases <b>both</b>.';
  else if(ok2)msg='Clue 2 is happy, but Clue 1 is not. Can you please both at once?';
  else msg='Neither clue matches yet. Slide the prices.';
  return row(ok1,'🧾 Clue 1: 1 🧋 + 2 🍞 = $'+c1.toFixed(2),'$7.00')+row(ok2,'🧾 Clue 2: 2 🧋 + 1 🍞 = $'+c2.toFixed(2),'$9.50')+'<div class="small" style="margin-top:8px">'+msg+'</div>';
}
function m12Hook(){
  const b=+document.getElementById('m12hb').value,k=+document.getElementById('m12hk').value;
  document.getElementById('m12hbv').textContent='$'+b.toFixed(2);document.getElementById('m12hkv').textContent='$'+k.toFixed(2);
  document.getElementById('m12hout').innerHTML=m12HookRows(b,k);
}

     hint:'Compare the y-terms. What can you multiply the first equation by so they match? Then add or subtract?',sol}},
 'Rearrange before solving':seed=>{const r=rng(seed);let x0,y0,a1,b,a2;
   do{x0=ri(r,1,6);y0=ri(r,-2,6);a1=ri(r,2,5);b=ri(r,1,4);a2=ri(r,1,4)}while(a1*x0-b*y0===0);
   const c1=a1*x0-b*y0,c2=a2*x0+b*y0,shown=poly([[a1,'x']])+'='+poly([[b,'y'],[c1,'']]);
   const sol=[[shown,'(1)'],[m12Eq(a2,b,c2),'(2)'],[m12Eq(a1,-b,c1),'rearrange (1) → (3)'],[poly([[a1+a2,'x']])+'='+(c1+c2),'(3) + (2)'],['x='+x0,''],
     [m12Cb(a2,x0)+'+'+poly([[b,'y']])+'='+c2,'sub. into (2)']];
   if(b!==1)sol.push([poly([[b,'y']])+'='+(c2-a2*x0),'']);
   sol.push(['y='+y0,''],[m12C(a1,x0)+'='+(b===1?(y0<0?'('+y0+')':String(y0)):m12C(b,y0))+(c1<0?'-':'+')+Math.abs(c1),'✓ check in (1)']);
   return {type:'multi',q:'Solve the simultaneous equations '+M(shown)+' and '+M(m12Eq(a2,b,c2))+'.',fields:m12XY(x0,y0),verify:{eq:[shown,m12Eq(a2,b,c2)]},
     hint:'Can you move the y-term in the first equation to the left so it looks like ax + by = c? Then which letter matches?',sol}}
});

  'solve by <b>elimination</b>: add or subtract when coefficients match, or multiply first to make them match',

  'handle answers that are negative or fractions, and always check in the other equation'
 ],

  reveal:'<b>Clue 1 alone has lots of answers:</b> $1 + 2 × $3, $3 + 2 × $2, $5 + 2 × $1, … all make $7. Only <b>one</b> pair also fits Clue 2: bubble tea <b>$4.00</b>, kaya toast <b>$1.50</b>.<div style="margin-top:8px">Let '+M('b')+' be the price of a bubble tea and '+M('k')+' the price of a kaya toast, in dollars:</div><div style="text-align:center;margin-top:6px">'+m12Pair('b+2k=7','2b+k=9.5')+'</div><div style="margin-top:8px">Two unknowns need <b>two equations</b>, solved <b>together</b>. These are <b>simultaneous equations</b>. Today you learn two ways to solve them without guessing.</div>'

  {q:'What are <u>simultaneous equations</u>?',a:'Two (or more) equations with the <b>same unknowns</b>, solved <b>at the same time</b>.<div class="formula">'+M('x+y=10')+' and '+M('x-y=4')+'</div>'},

/* ===== m13.js ===== */
/* =====================================================================
   MISSION 13 — Simultaneous Equations: Graphical Method   (syllabus N7.8)
   The solution is the point of intersection · drawing both lines from tables ·
   reading the intersection · checking by substitution · parallel lines (no solution) ·
   the same line (infinitely many solutions)
   ===================================================================== */

/* "y=mx+c" as an M-string */
function m13Y(m,c){return 'y='+poly([[m,'x'],[c,'']])}
/* display label for a graph (plain text with proper minus signs) */
function m13Lab(s){return s.replace(/-/g,'−').replace(/([^ ])([=+−])(?=[^ ])/g,'$1 $2 ').replace(/^(y =) − /,'$1 −')}
/* a grid with two (or more) lines, optional marked points */
const M13_SWIPE='Fill in every empty box. Swipe the table sideways to see every column.';
function m13G(grid,lines,pts){return graphHTML({grid,fns:lines,points:pts||[]})}

Object.assign(SKILLS,{
 'Reading the point of intersection':{explain:'The solution of two simultaneous equations is the point where their lines cross. Read the x-coordinate (across) first, then the y-coordinate (up or down).',error:'Swaps the coordinates, e.g. reads (3, 5) as x = 5, y = 3, or reads where one line cuts an axis instead of where the lines cross.',board:{q:'y = x + 2 and x + y = 8 cross at (3, 5). Solve the equations.',a:['x = 3, y = 5','Check: 5 = 3 + 2 ✓','Check: 3 + 5 = 8 ✓']}},
 'Tables for two lines':{explain:'Draw each line from its own table of values: substitute each x-value to find y, plot, and join with a ruler. Then the lines can be compared on the same axes.',error:'Mixes up the two equations in one table, or gets the sign wrong for negative x-values.',board:{q:'Complete the table for y = 2x − 1 at x = −1, 0, 1, 2.',a:['x = −1: y = −2 − 1 = −3','x = 0: y = −1','x = 1: y = 1','x = 2: y = 3']}},
 'Checking a point on both lines':{explain:'A point is the solution only if it satisfies BOTH equations. Substitute it into each equation separately.',error:'Checks only one equation, e.g. says (4, 1) solves x + y = 5 and x − y = 1 because 4 + 1 = 5.',board:{q:'Is (3, 1) the solution of x + y = 4 and x − y = 2?',a:['x + y = 3 + 1 = 4 ✓','x − y = 3 − 1 = 2 ✓','Yes, it satisfies both.']}},
 'Parallel and coincident lines':{explain:'Same gradient, different y-intercept: parallel lines, they never meet, NO solution. Same line (one equation is a multiple of the other): infinitely many solutions.',error:'Thinks parallel lines meet at the y-axis, or says 2x + 2y = 6 and x + y = 3 have no solution because they "look parallel".',board:{q:'How many solutions: y = 2x + 3 and y = 2x − 1?',a:['Both have gradient 2','Different y-intercepts (3 and −1)','Parallel: no solution']}},
 'Unknowns from the intersection':{explain:'The point of intersection lies on BOTH lines, so its coordinates satisfy both equations. Substitute it into each equation to find the unknowns.',error:'Substitutes the point into only one of the equations, or swaps x and y.',board:{q:'2x + y = 8 and y = kx meet at (2, 4). Find k.',a:['4 = k(2)','k = 2']}},
 'Graphical method in context':{explain:'Turn the story into two equations, draw (or use) both lines, and read the point of intersection. Answer in the words of the question.',error:'Reads the wrong point, or gives x and y without saying what they mean.',board:{q:'7 items cost $13. Curry puffs cost $1, sandwiches $3. How many of each?',a:['x + y = 7 and x + 3y = 13','Lines cross at (4, 3)','4 curry puffs, 3 sandwiches']}}
});

 'Reading the point of intersection':seed=>{const r=rng(seed);const ms=[1,2,-1,-2,3];let m1,m2,x0,y0,c1,c2;

 'Checking a point on both lines':seed=>{const r=rng(seed);const x0=ri(r,3,8),y0=ri(r,1,x0-1);const s=x0+y0,d=x0-y0;

     hint:'Which point works in BOTH equations, not just one?',

 'Parallel and coincident lines':seed=>{const r=rng(seed);const m=ri(r,2,4)*(r()<.5?1:-1);const k=r()<.5?'none':'many';let c1=ri(r,-5,5),c2;do{c2=ri(r,-5,5)}while(c2===c1);

   if(k==='none')return {type:'mcq',q:'How many solutions do the simultaneous equations '+M(m13Y(m,c1))+' and '+M(m13Y(m,c2))+' have?',opts:yes,verify:{manual:'parallel'},

   const a=ri(r,1,4),b=ri(r,2,5),c=ri(r,2,9),t=ri(r,2,3);
   return {type:'mcq',q:'How many solutions do the simultaneous equations '+M(poly([[a,'x'],[b,'y']])+'='+c)+' and '+M(poly([[t*a,'x'],[t*b,'y']])+'='+t*c)+' have?',opts:[yes[3],yes[0],yes[1],yes[2]],verify:{manual:'same line'},

/* =====================================================================
   MISSION 14 — Forming Simultaneous Equations   (syllabus N7.10)
   Let … be …  →  form two equations  →  solve  →  answer in context
   ===================================================================== */

/* ---------- helpers (all prefixed m14) ---------- */
function m14It(s){return String(s).replace(/-/g,' \u2212 ').replace(/\+/g,' + ').replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>')}
function m14Rect(o){   // rectangle ABCD with side labels (expressions, units added)
  const T=(x,y,t,anc,fs)=>t?`<text x="${x}" y="${y}" text-anchor="${anc||'middle'}" font-family="STIX Two Text,serif" font-size="${fs||26}" fill="#1D1A2C">${t}</text>`:'';
  const L=s=>s?m14It(s)+' cm':'';
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 500 290" style="max-width:440px" role="img" aria-label="Rectangle${o.abcd?' ABCD':''}">
   <rect x="150" y="60" width="200" height="150" fill="#E3EBFF" stroke="#1D1A2C" stroke-width="3"/>
   ${o.abcd?T(140,52,'A','end',22)+T(360,52,'B','start',22)+T(360,234,'C','start',22)+T(140,234,'D','end',22):''}
   ${T(250,46,L(o.top))}${T(250,246,L(o.bottom))}${T(138,144,L(o.left),'end')}${T(362,144,L(o.right),'start')}
  </svg></div>`;
}
function m14Info(items){return '<div class="expr-big" style="font-size:19px;font-family:inherit;line-height:1.9;text-align:left">'+items.map(([id,h])=>'<div><span id="'+id+'" style="display:inline-block">'+h+'</span></div>').join('')+'</div>'}

Object.assign(GEN,{
 'Translate words into equations':seed=>{const r=rng(seed);const i=ri(r,0,10);let j;do{j=ri(r,0,10)}while(j===i);
   const [P,p]=M14_NAMES[i],[Q,q]=M14_NAMES[j];let k=ri(r,2,9);
   if(r()<.5)return {type:'mcq',q:P+' has $'+k+' more than '+Q+'. Let '+P+' have $'+M(p)+' and '+Q+' have $'+M(q)+'. Which equation is correct?',
     opts:[M(p+'='+q+'+'+k),M(q+'='+p+'+'+k),M(p+'+'+q+'='+k),M(p+'='+k+q)],verify:{manual:'the person with more = the other + '+k},
     hint:'Who has more money? Which side needs the extra $'+k+' added so both sides are equal?',sol:[[p+'='+q+'+'+k,P+' = '+Q+' + $'+k]]};
   k=Math.min(k,4);
   return {type:'mcq',q:P+' is '+k+' times as old as '+Q+'. Let '+P+' be '+M(p)+' years old and '+Q+' be '+M(q)+' years old. Which equation is correct?',
     opts:[M(p+'='+k+q),M(q+'='+k+p),M(p+'+'+k+'='+q),M(p+'='+q+'+'+k)],verify:{manual:'older = '+k+' × younger'},
     hint:'Who is older? Do you multiply the older or the younger age by '+k+' to make them equal?',sol:[[p+'='+k+q,P+'’s age = '+k+' × '+Q+'’s age']]}},
 'Number and digit problems':seed=>{const r=rng(seed);
   if(r()<.5){const L=ri(r,10,40),s=ri(r,2,L-1),S=L+s,D=L-s;
     return {type:'num',q:'The sum of two numbers is '+S+' and their difference is '+D+'. Find the larger number.',ans:L,verify:{expr:'('+S+'+'+D+')/2'},
       hint:'Let the larger number be x and the smaller be y. Which two equations do you get? What happens if you add them?',
       sol:[['x+y='+S,'(1) x = larger, y = smaller'],['x-y='+D,'(2)'],['2x='+(S+D),'(1) + (2)'],['x='+L,'']]}}
   const t=ri(r,1,7),u=ri(r,t+1,9),d=9*(u-t);
   return {type:'num',q:'The sum of the digits of a two-digit number is '+(t+u)+'. When the digits are reversed, the new number is '+d+' more than the original number. Find the original number.',ans:10*t+u,verify:{expr:'10*'+t+'+'+u},ask:'Type the two-digit number.',
     hint:'Let the tens digit be t and the units digit be u. How do you write the number, and the reversed number, using t and u?',
     sol:[['t+u='+(t+u),'(1) t = tens digit, u = units digit'],['10u+t=10t+u+'+d,'(2) reversed is '+d+' more'],['9u-9t='+d,''],['u-t='+(u-t),'÷ 9 → (3)'],['2u='+(2*u),'(1) + (3)'],['u='+u,''],['t='+t,'sub. into (1)'],['10('+t+')+'+u+'='+(10*t+u),'the number']]}},
 'Tickets and prices':seed=>{const r=rng(seed);const pa=ri(r,8,20),pc=ri(r,4,pa-2),a=ri(r,1,6),c=ri(r,1,6),n=a+c,T=pa*a+pc*c,dd=pa-pc;
   const sol=[['a+c='+n,'(1) a = no. of adult tickets, c = no. of child tickets'],[pa+'a+'+pc+'c='+T,'(2) total cost in $'],['a='+n+'-c','from (1) → (3)'],[pa+'('+n+'-c)+'+pc+'c='+T,'sub. (3) into (2)'],[(pa*n)+poly([[-pa,'c'],[pc,'c']])+'='+T,'expand'],[(pa*n)+poly([[-dd,'c']])+'='+T,''],[poly([[dd,'c']])+'='+(pa*n-T),'']];
   if(dd!==1)sol.push(['c='+c,'']);sol.push(['a='+n+'-'+c,'sub. into (3)'],['a='+a,''],[pa+'('+a+')+'+pc+'('+c+')='+T,'✓ check in (2)']);
   return {type:'multi',q:'At a museum, an adult ticket costs $'+pa+' and a child ticket costs $'+pc+'. A group buys '+n+' tickets for $'+T+'. How many of each type of ticket did they buy?',
     fields:[{label:'Adult tickets =',ans:a,v:'a'},{label:'Child tickets =',ans:c,v:'c'}],verify:{eq:['a+c='+n,pa+'a+'+pc+'c='+T]},
     hint:'Let a and c be the numbers of tickets. One equation counts tickets. What does the other equation add up?',sol}},
 'Coins and notes':seed=>{const r=rng(seed);const [v1,v2]=[[20,50],[10,50],[10,20],[5,20],[10,20]][ri(r,0,4)],x=ri(r,3,15),y=ri(r,3,15),n=x+y,V=v1*x+v2*y;
   return {type:'multi',q:'Nurul has '+n+' coins. They are all '+v1+'-cent and '+v2+'-cent coins, worth $'+(V/100).toFixed(2)+' altogether. How many of each coin does she have?',
     fields:[{label:v1+'-cent coins =',ans:x,v:'x'},{label:v2+'-cent coins =',ans:y,v:'y'}],verify:{eq:['x+y='+n,v1+'x+'+v2+'y='+V]},ask:'Type the number of each coin.',
     hint:'Let x and y be the numbers of coins. One equation counts coins. For the value equation, is it easier to work in cents?',
     sol:[['x+y='+n,'(1) x = no. of '+v1+'¢ coins, y = no. of '+v2+'¢ coins'],[v1+'x+'+v2+'y='+V,'(2) value in cents'],['x='+n+'-y','from (1) → (3)'],[v1+'('+n+'-y)+'+v2+'y='+V,'sub. (3) into (2)'],[(v1*n)+'+'+(v2-v1)+'y='+V,''],[(v2-v1)+'y='+(V-v1*n),''],['y='+y,''],['x='+n+'-'+y,'sub. into (3)'],['x='+x,''],[v1+'('+x+')+'+v2+'('+y+')='+V,'✓ check in (2)']]}},
 'Age problems':seed=>{const r=rng(seed);let q,k,n,m;
   for(;;){q=ri(r,3,15);k=ri(r,3,6);n=ri(r,2,20);const t=(k*q+n)/(q+n);if(Number.isInteger(t)&&t>=2&&t<k&&k*q-q>=20&&k*q<=70){m=t;break}}
   const P=k*q,sol=[['p='+k+'c','(1) p = Mr Tan’s age now, c = his son’s age now'],['p+'+n+'='+m+'(c+'+n+')','(2) ages in '+n+' years'],[k+'c+'+n+'='+m+'(c+'+n+')','sub. (1) into (2)'],[k+'c+'+n+'='+m+'c+'+(m*n),'expand'],[poly([[k-m,'c']])+'='+(m*n-n),'']];
   if(k-m!==1)sol.push(['c='+q,'']);sol.push(['p='+k+'('+q+')','sub. into (1)'],['p='+P,''],[P+'+'+n+'='+m+'('+q+'+'+n+')','✓ check in (2)']);
   return {type:'multi',q:'Mr Tan is '+k+' times as old as his son. In '+n+' years’ time, Mr Tan will be '+m+' times as old as his son. Find their present ages.',
     fields:[{label:'Mr Tan =',ans:P,v:'p',after:'years'},{label:'His son =',ans:q,v:'c',after:'years'}],verify:{eq:['p='+k+'c','p+'+n+'='+m+'(c+'+n+')']},
     hint:'Let p and c be their ages now. What are their ages in '+n+' years? Does the '+n+' go on both people?',sol}},
 'Perimeter and shape problems':seed=>{const r=rng(seed);const w=ri(r,3,15),d=ri(r,1,9),l=w+d,P=2*(l+w);
   return {type:'multi',q:'A rectangle has a perimeter of '+P+' cm. Its length is '+d+' cm longer than its width. Find the length and the width.',
     fields:[{label:'Length =',ans:l,v:'l',after:'cm'},{label:'Width =',ans:w,v:'w',after:'cm'}],verify:{eq:['2l+2w='+P,'l-w='+d]},
     hint:'Let the length be l cm and the width be w cm. How is the perimeter made from l and w? What does "'+d+' cm longer" give?',
     sol:[['2l+2w='+P,'(1) perimeter'],['l-w='+d,'(2)'],['l+w='+(P/2),'(1) ÷ 2 → (3)'],['2l='+(P/2+d),'(3) + (2)'],['l='+l,''],[l+'-w='+d,'sub. into (2)'],['w='+w,''],['2('+l+')+2('+w+')='+P,'✓ check in (1)']]}},
 'Fraction problems':seed=>{const r=rng(seed);let x,y,a,b,p1,q1,p2,q2;
   for(;;){x=ri(r,2,9);y=ri(r,x+1,16);a=ri(r,1,4);b=ri(r,1,3);if(x-b<1||gcd(x,y)!==1)continue;
     let g=gcd(x+a,y+a);p1=(x+a)/g;q1=(y+a)/g;g=gcd(x-b,y-b);p2=(x-b)/g;q2=(y-b)/g;
     if(p1*q2===p2*q1||q1>12||q2>12||(p1===x+a&&q1===y+a)||(p2===x-b&&q2===y-b))continue;break}
   const e1=poly([[q1,'x'],[-p1,'y']])+'='+a*(p1-q1),e2=poly([[q2,'x'],[-p2,'y']])+'='+b*(q2-p2);
   return {type:'multi',q:'When '+a+' is added to both the numerator and the denominator of a fraction, it becomes '+M('{'+p1+'}/{'+q1+'}')+'. When '+b+' is subtracted from both the numerator and the denominator of the original fraction, it becomes '+M('{'+p2+'}/{'+q2+'}')+'. Find the original fraction.',
     fields:[{label:'Numerator =',ans:x,v:'x'},{label:'Denominator =',ans:y,v:'y'}],verify:{eq:['(x+'+a+')/(y+'+a+')='+p1+'/'+q1,'(x-'+b+')/(y-'+b+')='+p2+'/'+q2]},
     hint:'Let the fraction be x over y. What two equations do the changes give? How do you clear the fractions?',
     sol:[['{x+'+a+'}/{y+'+a+'}={'+p1+'}/{'+q1+'}','(1)'],[q1+'(x+'+a+')='+p1+'(y+'+a+')','cross-multiply'],[e1,'→ (3)'],['{x-'+b+'}/{y-'+b+'}={'+p2+'}/{'+q2+'}','(2)'],[q2+'(x-'+b+')='+p2+'(y-'+b+')','cross-multiply'],[e2,'→ (4)'],['x='+x,'solve (3) and (4) simultaneously'],['y='+y,''],['{'+(x+a)+'}/{'+(y+a)+'}={'+p1+'}/{'+q1+'}','✓ check (1)']]}}
});

/* graph of one or more curves, each trimmed to the part that fits inside the grid (so nothing pokes out) */
function m15Dom(fn,G){const f=compile(fn);let a=null,b=null;
  for(let i=0;i<=1600;i++){const x=G.xmin+(G.xmax-G.xmin)*i/1600;const y=f({x});if(isFinite(y)&&y>=G.ymin-1e-9&&y<=G.ymax+1e-9){if(a==null)a=x;b=x}}

/* =====================================================================
   MISSION 16 — Direct & Inverse Proportion   (syllabus N2.5)
   y = kx  (y ÷ x constant, straight line through the origin)
   y = k/x (x × y constant: double one, halve the other)
   ===================================================================== */

/* straight-line graph y = kx through the origin, trimmed to the grid, with a labelled point */
function m16Line(k,G,pt,o){o=o||{};const end=Math.min(G.xmax,G.ymax/k);
  const xs=G.step||1,ys=G.ystep||xs,u=Math.max(26,Math.min(48,Math.floor(560/Math.max((G.xmax-G.xmin)/xs,(G.ymax-G.ymin)/ys*0.75))));   // same square size as the engine grid
  const pad=s=>s?s+'\u00a0\u00a0\u00a0':s;   // trailing spaces nudge the (right-aligned) line label off the line
  const pts=pt?[{x:pt[0],y:pt[1]},{x:pt[0],y:pt[1]-30/u*ys,label:'('+pt[0]+', '+pt[1]+')',color:'none'}]:[];   // point label sits below-right, clear of the rising line
