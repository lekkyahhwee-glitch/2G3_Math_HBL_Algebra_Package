function crossTableHTML(o){
  // o:{r1:['2x','+1'], r2:['x','-3'], p:['-6x','+x'], chk:['2x^2','-3','-5x'], ids:'ct', blank:false}
  const id=k=>o.ids?` id="${o.ids}-${k}"`:'';
  const c=(v,k)=>`<td class="ct-cell"${id(k)}>${o.blank&&!v?'':M(v||'')}</td>`;
  return `<div class="crosswrap"><table class="crosstab">
    <tr>${c(o.r1[0],'a1')}<td class="ct-arrow" rowspan="2"><svg viewBox="0 0 60 60" width="60" height="60" aria-hidden="true"><line x1="6" y1="8" x2="54" y2="52" stroke="#EE5A3C" stroke-width="3"/><line x1="6" y1="52" x2="54" y2="8" stroke="#2E66F5" stroke-width="3"/></svg></td>${c(o.r1[1],'b1')}<td class="ct-div"></td>${c(o.p&&o.p[0],'p1')}</tr>
    <tr>${c(o.r2[0],'a2')}${c(o.r2[1],'b2')}<td class="ct-div"></td>${c(o.p&&o.p[1],'p2')}</tr>
    <tr class="ct-check">${c(o.chk&&o.chk[0],'k1')}<td></td>${c(o.chk&&o.chk[1],'k2')}<td class="ct-div"></td>${c(o.chk&&o.chk[2],'k3')}</tr>
  </table></div>`;
}
function crossLive(host,spec){
  // spec:{a,b,c,v:'x'} – student types the four factors; products and the check row update live
  const v=spec.v||'x';
  const box=el('div','card crosslive');
  box.innerHTML=`<b>Try a pair in the cross table</b><div class="small">Factors of ${M((spec.a===1?'':spec.a)+v+'^2')} go in column 1, factors of ${M(String(spec.c))} in column 2. The products and the check row fill in by themselves.</div>
   <div class="crosswrap"><table class="crosstab">
    <tr><td><input class="ans cx" data-k="a1" placeholder="?"></td><td class="ct-arrow" rowspan="2"><svg viewBox="0 0 60 60" width="60" height="60" aria-hidden="true"><line x1="6" y1="8" x2="54" y2="52" stroke="#EE5A3C" stroke-width="3"/><line x1="6" y1="52" x2="54" y2="8" stroke="#2E66F5" stroke-width="3"/></svg></td><td><input class="ans cx" data-k="b1" placeholder="?"></td><td class="ct-div"></td><td class="ct-cell" data-o="p1"></td></tr>
    <tr><td><input class="ans cx" data-k="a2" placeholder="?"></td><td><input class="ans cx" data-k="b2" placeholder="?"></td><td class="ct-div"></td><td class="ct-cell" data-o="p2"></td></tr>
    <tr class="ct-check"><td class="ct-cell" data-o="k1"></td><td></td><td class="ct-cell" data-o="k2"></td><td class="ct-div"></td><td class="ct-cell" data-o="k3"></td></tr>
   </table></div><div class="fb" hidden></div>`;
  host.appendChild(box);
  const val=k=>box.querySelector(`[data-k="${k}"]`).value.trim();
  const out=(k,h)=>box.querySelector(`[data-o="${k}"]`).innerHTML=h;
  const coef=s=>{if(!s)return null;const t=normExpr(s).replace(new RegExp(v,'g'),'');if(t===''||t==='+')return 1;if(t==='-')return -1;const n=numVal(t);return isFinite(n)?n:null};
  const fb=box.querySelector('.fb');
  function upd(){
    const a1=coef(val('a1')),a2=coef(val('a2')),b1=numVal(val('b1')),b2=numVal(val('b2'));
    const fmt=(c,pow)=>{if(c==null||!isFinite(c))return '';const s=c<0?'-':'+';const a=Math.abs(c);return M((pow?s:(c<0?'-':''))+(pow&&a===1?'':a)+(pow||''))};
    out('p1',isFinite(a1*b2)&&val('a1')&&val('b2')?fmt(a1*b2,v):'');out('p2',isFinite(a2*b1)&&val('a2')&&val('b1')?fmt(a2*b1,v):'');
    out('k1',val('a1')&&val('a2')&&isFinite(a1*a2)?M((a1*a2===1?'':a1*a2===-1?'-':a1*a2)+v+'^2'):'');
    out('k2',val('b1')&&val('b2')&&isFinite(b1*b2)?M(String(b1*b2)):'');
    const sum=a1*b2+a2*b1;out('k3',[a1,a2,b1,b2].every(x=>x!=null&&isFinite(x))?fmt(sum,v).replace('+',''):'');
    if([a1,a2,b1,b2].every(x=>x!=null&&isFinite(x))){fb.hidden=false;
      const ok=a1*a2===spec.a&&b1*b2===spec.c&&sum===spec.b;
      fb.className='fb '+(ok?'good':'warn');
      fb.innerHTML=ok?'✓ The check row matches! Read the brackets across the rows.':(a1*a2!==spec.a?'Column 1 should multiply to '+M(spec.a+v+'^2')+'. ':'')+(b1*b2!==spec.c?'Column 2 should multiply to '+M(String(spec.c))+'. ':'')+(a1*a2===spec.a&&b1*b2===spec.c?'The sum is '+fmt(sum,v)+', not '+fmt(spec.b,v)+'. Try another pair or swap the order in column 2.':'')}
    else fb.hidden=true}
  box.querySelectorAll('input.cx').forEach(i=>i.oninput=upd);
}

function animWidget(host,spec){
  // spec:{title, lines:[{t:'M-string', note:'why', hl:true}], intro:'html'} – each line slides in, notes fade in; Slow/Normal/Fast + Replay
  const box=el('div','card animbox');
  box.innerHTML=`${spec.title?`<b>${spec.title}</b>`:''}${spec.intro?`<div class="small">${spec.intro}</div>`:''}<div class="anim-lines"></div>
   <div class="ctrls" style="margin-top:8px"><button data-sp="1.6">Slow</button><button data-sp="1" class="on">Normal</button><button data-sp="0.55">Fast</button><button class="rep">↻ Replay</button></div>`;
  host.appendChild(box);
  const L=box.querySelector('.anim-lines');let sp=1,timers=[];
  L.innerHTML=spec.lines.map(l=>`<div class="anim-ln${l.hl?' hl':''}" style="opacity:0"><span class="m-line">${l.html||M(l.t)}</span>${l.note?`<span class="why">${l.note}</span>`:''}</div>`).join('');
  const rows=[...L.children];
  function run(){timers.forEach(clearTimeout);timers=[];rows.forEach(r=>{r.getAnimations().forEach(a=>a.cancel());r.style.opacity=0});
    rows.forEach((r,i)=>timers.push(setTimeout(()=>{r.style.opacity=1;r.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:500*sp,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'})},300+i*1100*sp)))}
  box.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{sp=+b.dataset.sp;box.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x===b));run()});
  box.querySelector('.rep').onclick=run;
  if(!window.__demoState)window.__demoState={sp:1,timers:[]};
  window.__demoState.timers.push(...timers);setTimeout(run,200);
  // safety net: everything visible after a few seconds even if animations are throttled
  timers.push(setTimeout(()=>rows.forEach(r=>r.style.opacity=1),300+rows.length*1100*1.6+800));
}
function widget(host,w){
  if(!w)return;
  if(w.type==='slider')return sliderWidget(host,w);
  if(w.type==='graph')return graphWidget(host,w);
  if(w.type==='anim')return animWidget(host,w);
  if(w.type==='cross')return crossLive(host,w);
  if(w.type==='html'){const c=el('div','card',w.html);host.appendChild(c);return}
}

/* =====================================================================
   PAGES for a data mission
   ===================================================================== */
function buildPages(d){
  const P=[];
  P.push({stage:'Brief',render:p=>pgBriefG(p,d)});
  P.push({stage:'Brief',render:pgEvery});
  P.push({stage:'Warm-up',render:pgWarmup,gate:warmupDone});
  P.push({stage:'Hook',render:p=>pgHookG(p,d),gate:()=>flag('hook')});
  P.push({stage:'Define',render:p=>pgDefineG(p,d)});
  d.concepts.forEach((c,ci)=>P.push({stage:'Concepts',render:p=>pgConceptG(p,d,c,ci),gate:()=>(c.checks||[]).every((q,k)=>resolved('c'+ci+'-'+k))}));
  P.push({stage:'Traps',render:pgTraps,gate:()=>TRAPS.every(t=>{const a=ansOf('trap-'+t.k);return a&&(a.done||a.res==='done')})});
  d.worked.forEach(W=>P.push({stage:'Worked',render:()=>pgWE(W),gate:()=>flag(W.id)}));
  P.push({stage:'Worksheet',render:pgWorksheet,gate:()=>flag('wsdone')});
  d.PRACTICE.forEach((q,i)=>P.push({stage:'Part A',render:()=>pgPractice(i),gate:()=>resolved(q.key)}));
  P.push({stage:'Part B',render:pgWsCheck,gate:()=>WSQ.every(q=>resolved(q.key))});
  P.push({stage:'2nd Chance',render:pgRemix,gate:remixDone});
  P.push({stage:'Summary',render:p=>pgSummaryG(p,d)});
  P.push({stage:'Summary',render:pgDone});
  return P;
}

/* =====================================================================
   TYPED-ANSWER PREVIEW: shows fractions stacked and powers raised as the student types
   ===================================================================== */
function exprToHTML(raw){
  // tiny parser mirroring compile(): returns HTML, or null if it can't read it yet
  let tk;try{tk=tokenize(normExpr(raw))}catch(e){return null}
  let p=0;const peek=()=>tk[p];
  const wrapP=h=>'('+h+')';
  function expr(){let h=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=tk[p++].t;h+=' '+(op==='-'?'−':'+')+' '+term()}return h}
  function term(){let h=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=tk[p++].t;const r=unary();
      if(op==='/')h=`<span class="fr"><span>${strip(h)}</span><span>${strip(r)}</span></span>`;else h+=(tk[p-2]&&tk[p-2].implicit)?r:(' × '+r)}return h}
  function strip(h){return h.startsWith('(')&&h.endsWith(')')&&balanced(h.slice(1,-1))?h.slice(1,-1):h}
  function balanced(s){let d=0;for(const c of s){if(c==='(')d++;if(c===')'){d--;if(d<0)return false}}return d===0}
  function unary(){if(peek()&&peek().t==='-'){p++;return '−'+unary()}if(peek()&&peek().t==='+'){p++;return unary()}return power()}
  function power(){const b=primary();if(peek()&&peek().t==='^'){p++;const e=unary();return b+'<sup>'+strip(e)+'</sup>'}return b}
  function primary(){const x=tk[p];if(!x)throw 0;
    if(x.t==='n'){p++;return String(x.v)}
    if(x.t==='v'){p++;return '<i>'+x.v+'</i>'}
    if(x.t==='f'){p++;return x.v==='sqrt'?'√'+primary():'π'}
    if(x.t==='('){p++;const h=expr();if(!tk[p]||tk[p].t!==')')throw 0;p++;return wrapP(h)}
    throw 0}
  try{const h=expr();if(p!==tk.length)return null;return h.replace(/ × (?=<i>|\(|√)/g,'').replace(/(\d) × (?=<i>)/g,'$1')}catch(e){return null}
}
function attachPreview(inp){
  const pv=el('div','preview');pv.hidden=true;inp.insertAdjacentElement('afterend',pv);
  const upd=()=>{const v=inp.value;if(!/[\/^√]|sqrt|²|³/.test(v)){pv.hidden=true;return}const h=exprToHTML(v);pv.hidden=!h;if(h)pv.innerHTML='<span class="small">Reads as:</span> <span class="m">'+h+'</span>'};
  inp.addEventListener('input',upd);upd();
}

function m2NW(s){return M(s).replace('<span class="m">','<span class="m" style="white-space:nowrap">')}

/* square split into a², ab, ab, b² (labels are M-strings) */
function m2Square(a,b,size){
  size=size||300;const A=size*0.62,B=size-A,o=40;
  const T=(x,y,t,fs)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="STIX Two Text,serif" font-size="${fs||22}" fill="#1D1A2C">${t}</text>`;
  const it=s=>s.replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>').replace(/\^2/g,'²').replace(/(\d)²/g,'$1²');
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 ${size+o*2} ${size+o*2}" style="max-width:360px" role="img" aria-label="Square of side ${a} + ${b} split into four parts">
   <rect x="${o}" y="${o}" width="${A}" height="${A}" fill="#E3EBFF" stroke="#1D1A2C" stroke-width="2"/>
   <rect x="${o+A}" y="${o}" width="${B}" height="${A}" fill="#FFE3DA" stroke="#1D1A2C" stroke-width="2"/>
   <rect x="${o}" y="${o+A}" width="${A}" height="${B}" fill="#FFE3DA" stroke="#1D1A2C" stroke-width="2"/>
   <rect x="${o+A}" y="${o+A}" width="${B}" height="${B}" fill="#FFB627" stroke="#1D1A2C" stroke-width="2"/>
   ${T(o+A/2,o+A/2+8,it(a+'^2'),26)}${T(o+A+B/2,o+A/2+7,it(/^\d/.test(b)?b+a:a+b))}${T(o+A/2,o+A+B/2+7,it(/^\d/.test(b)?b+a:a+b))}${T(o+A+B/2,o+A+B/2+7,it(b+'^2'))}
   ${T(o+A/2,o-12,it(a))}${T(o+A+B/2,o-12,it(b))}${T(o-16,o+A/2+7,it(a))}${T(o-16,o+A+B/2+7,it(b))}
  </svg></div>`;
}
function m2Squares(big,small){   // big square with a small square cut out of the corner (for Q19)
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 420 326" style="max-width:420px" role="img" aria-label="Square of side ${big} with a square of side ${small} removed">

   <rect x="80" y="30" width="150" height="150" fill="#FFF" stroke="#1D1A2C" stroke-width="2.5" stroke-dasharray="7 5"/>

   <text x="155" y="22" text-anchor="middle" font-family="STIX Two Text,serif" font-size="24" fill="#1D1A2C">(${small.replace(/x/g,'𝑥').replace(/-/g,' − ')}) cm</text>
  </svg></div>`;
}

/* =====================================================================
   MISSION 3 — Factorising by Grouping   (syllabus N5.13)
   a(x + y) + b(x + y) = (x + y)(a + b);   ax + ay + bx + by = a(x + y) + b(x + y) = (x + y)(a + b)
   ===================================================================== */

/* maths text for SVG labels: italic letters, proper minus, spaced signs */
function m3Pretty(s){
  return String(s).replace(/\^2/g,'²').replace(/\+/g,' + ').replace(/-/g,' − ')
    .replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>');
}
/* rectangle split into four tiles: top = [w1,w2] side labels, left = [h1,h2], tiles = [[t11,t12],[t21,t22]] */
function m3Rect(top,left,tiles,maxw){
  const W=[190,90],H=[130,70],o=48;
  const T=(x,y,t,fs,col)=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="STIX Two Text,serif" font-size="${fs||22}" fill="${col||'#1D1A2C'}">${m3Pretty(t)}</text>`;
  const fills=[['#E3EBFF','#FFE3DA'],['#DDF5E8','#FFE9B8']];
  let s=`<div class="diagwrap"><svg class="diag" viewBox="0 0 ${W[0]+W[1]+o*2} ${H[0]+H[1]+o*2}" style="max-width:${maxw||380}px" role="img" aria-label="Rectangle split into four tiles">`;
  for(let r=0;r<2;r++)for(let c=0;c<2;c++){const x=o+(c?W[0]:0),y=o+(r?H[0]:0);
    s+=`<rect x="${x}" y="${y}" width="${W[c]}" height="${H[r]}" fill="${fills[r][c]}" stroke="#1D1A2C" stroke-width="2"/>`;
    s+=T(x+W[c]/2,y+H[r]/2+8,tiles[r][c],24)}
  s+=T(o+W[0]/2,o-14,top[0])+T(o+W[0]+W[1]/2,o-14,top[1]);
  s+=T(o-22,o+H[0]/2+8,left[0])+T(o-22,o+H[0]+H[1]/2+8,left[1]);
  return s+'</svg></div>';
}
/* plain rectangle with its area written inside (sides unknown) */
function m3AreaBox(expr){
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 330 210" style="max-width:420px" role="img" aria-label="Rectangle with area ${expr} square centimetres">
   <rect x="8" y="10" width="250" height="150" fill="#DDF5E8" stroke="#1D1A2C" stroke-width="3"/>
   <text x="133" y="70" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#1D1A2C">Area =</text>
   <text x="133" y="104" text-anchor="middle" font-family="STIX Two Text,serif" font-size="21" fill="#1D1A2C">(${m3Pretty(expr)}) cm²</text>
   <text x="133" y="192" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#6A6680">length = ?</text>
   <text x="294" y="80" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#6A6680">breadth</text><text x="294" y="104" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#6A6680">= ?</text>
  </svg></div>`;
}
const m3C=(c,v)=>(c===1?'':c===-1?'-':String(c))+v;      // 1a → a, −1a → −a
const m3Odd=n=>Math.abs(n)>=21&&Math.abs(n)%10===1;       // avoid coefficients like 21x (validator flags "1x")

});

/* ===== m4.js ===== */
/* =====================================================================
   MISSION 4 — Factorising Quadratics   (syllabus N5.14)
   x² + bx + c and ax² + bx + c by the CROSS METHOD (school layout)
   ===================================================================== */

const m4T=(c,v)=>c===1?v:c===-1?'-'+v:c+v;                 // 1x → x, −1x → −x
const m4S=n=>(n>=0?'+':'')+n;                               // signed number
const m4ST=(c,v)=>(c>=0?'+':'')+m4T(c,v);                   // signed term
const m4Br=(p,q,v)=>'('+m4T(p,v||'x')+(q>0?'+':'-')+Math.abs(q)+')';
const m4N=n=>String(n).replace('-','−');
const m4P=n=>n<0?'('+m4N(n)+')':String(n);                  // bracket a negative number in a product                    // plain-text number with a real minus
const m4Odd=n=>Math.abs(n)>=21&&Math.abs(n)%10===1;         // avoid "21x" (validator flags "1x")
/* filled cross table for (p v + q)(r v + s) */
function m4Cross(p,q,r,s,v){v=v||'x';
  return crossTableHTML({r1:[m4T(p,v),m4S(q)],r2:[m4T(r,v),m4S(s)],p:[m4ST(p*s,v),m4ST(r*q,v)],chk:[m4T(p*r,v+'^2'),m4S(q*s),m4ST(p*s+r*q,v)]});
}
/* rectangle with area inside and length underneath (breadth unknown) */
function m4Rect(area,len){
  const P=s=>String(s).replace(/\^2/g,'²').replace(/\+/g,' + ').replace(/-/g,' − ').replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>');
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 330 210" style="max-width:420px" role="img" aria-label="Rectangle with area ${area} and length ${len}">
   <rect x="8" y="10" width="250" height="150" fill="#E3EBFF" stroke="#1D1A2C" stroke-width="3"/>
   <text x="133" y="70" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#1D1A2C">Area =</text>
   <text x="133" y="104" text-anchor="middle" font-family="STIX Two Text,serif" font-size="22" fill="#1D1A2C">(${P(area)}) cm²</text>
   <text x="133" y="194" text-anchor="middle" font-family="STIX Two Text,serif" font-size="22" fill="#1D1A2C">(${P(len)}) cm</text>
   <text x="294" y="80" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#6A6680">breadth</text>
   <text x="294" y="104" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#6A6680">= ?</text>
  </svg></div>`;
}

 'Cross method, c negative':{explain:'For x² + bx + c with c negative, one number is + and one is −. The bigger number takes the sign of b.',error:'Gets the signs the wrong way round, e.g. x² − x − 12 = (x + 4)(x − 3), which expands to x² + x − 12.',board:{q:'Factorise x² − 2x − 15.',a:['(−5) × 3 = −15, −5 + 3 = −2','= (x − 5)(x + 3)']}},
 'Cross method, a not 1':{explain:'For ax² + bx + c, put factors of ax² in column 1 and factors of c in column 2. Cross-multiply; the two products must add to bx. Swap the order in column 2 if needed.',error:'Only checks that the numbers multiply to c and forgets the cross products, e.g. 2x² + 7x + 3 = (2x + 3)(x + 1).',board:{q:'Factorise 2x² + 7x + 3.',a:['cross: 2x × 3 = 6x, x × 1 = x, 6x + x = 7x ✓','= (2x + 1)(x + 3)']}},
 'Common factor first (quadratics)':{explain:'Always look for a common factor of all three terms first. Take it out, factorise the quadratic left inside, and keep the factor in front.',error:'Goes straight to the cross and gets (2x + 4)(x + 3), which still has a factor 2, or drops the factor at the end.',board:{q:'Factorise completely 3x² + 15x + 18.',a:['= 3(x² + 5x + 6)','= 3(x + 2)(x + 3)']}},

 'Factorise to evaluate':{explain:'Factorise first, then put the number into the brackets. Choose numbers so a bracket becomes 100 or another round number.',error:'Squares the big number directly and makes an arithmetic slip, or substitutes into the wrong bracket.',board:{q:'Evaluate 108² − 3 × 108 − 40.',a:['x² − 3x − 40 = (x − 8)(x + 5)','= (108 − 8)(108 + 5)','= 100 × 113','= 11 300']}}

/* =====================================================================
   MISSION 5 — Multiplying & Dividing Algebraic Fractions   (syllabus N5.15)
   simplify by cancelling common FACTORS · multiply: top × top, bottom × bottom
   divide: multiply by the reciprocal (keep, change, flip) · factorise first
   ===================================================================== */

/* ---------- helpers (all prefixed m5) ---------- */
/* monomial c·x^ex·y^ey as a typed string, e.g. m5Mono(6,2,1) → "6x^2y" */
function m5Mono(c,ex,ey){let s=(c===1&&(ex||ey))?'':String(c);if(ex)s+='x'+(ex>1?'^'+ex:'');if(ey)s+='y'+(ey>1?'^'+ey:'');return s||'1'}
/* maths text for SVG labels: italic letters, ² ³, proper minus signs */
function m5T(s){return String(s).replace(/\^2/g,'²').replace(/\^3/g,'³').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>')}
/* stacked fraction drawn in SVG, centred at (x, y = fraction bar) */
function m5SF(x,y,n,d,fs){fs=fs||20;const w=Math.max(n.length,d.length)*fs*0.5+14;
  return `<text x="${x}" y="${y-7}" text-anchor="middle" font-family="STIX Two Text,serif" font-size="${fs}" fill="#1D1A2C">${m5T(n)}</text>
   <line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="#1D1A2C" stroke-width="1.8"/>
   <text x="${x}" y="${y+fs+2}" text-anchor="middle" font-family="STIX Two Text,serif" font-size="${fs}" fill="#1D1A2C">${m5T(d)}</text>`}
/* rectangle with a fractional area and length; width unknown (Part B Q18) */
function m5Rect(aN,aD,lN,lD){
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 350 256" style="max-width:420px" role="img" aria-label="Rectangle with area (${aN}) over ${aD} square centimetres and length (${lN}) over ${lD} centimetres">
   <rect x="78" y="10" width="262" height="160" fill="#E3EBFF" stroke="#1D1A2C" stroke-width="3"/>
   <text x="128" y="97" text-anchor="middle" font-family="Lexend,sans-serif" font-size="19" fill="#1D1A2C">Area =</text>
   ${m5SF(212,90,aN,aD,23)}
   <text x="292" y="97" text-anchor="middle" font-family="Lexend,sans-serif" font-size="19" fill="#1D1A2C">cm²</text>
   <line x1="78" y1="186" x2="340" y2="186" stroke="#6A6680" stroke-width="1.5"/>
   <line x1="78" y1="179" x2="78" y2="193" stroke="#6A6680" stroke-width="1.5"/><line x1="340" y1="179" x2="340" y2="193" stroke="#6A6680" stroke-width="1.5"/>
   ${m5SF(195,218,lN,lD,23)}
   <text x="252" y="225" font-family="Lexend,sans-serif" font-size="19" fill="#1D1A2C">cm</text>
   <text x="38" y="94" text-anchor="middle" font-family="Lexend,sans-serif" font-size="34" font-weight="700" fill="#EE5A3C">?</text>
   <text x="38" y="120" text-anchor="middle" font-family="Lexend,sans-serif" font-size="17" fill="#6A6680">width</text>
  </svg></div>`;
}

/* nudge (no try lost) when the bottom's brackets are left out, e.g. 3/4y read as 3y/4 */
const m5Nu=(n,d)=>[{ans:n+'/'+d,msg:'Nearly! Without brackets that bottom is not read as one block. Put brackets round the bottom: type '+n+'/('+d+').'}];
const M5_ASK='Type a single fraction in its simplest form. Put brackets round a top or bottom that has more than one term or factor, e.g. type 5/(2y) or (x-3)/2.';
const M5_ASKF='Type a single fraction in its simplest form. You may leave the top or bottom factorised, e.g. type 3(x+1)/(x-2).';

Object.assign(SKILLS,{
 'Cancel common factors':{explain:'Divide the numerator and the denominator by their HCF (numbers and letters), e.g. 12a²b over 18ab³: the HCF is 6ab.',error:'Subtracts instead of divides (x³ over x becomes x³ − x), leaves a letter on both top and bottom, or forgets the 1 left on top when everything cancels.',board:{q:'Simplify 12a²b over 18ab³.',a:['HCF = 6ab','= (6ab × 2a) over (6ab × 3b²)','= 2a over 3b²']}},
 'Factorise then cancel':{explain:'Factorise the top and the bottom completely, then cancel a whole common bracket. Only factors cancel, never terms.',error:'Cancels terms, e.g. (x + 6) over (x + 3) = 2, or cancels the x² in (x² − 9) over (x² + 3x) without factorising.',board:{q:'Simplify (x² − 9) over (2x + 6).',a:['= (x + 3)(x − 3) over 2(x + 3)','= (x − 3) over 2']}},
 'Multiply algebraic fractions':{explain:'Multiply top × top and bottom × bottom, then cancel common factors (or cancel first to keep numbers small).',error:'Cross-multiplies as if solving an equation, or stops before cancelling the common factors.',board:{q:'Simplify 3a over 4b² × 8b over 9a².',a:['= 24ab over 36a²b²','= 2 over 3ab']}},

 'Factorise, then multiply or divide':{explain:'Flip if dividing, factorise every numerator and denominator, cancel common brackets and numbers, then multiply what is left.',error:'Expands everything instead of factorising, so the common brackets are hidden, or cancels a bracket with only one of its terms.',board:{q:'Simplify (x² − 4) over 3x × 6 over (x + 2).',a:['= (x + 2)(x − 2) over 3x × 6 over (x + 2)','= 2(x − 2) over x']}}

Object.assign(GEN,{
 'Cancel common factors':seed=>{const r=rng(seed);let a,b,g;
   do{g=ri(r,2,6);a=ri(r,1,7);b=ri(r,2,7)}while(gcd(a,b)>1||a===b||(a*g)%10===1||(b*g)%10===1);
   let m,n;do{m=ri(r,1,3);n=ri(r,1,3)}while(m===n);
   let p=0,q=0;if(r()<.5){p=ri(r,0,2);q=ri(r,1,2)}
   const top=m5Mono(a*g,m,p),bot=m5Mono(b*g,n,q),d=m-n,e=p-q;
   const N=m5Mono(a,Math.max(d,0),Math.max(e,0)),D=m5Mono(b,Math.max(-d,0),Math.max(-e,0)),H=m5Mono(g,Math.min(m,n),Math.min(p,q));
   return {q:'Simplify '+M('{'+top+'}/{'+bot+'}')+'.',ans:'('+N+')/('+D+')',nudges:/^\d+$/.test(D)?[]:m5Nu(N,D),verify:{equals:'('+top+')/('+bot+')'},ask:M5_ASK,

 'Factorise then cancel':seed=>{const r=rng(seed);
   if(r()<.5){const a=ri(r,2,9),k=ri(r,2,5),s=r()<.5?1:-1;
     const top=poly([[1,'x^2'],[-a*a,'']]),bot=poly([[k,'x'],[s*k*a,'']]),left=poly([[1,'x'],[-s*a,'']]);
     return {q:'Simplify '+M('{'+top+'}/{'+bot+'}')+'.',ans:'('+left+')/'+k,verify:{equals:'('+top+')/('+bot+')'},ask:M5_ASK,

       sol:[['{'+top+'}/{'+bot+'}',''],['={(x+'+a+')(x-'+a+')}/{'+k+lin(1,s*a)+'}','factorise top and bottom'],['={'+left+'}/{'+k+'}','cancel '+M(lin(1,s*a))]]}}
   const p=ri(r,1,6);let q;do{q=ri(r,1,7)}while(q===p);
   const top=poly([[1,'x^2'],[p+q,'x'],[p*q,'']]),bot=poly([[1,'x^2'],[-p*p,'']]);
   return {q:'Simplify '+M('{'+top+'}/{'+bot+'}')+'.',ans:'(x+'+q+')/(x-'+p+')',verify:{equals:'('+top+')/('+bot+')'},ask:M5_ASKF,
     hint:'Can you factorise the top AND the bottom? Which bracket appears in both?',
     sol:[['{'+top+'}/{'+bot+'}',''],['={(x+'+p+')(x+'+q+')}/{(x+'+p+')(x-'+p+')}','factorise top and bottom'],['={x+'+q+'}/{x-'+p+'}','cancel '+M('(x+'+p+')')]]}},
 'Multiply algebraic fractions':seed=>{const r=rng(seed);let A,B,C,D,m,q,n,p,P,Q,g,a,b,N,Dn;
   do{A=ri(r,2,9);B=ri(r,2,9);C=ri(r,2,9);D=ri(r,2,9);m=ri(r,1,3);q=ri(r,1,3);n=ri(r,1,2);p=ri(r,1,2);
     P=A*C;Q=B*D;g=gcd(P,Q);a=P/g;b=Q/g;
     N=m5Mono(a,Math.max(m-q,0),Math.max(p-n,0));Dn=m5Mono(b,Math.max(q-m,0),Math.max(n-p,0));

/* ---------- helpers (all prefixed m6) ---------- */
/* maths text for SVG labels: italic letters, ², proper minus signs */
function m6T(s){return String(s).replace(/\^2/g,'²').replace(/-/g,' − ').replace(/\+/g,' + ').replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>')}
/* stacked fraction in SVG, centred at x, fraction bar at y */
function m6SF(x,y,n,d,fs,col){fs=fs||18;col=col||'#1D1A2C';const w=Math.max(String(n).length,String(d).length)*fs*0.55+10;
  return `<text x="${x}" y="${y-6}" text-anchor="middle" font-family="STIX Two Text,serif" font-size="${fs}" fill="${col}">${m6T(n)}</text>
   <line x1="${x-w/2}" y1="${y}" x2="${x+w/2}" y2="${y}" stroke="${col}" stroke-width="1.6"/>
   <text x="${x}" y="${y+fs+1}" text-anchor="middle" font-family="STIX Two Text,serif" font-size="${fs}" fill="${col}">${m6T(d)}</text>`}
/* bar of 6 equal parts: one half (blue) + one third (orange) = five sixths */
function m6Bar(){let cells='';for(let i=0;i<6;i++){const f=i<3?'#9FB8FF':i<5?'#FFB59F':'#FFFFFF';cells+=`<rect x="${35+i*55}" y="15" width="55" height="60" fill="${f}" stroke="#1D1A2C" stroke-width="2"/>`}
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 400 205" style="max-width:380px" role="img" aria-label="A bar cut into 6 equal parts: one half is blue, one third is orange, together five sixths of the bar">
   ${cells}
   <text x="337.5" y="50" text-anchor="middle" font-family="Lexend,sans-serif" font-size="12" fill="#6A6680">empty</text>
   <line x1="37" y1="88" x2="198" y2="88" stroke="#2E66F5" stroke-width="4"/><line x1="202" y1="88" x2="308" y2="88" stroke="#EE5A3C" stroke-width="4"/>
   ${m6SF(117,122,'1','2',20,'#2E66F5')}${m6SF(255,122,'1','3',20,'#EE5A3C')}
   <text x="170" y="182" text-anchor="end" font-family="Lexend,sans-serif" font-size="16" fill="#1D1A2C">Together:</text>${m6SF(195,175,'5','6',20)}
   <text x="215" y="182" font-family="Lexend,sans-serif" font-size="16" fill="#1D1A2C">of the bar</text>
  </svg></div>`}
/* a journey in two parts: distances on top, speeds underneath (Part B Q20) */
function m6Trip(d1,s1,d2,s2,w1,w2){
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 420 160" style="max-width:440px" role="img" aria-label="Journey: ${d1} km at ${s1} km/h, then ${d2} km at ${s2} km/h">

   <circle cx="30" cy="70" r="7" fill="#1D1A2C"/><circle cx="290" cy="70" r="7" fill="#1D1A2C"/><circle cx="390" cy="70" r="7" fill="#1D1A2C"/>
   <text x="160" y="52" text-anchor="middle" font-family="Lexend,sans-serif" font-size="19" fill="#1D1A2C">${w1}: ${d1} km</text>
   <text x="340" y="52" text-anchor="middle" font-family="Lexend,sans-serif" font-size="19" fill="#1D1A2C">${w2}: ${d2} km</text>
   <text x="160" y="102" text-anchor="middle" font-family="STIX Two Text,serif" font-size="22" fill="#2E66F5">${m6T(s1)} km/h</text>
   <text x="340" y="102" text-anchor="middle" font-family="STIX Two Text,serif" font-size="22" fill="#EE5A3C">${m6T(s2)} km/h</text>
   <text x="30" y="140" text-anchor="middle" font-family="Lexend,sans-serif" font-size="16" fill="#6A6680">start</text>
   <text x="390" y="140" text-anchor="middle" font-family="Lexend,sans-serif" font-size="16" fill="#6A6680">end</text>
  </svg></div>`}
/* k·(bracket) written nicely: 1 → no coefficient */
function m6k(k,br){return (k===1?'':String(k))+br}

 'Numerical denominators':seed=>{const r=rng(seed);const P=[[2,3],[2,5],[3,4],[3,5],[4,5],[2,7]];let p,q,a,b,c;
   do{[p,q]=P[ri(r,0,5)];a=ri(r,-6,6);b=ri(r,-6,6);c=q*a+p*b}while(!a||!b||gcd(gcd(p+q,c),p*q)>1);
   const n1=poly([[1,'x'],[a,'']]),n2=poly([[1,'x'],[b,'']]),L=p*q,top=poly([[p+q,'x'],[c,'']]);
   return {q:'Express '+M('{'+n1+'}/{'+p+'}+{'+n2+'}/{'+q+'}')+' as a single fraction.',ans:'('+top+')/'+L,verify:{equals:'('+n1+')/'+p+'+('+n2+')/'+q},ask:M6_ASKN,
     hint:'What is the lowest number that '+p+' and '+q+' both divide into? What must each numerator be multiplied by?',
     sol:[['{'+n1+'}/{'+p+'}+{'+n2+'}/{'+q+'}',''],['={'+q+'('+n1+')+'+p+'('+n2+')}/{'+L+'}','LCD = '+L],['={'+poly([[q,'x'],[q*a,''],[p,'x'],[p*b,'']])+'}/{'+L+'}','expand'],['={'+top+'}/{'+L+'}','collect like terms']]}},
 'Brackets when subtracting':seed=>{const r=rng(seed);
   if(r()<.5){const P=[[2,3],[2,5],[3,4],[3,5],[4,5]];let p,q,a,b,c;
     do{[p,q]=P[ri(r,0,4)];a=ri(r,-6,6);b=ri(r,-6,6);c=q*a-p*b}while(!a||!b||gcd(gcd(q-p,c),p*q)>1);
     const n1=poly([[1,'x'],[a,'']]),n2=poly([[1,'x'],[b,'']]),L=p*q,top=poly([[q-p,'x'],[c,'']]);
     return {q:'Express '+M('{'+n1+'}/{'+p+'}-{'+n2+'}/{'+q+'}')+' as a single fraction.',ans:'('+top+')/'+L,verify:{equals:'('+n1+')/'+p+'-('+n2+')/'+q},ask:M6_ASKN,
       hint:'What is the LCD? When you subtract the second numerator, what happens to the sign of EACH of its terms?',
       sol:[['{'+n1+'}/{'+p+'}-{'+n2+'}/{'+q+'}',''],['={'+q+'('+n1+')-'+p+'('+n2+')}/{'+L+'}','LCD = '+L+'; keep the brackets'],['={'+poly([[q,'x'],[q*a,''],[-p,'x'],[-p*b,'']])+'}/{'+L+'}','expand: the minus hits every term'],['={'+top+'}/{'+L+'}','collect like terms']]}}
   let m,n,a,b;do{m=ri(r,2,6);n=ri(r,1,5);a=ri(r,-6,6);b=ri(r,-6,6)}while(m<=n||!a||!b||a===b);
   const A=lin(1,a),B=lin(1,b),top=poly([[m-n,'x'],[m*b-n*a,'']]);
   return {q:'Express '+M('{'+m+'}/{'+A.slice(1,-1)+'}-{'+n+'}/{'+B.slice(1,-1)+'}')+' as a single fraction.',ans:'('+top+')/('+A+B+')',verify:{equals:m+'/'+A+'-'+n+'/'+B},ask:M6_ASK,
     hint:'What is the LCD of the two brackets? After the minus sign, what happens to the sign of every term in the second numerator?',
     sol:[['{'+m+'}/{'+A.slice(1,-1)+'}-{'+n+'}/{'+B.slice(1,-1)+'}',''],['={'+m+B+'-'+m6k(n,A)+'}/{'+A+B+'}','LCD = '+M(A+B)],['={'+poly([[m,'x'],[m*b,''],[-n,'x'],[-n*a,'']])+'}/{'+A+B+'}','expand: the minus hits every term'],['={'+top+'}/{'+A+B+'}','collect like terms']]}},
 'Linear denominators':seed=>{const r=rng(seed);let m,n,a,b;do{m=ri(r,1,5);n=ri(r,1,5);a=ri(r,-6,6);b=ri(r,-6,6)}while(!a||!b||a===b||(m===1&&n===1));
   const A=lin(1,a),B=lin(1,b),top=poly([[m+n,'x'],[m*b+n*a,'']]);
   return {q:'Express '+M('{'+m+'}/{'+A.slice(1,-1)+'}+{'+n+'}/{'+B.slice(1,-1)+'}')+' as a single fraction.',ans:'('+top+')/('+A+B+')',verify:{equals:m+'/'+A+'+'+n+'/'+B},ask:M6_ASK,
     hint:'What is the LCD of the two brackets? Which bracket must each numerator be multiplied by?',
     sol:[['{'+m+'}/{'+A.slice(1,-1)+'}+{'+n+'}/{'+B.slice(1,-1)+'}',''],['={'+m6k(m,B)+'+'+m6k(n,A)+'}/{'+A+B+'}','LCD = '+M(A+B)],['={'+poly([[m,'x'],[m*b,''],[n,'x'],[n*a,'']])+'}/{'+A+B+'}','expand'],['={'+top+'}/{'+A+B+'}','collect like terms']]}},
 'Repeated linear factor':seed=>{const r=rng(seed);let m,n,a;do{m=ri(r,1,5);n=ri(r,1,6);a=ri(r,-6,6)}while(!a);const s=r()<.5?1:-1;
   const A=lin(1,a),top=poly([[m,'x'],[m*a+s*n,'']]),op=s>0?'+':'-';
   return {q:'Express '+M('{'+m+'}/{'+A.slice(1,-1)+'}'+op+'{'+n+'}/{'+A+'^2}')+' as a single fraction.',ans:'('+top+')/'+A+'^2',verify:{equals:m+'/'+A+op+n+'/'+A+'^2'},ask:M6_ASK,
     hint:'Is '+M(A)+' already a factor of '+M(A+'^2')+'? So what is the LOWEST common denominator, and which fraction needs to change?',
     sol:[['{'+m+'}/{'+A.slice(1,-1)+'}'+op+'{'+n+'}/{'+A+'^2}',''],['={'+m6k(m,A)+op+n+'}/{'+A+'^2}','LCD = '+M(A+'^2')],['={'+poly([[m,'x'],[m*a,''],[s*n,'']])+'}/{'+A+'^2}','expand'],['={'+top+'}/{'+A+'^2}','collect like terms']]}},
 'Quadratic denominators':seed=>{const r=rng(seed);let a,m,n,s,c;
   do{a=ri(r,2,7);m=ri(r,1,4);n=ri(r,1,9);s=r()<.5?1:-1;c=n-m*s*a}while(c===0||c===m*a||c===-m*a);
   const Q=poly([[1,'x^2'],[-a*a,'']]),D2=lin(1,s*a),miss=lin(1,-s*a),L='(x+'+a+')(x-'+a+')',top=poly([[m,'x'],[c,'']]);
   return {q:'Express '+M('{'+n+'}/{'+Q+'}+{'+m+'}/{'+D2.slice(1,-1)+'}')+' as a single fraction.',ans:'('+top+')/('+L+')',verify:{equals:n+'/('+Q+')+'+m+'/'+D2},ask:M6_ASK,
     hint:'How does '+M(Q)+' factorise? Which bracket is the second denominator missing from the LCD?',
     sol:[['{'+n+'}/{'+Q+'}+{'+m+'}/{'+D2.slice(1,-1)+'}',''],['={'+n+'}/{'+L+'}+{'+m+'}/{'+D2.slice(1,-1)+'}','factorise'],['={'+n+'+'+m6k(m,miss)+'}/{'+L+'}','LCD = '+M(L)],['={'+poly([[n,''],[m,'x'],[-m*s*a,'']])+'}/{'+L+'}','expand'],['={'+top+'}/{'+L+'}','collect like terms']]}}
});

MDEF.m6={

  'keep each numerator in a bracket, so a minus sign changes <b>every</b> term',
  'add and subtract fractions with linear denominators, e.g. '+M('{2}/{x-2}+{3}/{x+3}'),
  'use the lowest common denominator when a factor repeats, e.g. '+M('{1}/{x-3}+{2}/{(x-3)^2}'),
  'factorise quadratic denominators first, e.g. '+M('{1}/{x^2-9}+{2}/{x-3}'),
  'write every answer as a single fraction in its simplest form'

 worked:[
  {id:'we1',title:'Worked example 1',q:'Express '+M('{x+3}/{4}-{x-1}/{6}')+' as a single fraction.',
   diagram:'<style>.m6eb .fr>span{border-radius:0!important}</style><div class="expr-big m6eb"><span id="m6a">'+M('{x+3}/{4}')+'</span> <span id="m6m">−</span> <span id="m6b">'+M('{x-1}/{6}')+'</span></div>',
   steps:[
    {t:'Find the LCD of 4 and 6',glow:['m6a','m6b'],input:{type:'num',ans:12,ask:'Type the LCD only.',hint:'What is the smallest number that both 4 and 6 divide into?'}},
    {t:'Rewrite both fractions over 12, keeping the numerators in brackets',glow:['m6a','m6b'],work:'={3(x+3)}/{12}-{2(x-1)}/{12}'},
    {t:'Write it as one fraction, with the minus in front of the whole second bracket',glow:['m6m'],work:'={3(x+3)-2(x-1)}/{12}'},
    {t:'Expand the numerator',glow:[],input:{ans:'3x+9-2x+2',minTerms:4,terms:4,ask:'Type the expanded numerator only, before collecting like terms (4 terms).',hint:'What is −2 × x? And what is −2 × (−1)?'}},
    {t:'Collect like terms to finish',glow:[],input:{ans:'(x+11)/12',ask:'Type the final single fraction, e.g. (2x+5)/12.',hint:'What do 3x − 2x and 9 + 2 give? What stays on the bottom?'},final:true}],
   distract:[
    {t:'Subtract the tops and subtract the bottoms',why:'Try it with numbers: one half minus one third. Can you subtract the bottoms? What do the fractions need first?'},
    {t:'Multiply 4 by 6 to get the LCD 24',why:'24 works, but is it the lowest? Which smaller number do 4 and 6 both divide into?'},
    {t:'Write the numerator as 3x + 9 − 2x − 2',why:'The minus is in front of the whole bracket 2(x − 1). What is −2 × (−1)?'}]},
  {id:'we2',title:'Worked example 2',q:'Express '+M('{3}/{x^2-4}+{1}/{x+2}')+' as a single fraction.',
   diagram:'<style>.m6eb .fr>span{border-radius:0!important}</style><div class="expr-big m6eb">'+F(M('3'),'<span id="m6q">'+M('x^2-4')+'</span>')+' + '+F(M('1'),'<span id="m6r">'+M('x+2')+'</span>')+'</div>',
   steps:[
    {t:'Factorise the quadratic denominator x² − 4',glow:['m6q'],input:{ans:'(x+2)(x-2)',factorised:true,ask:'Type x² − 4 fully factorised.',hint:'Which special product is a square minus a square?'}},
    {t:'Choose the LCD (x + 2)(x − 2)',glow:['m6q','m6r'],work:'={3}/{(x+2)(x-2)}+{1}/{x+2}'},
    {t:'Rewrite the second fraction over the LCD',glow:['m6r'],input:{ans:'x-2',noBrackets:false,ask:'The second fraction gets the bottom (x + 2)(x − 2). Type its new numerator.',hint:'Which bracket is x + 2 missing from the LCD? What must the top 1 be multiplied by?'}},
    {t:'Add the numerators',glow:[],input:{ans:'x+1',terms:2,ask:'Type the new combined numerator, simplified (2 terms).',hint:'Which numbers on the top can you collect?'}},
    {t:'Write the final single fraction',glow:[],input:{ans:'(x+1)/((x+2)(x-2))',ask:'Type the single fraction. Put brackets round the whole bottom, e.g. (x+5)/((x+1)(x-3)).',hint:'What is your numerator? What is the LCD?'},final:true}],
   distract:[
    {t:'Use the LCD (x² − 4)(x + 2)',why:'It works, but is it the lowest? Does x² − 4 already contain (x + 2)?'},
    {t:'Add the tops and the bottoms to get 4 over x² + x − 2',why:'Can you add denominators? Test it with x = 3.'},
    {t:'Change the bottom of the second fraction but keep its top as 1',why:'If the bottom is multiplied by something, what must happen to the top?'}]}
 ],
 PRACTICE:[
  {key:'p1',skill:'Numerical denominators',type:'expr',q:'Express '+M('{x}/{2}+{x}/{5}')+' as a single fraction.',ans:'7x/10',verify:{equals:'x/2+x/5'},ask:M6_ASKN,
   hint:'What is the lowest number that 2 and 5 both divide into? What does each top become?',
   sol:[['{x}/{2}+{x}/{5}',''],['={5x}/{10}+{2x}/{10}','LCD = 10'],['={7x}/{10}','add the numerators']],
   twin:{q:'Express '+M('{x}/{3}+{x}/{5}')+' as a single fraction.',ans:'8x/15',verify:{equals:'x/3+x/5'},hint:'What is the LCD of 3 and 5? What is each fraction over that LCD?',sol:[['{x}/{3}+{x}/{5}',''],['={5x}/{15}+{3x}/{15}','LCD = 15'],['={8x}/{15}','add the numerators']]}},
  {key:'p2',skill:'Numerical denominators',type:'expr',q:'Express '+M('{3a}/{4}-{a}/{6}')+' as a single fraction.',ans:'7a/12',verify:{equals:'(3a)/4-a/6'},ask:M6_ASKN,
   hint:'What is the LCD of 4 and 6? What must each numerator be multiplied by?',
   sol:[['{3a}/{4}-{a}/{6}',''],['={9a}/{12}-{2a}/{12}','LCD = 12'],['={7a}/{12}','subtract the numerators']],
   twin:{q:'Express '+M('{4a}/{5}-{a}/{2}')+' as a single fraction.',ans:'3a/10',verify:{equals:'(4a)/5-a/2'},hint:'What is the LCD of 5 and 2? What does each top become?',sol:[['{4a}/{5}-{a}/{2}',''],['={8a}/{10}-{5a}/{10}','LCD = 10'],['={3a}/{10}','subtract the numerators']]}},
  {key:'p3',skill:'Numerical denominators',type:'expr',q:'Express '+M('{x+1}/{3}+{x-2}/{4}')+' as a single fraction.',ans:'(7x-2)/12',verify:{equals:'(x+1)/3+(x-2)/4'},ask:M6_ASKN,
   hint:'What is the LCD of 3 and 4? What is each numerator multiplied by? Keep them in brackets!',
   sol:[['{x+1}/{3}+{x-2}/{4}',''],['={4(x+1)+3(x-2)}/{12}','LCD = 12'],['={4x+4+3x-6}/{12}','expand'],['={7x-2}/{12}','collect like terms']],
   twin:{q:'Express '+M('{x+2}/{5}+{x-1}/{2}')+' as a single fraction.',ans:'(7x-1)/10',verify:{equals:'(x+2)/5+(x-1)/2'},hint:'What is the LCD of 5 and 2? Which number multiplies each bracket?',sol:[['{x+2}/{5}+{x-1}/{2}',''],['={2(x+2)+5(x-1)}/{10}','LCD = 10'],['={2x+4+5x-5}/{10}','expand'],['={7x-1}/{10}','collect like terms']]}},
  {key:'p4',skill:'Brackets when subtracting',type:'expr',q:'Express '+M('{x+3}/{2}-{x-2}/{5}')+' as a single fraction.',ans:'(3x+19)/10',verify:{equals:'(x+3)/2-(x-2)/5'},ask:M6_ASKN,
   hint:'What is the LCD? After the minus sign, what is −2 × (−2)?',
   sol:[['{x+3}/{2}-{x-2}/{5}',''],['={5(x+3)-2(x-2)}/{10}','LCD = 10; keep the brackets'],['={5x+15-2x+4}/{10}','−2 × (−2) = +4'],['={3x+19}/{10}','collect like terms']],
   twin:{q:'Express '+M('{x+1}/{4}-{x-3}/{3}')+' as a single fraction.',ans:'(15-x)/12',verify:{equals:'(x+1)/4-(x-3)/3'},hint:'What is the LCD of 4 and 3? What does −4 do to each term of x − 3?',sol:[['{x+1}/{4}-{x-3}/{3}',''],['={3(x+1)-4(x-3)}/{12}','LCD = 12; keep the brackets'],['={3x+3-4x+12}/{12}','−4 × (−3) = +12'],['={15-x}/{12}','collect like terms']]}},
  {key:'p5',skill:'Linear denominators',type:'mcq',q:'Which of these is equal to '+M('{3}/{a}+{1}/{b}')+'?',
   opts:[M('{3b+a}/{ab}'),M('{4}/{a+b}'),M('{4}/{ab}'),M('{3+b}/{ab}')],verify:{opt0:'3/a+1/b'},
   hint:'What is the common denominator of a and b? What must each top be multiplied by?',
   sol:[['{3}/{a}+{1}/{b}',''],['={3b}/{ab}+{a}/{ab}','LCD = ab'],['={3b+a}/{ab}','']],
   twin:{q:'Which of these is equal to '+M('{2}/{p}-{5}/{q}')+'?',opts:[M('{2q-5p}/{pq}'),M('{-3}/{p-q}'),M('{-3}/{pq}'),M('{2p-5q}/{pq}')],verify:{opt0:'2/p-5/q'},
     hint:'What is the LCD of p and q? Which letter multiplies the 2, and which multiplies the 5?',sol:[['{2}/{p}-{5}/{q}',''],['={2q}/{pq}-{5p}/{pq}','LCD = pq'],['={2q-5p}/{pq}','']]}},
  {key:'p6',skill:'Linear denominators',type:'expr',q:'Express '+M('{3}/{x}+{2}/{5x}')+' as a single fraction.',ans:'17/(5x)',verify:{equals:'3/x+2/(5x)'},ask:'Type a single fraction. Put brackets round a bottom with more than one factor, e.g. 7/(3x).',
   hint:'Does x already divide into 5x? So what is the LCD, and which fraction must change?',
   sol:[['{3}/{x}+{2}/{5x}',''],['={15}/{5x}+{2}/{5x}','LCD = 5x'],['={17}/{5x}','add the numerators']],
   twin:{q:'Express '+M('{4}/{x}+{3}/{2x}')+' as a single fraction.',ans:'11/(2x)',verify:{equals:'4/x+3/(2x)'},hint:'What is the LCD of x and 2x? What must the first top be multiplied by?',sol:[['{4}/{x}+{3}/{2x}',''],['={8}/{2x}+{3}/{2x}','LCD = 2x'],['={11}/{2x}','add the numerators']]}},
  {key:'p7',skill:'Linear denominators',type:'expr',q:'Express '+M('{3}/{x+2}+{2}/{x-1}')+' as a single fraction.',ans:'(5x+1)/((x+2)(x-1))',verify:{equals:'3/(x+2)+2/(x-1)'},ask:M6_ASK,
   hint:'What is the LCD of the two brackets? Which bracket does each numerator get multiplied by?',
   sol:[['{3}/{x+2}+{2}/{x-1}',''],['={3(x-1)+2(x+2)}/{(x+2)(x-1)}','over the LCD'],['={3x-3+2x+4}/{(x+2)(x-1)}','expand'],['={5x+1}/{(x+2)(x-1)}','collect like terms']],
   twin:{q:'Express '+M('{4}/{x+1}+{1}/{x-2}')+' as a single fraction.',ans:'(5x-7)/((x+1)(x-2))',verify:{equals:'4/(x+1)+1/(x-2)'},hint:'What is the LCD? What is each top multiplied by?',sol:[['{4}/{x+1}+{1}/{x-2}',''],['={4(x-2)+(x+1)}/{(x+1)(x-2)}','over the LCD'],['={4x-8+x+1}/{(x+1)(x-2)}','expand'],['={5x-7}/{(x+1)(x-2)}','collect like terms']]}},
  {key:'p8',skill:'Brackets when subtracting',type:'expr',q:'Express '+M('{5}/{x+1}-{2}/{x-3}')+' as a single fraction.',ans:'(3x-17)/((x+1)(x-3))',verify:{equals:'5/(x+1)-2/(x-3)'},ask:M6_ASK,
   hint:'What is the LCD? After the minus sign, what is −2 × (+1)?',
   sol:[['{5}/{x+1}-{2}/{x-3}',''],['={5(x-3)-2(x+1)}/{(x+1)(x-3)}','over the LCD'],['={5x-15-2x-2}/{(x+1)(x-3)}','the minus hits both terms'],['={3x-17}/{(x+1)(x-3)}','collect like terms']],
   twin:{q:'Express '+M('{4}/{x-1}-{3}/{x+2}')+' as a single fraction.',ans:'(x+11)/((x-1)(x+2))',verify:{equals:'4/(x-1)-3/(x+2)'},hint:'Which bracket multiplies each top? What is −3 × (−1)?',sol:[['{4}/{x-1}-{3}/{x+2}',''],['={4(x+2)-3(x-1)}/{(x-1)(x+2)}','over the LCD'],['={4x+8-3x+3}/{(x-1)(x+2)}','the minus hits both terms'],['={x+11}/{(x-1)(x+2)}','collect like terms']]}},
  {key:'p9',skill:'Repeated linear factor',type:'expr',q:'Express '+M('{2}/{x+1}+{3}/{(x+1)^2}')+' as a single fraction.',ans:'(2x+5)/(x+1)^2',verify:{equals:'2/(x+1)+3/(x+1)^2'},ask:M6_ASK,
   hint:'Is x + 1 already a factor of (x + 1)²? So what is the lowest common denominator?',
   sol:[['{2}/{x+1}+{3}/{(x+1)^2}',''],['={2(x+1)+3}/{(x+1)^2}','LCD = (x + 1)²'],['={2x+2+3}/{(x+1)^2}','expand'],['={2x+5}/{(x+1)^2}','collect like terms']],
   twin:{q:'Express '+M('{3}/{x-4}+{1}/{(x-4)^2}')+' as a single fraction.',ans:'(3x-11)/(x-4)^2',verify:{equals:'3/(x-4)+1/(x-4)^2'},hint:'Which fraction needs to change to get the LCD (x − 4)²? What is it multiplied by?',sol:[['{3}/{x-4}+{1}/{(x-4)^2}',''],['={3(x-4)+1}/{(x-4)^2}','LCD = (x − 4)²'],['={3x-12+1}/{(x-4)^2}','expand'],['={3x-11}/{(x-4)^2}','collect like terms']]}},
  {key:'p10',skill:'Repeated linear factor',type:'mcq',q:'What is the <b>lowest</b> common denominator of '+M('{2}/{x+1}')+' and '+M('{5}/{(x+1)^2}')+'?',
   opts:[M('(x+1)^2'),M('(x+1)^3'),M('x+1'),M('2(x+1)^2')],verify:{manual:'x + 1 already divides (x + 1)², so (x + 1)² is the LCD'},
   hint:'Does x + 1 divide into (x + 1)²? What is the simplest expression BOTH denominators divide into?',
   sol:[['(x+1)^2=(x+1)(x+1)','it already contains (x + 1)'],['LCD=(x+1)^2','']],
   twin:{q:'What is the <b>lowest</b> common denominator of '+M('{3}/{(x-5)^2}')+' and '+M('{1}/{x-5}')+'?',opts:[M('(x-5)^2'),M('(x-5)^3'),M('x-5'),M('3(x-5)^2')],verify:{manual:'x − 5 already divides (x − 5)²'},
     hint:'Which denominator already contains the other one?',sol:[['(x-5)^2=(x-5)(x-5)','it already contains (x − 5)'],['LCD=(x-5)^2','']]}},
  {key:'p11',skill:'Quadratic denominators',type:'expr',think:true,q:'Express '+M('{1}/{x^2-16}+{3}/{x-4}')+' as a single fraction.',ans:'(3x+13)/((x+4)(x-4))',verify:{equals:'1/(x^2-16)+3/(x-4)'},ask:M6_ASK,
   hint:'How does x² − 16 factorise? Which bracket is the second fraction missing from the LCD?',
   sol:[['{1}/{x^2-16}+{3}/{x-4}',''],['={1}/{(x+4)(x-4)}+{3}/{x-4}','factorise'],['={1+3(x+4)}/{(x+4)(x-4)}','over the LCD'],['={1+3x+12}/{(x+4)(x-4)}','expand'],['={3x+13}/{(x+4)(x-4)}','collect like terms']],
   twin:{q:'Express '+M('{5}/{x^2-25}+{2}/{x+5}')+' as a single fraction.',ans:'(2x-5)/((x+5)(x-5))',verify:{equals:'5/(x^2-25)+2/(x+5)'},hint:'Factorise x² − 25 first. What must the top 2 be multiplied by?',sol:[['{5}/{x^2-25}+{2}/{x+5}',''],['={5}/{(x+5)(x-5)}+{2}/{x+5}','factorise'],['={5+2(x-5)}/{(x+5)(x-5)}','over the LCD'],['={5+2x-10}/{(x+5)(x-5)}','expand'],['={2x-5}/{(x+5)(x-5)}','collect like terms']]}},
  {key:'p12',skill:'Quadratic denominators',type:'expr',think:true,q:'Express '+M('{x}/{x^2-1}-{1}/{x+1}')+' as a single fraction.',ans:'1/((x+1)(x-1))',verify:{equals:'x/(x^2-1)-1/(x+1)'},ask:M6_ASK,
   hint:'Factorise x² − 1 first. After the minus sign, what happens to each term of the second numerator?',
   sol:[['{x}/{x^2-1}-{1}/{x+1}',''],['={x}/{(x+1)(x-1)}-{1}/{x+1}','factorise'],['={x-(x-1)}/{(x+1)(x-1)}','LCD; keep the bracket'],['={x-x+1}/{(x+1)(x-1)}','the minus hits both terms'],['={1}/{(x+1)(x-1)}','']],
   twin:{q:'Express '+M('{x}/{x^2-4}-{1}/{x-2}')+' as a single fraction.',ans:'-2/((x+2)(x-2))',verify:{equals:'x/(x^2-4)-1/(x-2)'},hint:'How does x² − 4 factorise? What does the minus do to (x + 2)?',sol:[['{x}/{x^2-4}-{1}/{x-2}',''],['={x}/{(x+2)(x-2)}-{1}/{x-2}','factorise'],['={x-(x+2)}/{(x+2)(x-2)}','LCD; keep the bracket'],['={x-x-2}/{(x+2)(x-2)}','the minus hits both terms'],['={-2}/{(x+2)(x-2)}','']]}}
 ],
 WSQ:[
  {key:'w1',label:'13',skill:'Brackets when subtracting',type:'expr',q:'Express '+M('{2x-1}/{3}-{x-4}/{6}')+' as a single fraction.',ans:'(3x+2)/6',verify:{equals:'(2x-1)/3-(x-4)/6'},ask:M6_ASKN,
   hint:'Is 3 a factor of 6? So what is the LCD? What does the minus do to −4?',
   sol:[['{2x-1}/{3}-{x-4}/{6}',''],['={2(2x-1)-(x-4)}/{6}','LCD = 6; keep the brackets'],['={4x-2-x+4}/{6}','expand'],['={3x+2}/{6}','collect like terms']],
   twin:{q:'Express '+M('{3x+1}/{4}-{x-3}/{8}')+' as a single fraction.',ans:'(5x+5)/8',verify:{equals:'(3x+1)/4-(x-3)/8'},hint:'What is the LCD of 4 and 8? What does the minus do to −3?',sol:[['{3x+1}/{4}-{x-3}/{8}',''],['={2(3x+1)-(x-3)}/{8}','LCD = 8; keep the brackets'],['={6x+2-x+3}/{8}','expand'],['={5x+5}/{8}','collect like terms']]}},
  {key:'w2',label:'14',skill:'Numerical denominators',type:'expr',q:'Express '+M('{x+2}/{4}+{2x-1}/{6}-{x}/{3}')+' as a single fraction.',ans:'(3x+4)/12',verify:{equals:'(x+2)/4+(2x-1)/6-x/3'},ask:M6_ASKN,
   hint:'What is the lowest number that 4, 6 and 3 all divide into? What is each numerator multiplied by?',
   sol:[['{x+2}/{4}+{2x-1}/{6}-{x}/{3}',''],['={3(x+2)+2(2x-1)-4x}/{12}','LCD = 12'],['={3x+6+4x-2-4x}/{12}','expand'],['={3x+4}/{12}','collect like terms']],
   twin:{q:'Express '+M('{x+1}/{2}+{x-3}/{5}-{x}/{10}')+' as a single fraction.',ans:'(6x-1)/10',verify:{equals:'(x+1)/2+(x-3)/5-x/10'},hint:'What is the LCD of 2, 5 and 10? What does each top become?',sol:[['{x+1}/{2}+{x-3}/{5}-{x}/{10}',''],['={5(x+1)+2(x-3)-x}/{10}','LCD = 10'],['={5x+5+2x-6-x}/{10}','expand'],['={6x-1}/{10}','collect like terms']]}},
  {key:'w3',label:'15',skill:'Brackets when subtracting',type:'expr',q:'Express '+M('{3}/{x+4}-{2}/{x-1}')+' as a single fraction.',ans:'(x-11)/((x+4)(x-1))',verify:{equals:'3/(x+4)-2/(x-1)'},ask:M6_ASK,
   hint:'What is the LCD? After the minus sign, what is −2 × 4?',
   sol:[['{3}/{x+4}-{2}/{x-1}',''],['={3(x-1)-2(x+4)}/{(x+4)(x-1)}','over the LCD'],['={3x-3-2x-8}/{(x+4)(x-1)}','the minus hits both terms'],['={x-11}/{(x+4)(x-1)}','collect like terms']],
   twin:{q:'Express '+M('{5}/{x-2}-{3}/{x+1}')+' as a single fraction.',ans:'(2x+11)/((x-2)(x+1))',verify:{equals:'5/(x-2)-3/(x+1)'},hint:'What is the LCD? What is −3 × (−2)?',sol:[['{5}/{x-2}-{3}/{x+1}',''],['={5(x+1)-3(x-2)}/{(x-2)(x+1)}','over the LCD'],['={5x+5-3x+6}/{(x-2)(x+1)}','the minus hits both terms'],['={2x+11}/{(x-2)(x+1)}','collect like terms']]}},
  {key:'w4',label:'16',skill:'Linear denominators',type:'expr',q:'Express '+M('{x}/{x+2}+{3}/{x-1}')+' as a single fraction.',ans:'(x^2+2x+6)/((x+2)(x-1))',verify:{equals:'x/(x+2)+3/(x-1)'},ask:M6_ASK,
   hint:'What is the LCD? The first top is x: what do you get when you multiply it by its missing bracket?',
   sol:[['{x}/{x+2}+{3}/{x-1}',''],['={x(x-1)+3(x+2)}/{(x+2)(x-1)}','over the LCD'],['={x^2-x+3x+6}/{(x+2)(x-1)}','expand'],['={x^2+2x+6}/{(x+2)(x-1)}','collect like terms']],
   twin:{q:'Express '+M('{x}/{x-3}+{2}/{x+1}')+' as a single fraction.',ans:'(x^2+3x-6)/((x-3)(x+1))',verify:{equals:'x/(x-3)+2/(x+1)'},hint:'Which bracket multiplies each top? What is x × (x + 1)?',sol:[['{x}/{x-3}+{2}/{x+1}',''],['={x(x+1)+2(x-3)}/{(x-3)(x+1)}','over the LCD'],['={x^2+x+2x-6}/{(x-3)(x+1)}','expand'],['={x^2+3x-6}/{(x-3)(x+1)}','collect like terms']]}},
  {key:'w5',label:'17',skill:'Repeated linear factor',type:'expr',q:'Express '+M('{2}/{x+1}-{3}/{(x+1)^2}')+' as a single fraction.',ans:'(2x-1)/(x+1)^2',verify:{equals:'2/(x+1)-3/(x+1)^2'},ask:M6_ASK,
   hint:'What is the LOWEST common denominator here? Which fraction needs to change?',
   sol:[['{2}/{x+1}-{3}/{(x+1)^2}',''],['={2(x+1)-3}/{(x+1)^2}','LCD = (x + 1)²'],['={2x+2-3}/{(x+1)^2}','expand'],['={2x-1}/{(x+1)^2}','collect like terms']],
   twin:{q:'Express '+M('{4}/{x-2}-{5}/{(x-2)^2}')+' as a single fraction.',ans:'(4x-13)/(x-2)^2',verify:{equals:'4/(x-2)-5/(x-2)^2'},hint:'Is x − 2 already a factor of (x − 2)²? What is the first top multiplied by?',sol:[['{4}/{x-2}-{5}/{(x-2)^2}',''],['={4(x-2)-5}/{(x-2)^2}','LCD = (x − 2)²'],['={4x-8-5}/{(x-2)^2}','expand'],['={4x-13}/{(x-2)^2}','collect like terms']]}},
  {key:'w6',label:'18',skill:'Quadratic denominators',type:'expr',q:'Express '+M('{3}/{x^2-x-6}+{1}/{x-3}')+' as a single fraction.',ans:'(x+5)/((x-3)(x+2))',verify:{equals:'3/(x^2-x-6)+1/(x-3)'},ask:M6_ASK,
   hint:'Which two numbers multiply to −6 and add to −1? Which bracket is the second fraction then missing?',

/* =====================================================================
   MISSION 7 — Changing the Subject   (syllabus N5.10)
   Rearrange a formula so another letter is on its own: undo + − × ÷ (and squares / roots)
   in REVERSE order, doing the same thing to both sides (balance method).
   NOTE for answer checking: the checker reads capital and small letters as the same letter,
   so no formula here uses, e.g., both A and a. Subjects are always small letters.
   ===================================================================== */

/* italic letters inside SVG text */
function m7It(s){return String(s).replace(/([a-z])/g,'<tspan font-style="italic">$1</tspan>')}
/* one label inside a flow-diagram box: 'text', {f:[num,den]} stacked fraction, {r:[num,den]} root of a fraction */
function m7Lab(cx,cy,lab){
  const T=(x,y,t,fs,anc)=>`<text x="${x}" y="${y}" text-anchor="${anc||'middle'}" font-family="STIX Two Text,serif" font-size="${fs||28}" fill="#1D1A2C">${m7It(t)}</text>`;
  if(typeof lab==='string')return T(cx,cy+8,lab);
  const [n,d]=lab.f||lab.r;const w=Math.max(n.length,d.length)*12+14;
  let s=T(cx,cy-7,n,24)+`<line x1="${cx-w/2}" y1="${cy+1}" x2="${cx+w/2}" y2="${cy+1}" stroke="#1D1A2C" stroke-width="1.8"/>`+T(cx,cy+25,d,24);
  if(lab.r)s+=`<text x="${cx-w/2-2}" y="${cy+12}" text-anchor="end" font-family="STIX Two Text,serif" font-size="38" fill="#1D1A2C">√</text><line x1="${cx-w/2-3}" y1="${cy-27}" x2="${cx+w/2+2}" y2="${cy-27}" stroke="#1D1A2C" stroke-width="1.6"/>`;
  return s;
}
/* "Build up, then undo" flow diagram.
   o.L: boxes down the left (how the subject is built up), o.opsL: operation between box i and i+1 (going down)
   o.R: boxes up the right (undoing), o.opsR: inverse operation between box i+1 and i (going up). */
function m7Flow(o){
  const n=o.L.length,bw=150,bh=66,gap=108,top=60,cxL=95,cxR=345,W=440;
  const yc=i=>top+bh/2+i*gap,H=top+(n-1)*gap+bh+46;
  const op=(t,x,y,anc,col)=>{const word=/^[a-z]{3,}$/.test(t);return `<text x="${x}" y="${y}" text-anchor="${anc}" font-family="${word?'Lexend,sans-serif':'STIX Two Text,serif'}" font-size="${word?20:27}" font-weight="600" fill="${col}">${word?t:m7It(t)}</text>`};
  let s=`<div class="diagwrap"><svg class="diag" viewBox="0 0 ${W} ${H}" style="max-width:${o.max||440}px" role="img" aria-label="${o.aria||'Flow diagram: build up the formula, then undo it in reverse order'}">
   <defs><marker id="m7ah${o.id||''}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D1A2C"/></marker></defs>
   <text x="${cxL}" y="26" text-anchor="middle" font-family="Lexend,sans-serif" font-size="20" font-weight="700" fill="#EE5A3C">BUILD UP ↓</text>
   <text x="${cxR}" y="26" text-anchor="middle" font-family="Lexend,sans-serif" font-size="20" font-weight="700" fill="#17A564">UNDO ↑</text>`;
  for(let i=0;i<n;i++){
    const subj=i===0;
    s+=`<rect x="${cxL-bw/2}" y="${yc(i)-bh/2}" width="${bw}" height="${bh}" rx="12" fill="${subj?'#FFE9A8':'#FFF4EF'}" stroke="#1D1A2C" stroke-width="2"/>`+m7Lab(cxL,yc(i),o.L[i]);
    s+=`<rect x="${cxR-bw/2}" y="${yc(i)-bh/2}" width="${bw}" height="${bh}" rx="12" fill="${subj?'#FFE9A8':'#E8F8EF'}" stroke="#1D1A2C" stroke-width="2"/>`+m7Lab(cxR,yc(i),o.R[i]);
    if(i<n-1){
      s+=`<line x1="${cxL}" y1="${yc(i)+bh/2+2}" x2="${cxL}" y2="${yc(i+1)-bh/2-3}" stroke="#1D1A2C" stroke-width="2.5" marker-end="url(#m7ah${o.id||''})"/>`+op(o.opsL[i],cxL+14,(yc(i)+yc(i+1))/2+7,'start','#EE5A3C');
      s+=`<line x1="${cxR}" y1="${yc(i+1)-bh/2-2}" x2="${cxR}" y2="${yc(i)+bh/2+3}" stroke="#1D1A2C" stroke-width="2.5" marker-end="url(#m7ah${o.id||''})"/>`+op(o.opsR[i],cxR-14,(yc(i)+yc(i+1))/2+7,'end','#17A564');
    }
  }
  const yl=yc(n-1);
  s+=`<line x1="${cxL+bw/2+2}" y1="${yl}" x2="${cxR-bw/2-3}" y2="${yl}" stroke="#1D1A2C" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#m7ah${o.id||''})"/>
   <text x="${(cxL+cxR)/2}" y="${yl-10}" text-anchor="middle" font-family="Lexend,sans-serif" font-size="16" fill="#6A6680">same value</text>
   <text x="${W/2}" y="${H-12}" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#6A6680">Undo the LAST operation FIRST.</text></svg></div>`;
  return s;
}

 'Rearrange: undo two operations':seed=>{const r=rng(seed);const [y,x]=M7_LET[ri(r,0,5)];const a=ri(r,2,9),b=ri(r,1,12),s=r()<.5?1:-1;

MDEF.m7={
 intro:'A formula is a recipe that gives one quantity from others. But what if you know the answer and want one of the ingredients? Today you learn to <b>turn a formula around</b> so a different letter stands on its own. It is the same balance method you use to solve equations, only with letters!',
 goals:[
  'say which letter is the <b>subject</b> of a formula',
  'make a letter the subject by undoing '+M('+')+', '+M('-')+', '+M('*')+' and '+M('÷')+' in <b>reverse order</b>, e.g. '+M('v=u+at')+' for '+M('t'),
  'rearrange formulae with brackets and fractions, e.g. '+M('P=2(l+b)')+' and '+M('y={3x-2}/{4}'),
  'rearrange formulae with squares and square roots, e.g. '+M('E={1}/{2}mv^2')+' and '+M('T=2πsqrt({l}/{g})'),
  'check a rearranged formula by putting numbers back in'
 ],
 hook:{
  title:'How far can $20 take you?',
  lead:'A taxi charges $4 to start, then $0.50 for every km. So the fare is '+M('c=4+0.5d')+' dollars for '+M('d')+' km. Jun Jie has $20, Siti has $25, Wei Xiang has $31. How far can each of them go?',
  poll:{q:'What is the smartest way to answer all three?',opts:['Guess and check each one','Turn the formula around once'],right:1,
    feedback:['Guess and check works… slowly. Drag the slider below: one turned-around formula answers every fare at once.','Exactly! Drag the slider below: one turned-around formula answers every fare at once.']},
  widget:{type:'slider',title:'Drag the slider: how much money (c dollars) do you have?',var:'c',min:4,max:40,step:1,value:20,
    rows:[{label:'Distance you can go: '+M('d=2(c-4)')+' km',expr:'2*(c-4)'},{label:'Check: the fare '+M('4+0.5d'),expr:'4+0.5*2*(c-4)'}],
    note:'The check row always gives back the money you started with. The new formula exactly undoes the old one.'},
  reveal:'<b>That is changing the subject.</b> We turned '+M('c=4+0.5d')+' into a formula for '+M('d')+'.'+
   '<div class="sol" style="border:none;padding:0;background:none">'+solHTML([['c=4+0.5d',''],['c-4=0.5d','subtract 4 from both sides'],['d={c-4}/{0.5}','divide both sides by 0.5'],['d=2(c-4)','dividing by 0.5 is the same as × 2']],'Turning it around')+'</div>'+
   '<div class="small">Jun Jie: '+M('d=2(20-4)=32')+' km. Siti: 42 km. Wei Xiang: 54 km. One formula, every answer.</div>'
 },
 define:[
  {q:'What is a <u>formula</u>?',a:'An equation that links two or more quantities using letters.<div class="formula">'+M('P=4s')+'</div><div class="small">The perimeter of a square is 4 times its side.</div>'},
  {q:'What is the <u>subject</u> of a formula?',a:'The letter that stands <b>on its own</b> on one side, with no copy of it on the other side.<div class="formula">'+M('v=u+at')+'</div><div class="small">Here '+M('v')+' is the subject.</div>'},
  {q:'What does "make '+M('t')+' the subject" mean?',a:'Rearrange the formula so it reads '+M('t=…')+', with no '+M('t')+' on the right-hand side.<div class="formula">'+M('t={v-u}/{a}')+'</div>'},
  {q:'What are <u>inverse operations</u>?',a:'Operations that undo each other.<div class="formula">'+M('+')+' ↔ '+M('-')+' &nbsp; '+M('*')+' ↔ '+M('÷')+'</div><div class="formula">square ↔ square root</div>'},
  {q:'Example: which letter is the subject of '+M('r=sqrt({A}/{π})')+'?',a:'<div class="formula">'+M('r')+'</div><div class="small">It is the same circle formula as '+M('A=πr^2')+', just turned around so '+M('r')+' is on its own.</div>'}
 ],
 concepts:[
  {eyebrow:'Concept 1 · Build up, then undo',title:'Undo in reverse order',
   lead:'Think of how the subject was <b>built up</b>. In '+M('v=u+at')+', start with '+M('t')+', multiply by '+M('a')+', then add '+M('u')+'. To get '+M('t')+' back, undo the <span class="hl">last</span> step <span class="hl">first</span>, like taking off your shoes before your socks.',
   flips:[{q:'How do I know what to undo first?',a:'Undo the operation that was done <b>last</b>.<div class="formula">'+M('v=u+at')+'</div><div class="small">'+M('t')+' was × '+M('a')+' first, then + '+M('u')+'. So subtract '+M('u')+' first, then divide by '+M('a')+'.</div>'},
          {q:'What is the golden rule?',a:'Whatever you do to one side, do to the <b>other side</b> too.<div class="small">The formula stays balanced, just like solving an equation.</div>'}],

    {type:'anim',title:'Watch: make t the subject of v = u + at',lines:[

   checks:[
    {type:'expr',q:'Make '+M('x')+' the subject of '+M('y=7x-3')+'.',ans:'(y+3)/7',lhs:'x',verify:{eq:'y=7x-3'},ask:m7Ask('x'),
     hint:'Was x multiplied by 7 first, or was 3 taken away first? Which do you undo first?',sol:[['y=7x-3',''],['y+3=7x','add 3 to both sides'],['x={y+3}/{7}','divide both sides by 7']]},
    {type:'expr',q:'Make '+M('l')+' the subject of '+M('P=2l+2b')+'.',ans:'(p-2b)/2',simplest:false,lhs:'l',verify:{eq:'p=2l+2b'},ask:m7Ask('l'),
     hint:'Which term has no l in it? Take it away from both sides first. What is l then multiplied by?',sol:[['P=2l+2b',''],['P-2b=2l','subtract 2b from both sides'],['l={P-2b}/{2}','divide both sides by 2']]}
   ]},
  {eyebrow:'Concept 2 · Brackets',title:'Treat the bracket as one block',
   lead:'In '+M('P=2(l+b)')+' the whole bracket is multiplied by 2. Undo the <b>outside</b> first (divide by 2), then undo what is <b>inside</b>.',
   flips:[{q:'Must I expand the bracket first?',a:'No, both ways work.<div class="formula">'+M('{P}/{2}=l+b')+'</div><div class="small">or expand: '+M('P=2l+2b')+'. Dividing first is usually shorter.</div>'}],
   widget:{type:'anim',title:'Watch: make b the subject of P = 2(l + b)',lines:[

   checks:[

     hint:'What is the whole bracket multiplied by? What is left after you undo that?',sol:[['y=5(x+2)',''],['{y}/{5}=x+2','divide both sides by 5'],['x={y}/{5}-2','subtract 2 from both sides']]},
    {type:'mcq',q:'Make '+M('x')+' the subject of '+M('y=4(x-3)')+'. Which expression is '+M('x')+'?',opts:[M('{y}/{4}+3'),M('{y}/{4}-3'),M('{y+3}/{4}'),M('4y+3')],verify:{opt0:'y/4+3'},
     hint:'What is the whole bracket multiplied by? Once that is undone, what undoes the − 3 inside the bracket?',sol:[['y=4(x-3)',''],['{y}/{4}=x-3','divide both sides by 4'],['x={y}/{4}+3','add 3 to both sides']]}
   ]},
  {eyebrow:'Concept 3 · Fractions',title:'Clear the fraction first',
   lead:'When the subject sits inside a fraction, the division was usually done <b>last</b>, so <span class="hl">multiply both sides by the denominator</span> first. If the subject is <b>on the bottom</b>, multiply both sides by it to bring it up.',
   flips:[{q:'What if the subject is in the denominator, like '+M('s={d}/{t}')+'?',a:'Multiply both sides by '+M('t')+', then divide by '+M('s')+'.<div class="formula">'+M('st=d')+'</div><div class="formula">'+M('t={d}/{s}')+'</div>'}],
   widget:[{type:'html',html:'<b>Flow diagram for '+M('y={3x-2}/{4}')+'</b>'+m7Flow(M7_FLOW_Y)},
    {type:'anim',title:'Watch: make x the subject of y = (3x − 2) ÷ 4',lines:[
     {t:'y={3x-2}/{4}',note:'÷ 4 was done last'},{t:'4y=3x-2',note:'multiply both sides by 4',hl:true},{t:'4y+2=3x',note:'add 2 to both sides',hl:true},{t:'x={4y+2}/{3}',note:'divide both sides by 3'}]}],
   checks:[
    {type:'expr',q:'Make '+M('x')+' the subject of '+M('y={2x+5}/{3}')+'.',ans:'(3y-5)/2',lhs:'x',verify:{eq:'y=(2x+5)/3'},ask:m7Ask('x'),
     hint:'What is the right-hand side divided by? Clear that first. What comes next?',sol:[['y={2x+5}/{3}',''],['3y=2x+5','multiply both sides by 3'],['3y-5=2x','subtract 5 from both sides'],['x={3y-5}/{2}','divide both sides by 2']]},
    {type:'expr',q:'Make '+M('n')+' the subject of '+M('m={12}/{n}')+'.',ans:'12/m',lhs:'n',verify:{eq:'m=12/n'},ask:m7Ask('n'),

   ]},
  {eyebrow:'Concept 4 · Squares and roots',title:'Square ↔ square root',

          {q:'Does the square root cover everything?',a:'Yes: root the <b>whole</b> side.<div class="formula">'+M('r^2={A}/{π}')+'</div><div class="formula">'+M('r=sqrt({A}/{π})')+'</div><div class="small">not '+M('{sqrt(A)}/{π}')+'</div>'}],

/* =====================================================================
   MISSION 9 — Solving Quadratic Equations by Factorisation   (syllabus N7.9)
   If A × B = 0, then A = 0 or B = 0.  Make one side 0 → factorise → set each factor to 0 → solve.
   ===================================================================== */

/* reduced fraction n/d → {a: what to type / check, t: M-string for display} */
function m9Fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;
  return d===1?{a:String(n),t:String(n)}:{a:n+'/'+d,t:(n<0?'-':'')+'{'+Math.abs(n)+'}/{'+d+'}'}}
/* SVG label: italic x, spaced signs */
function m9Lab(s){return String(s).replace(/x/g,'𝑥').replace(/-/g,' − ').replace(/\+/g,' + ')}
/* rectangle with length along the top, width down the left side, area inside */
function m9Rect(len,wid,area){
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 420 240" style="max-width:400px" role="img" aria-label="Rectangle of length ${len} and width ${wid}">
   <rect x="130" y="54" width="260" height="160" fill="#E3EBFF" stroke="#1D1A2C" stroke-width="3"/>
   <text x="260" y="38" text-anchor="middle" font-family="STIX Two Text,serif" font-size="25" fill="#1D1A2C">${m9Lab(len)}</text>
   <text x="118" y="142" text-anchor="end" font-family="STIX Two Text,serif" font-size="25" fill="#1D1A2C">${m9Lab(wid)}</text>
   ${area?`<text x="260" y="142" text-anchor="middle" font-family="Lexend,sans-serif" font-size="21" fill="#2E66F5">Area = ${area}</text>`:''}
  </svg></div>`;
}
/* right-angled triangle: vertical leg a, horizontal leg b, hypotenuse c */
function m9Tri(a,b,c){
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 420 300" style="max-width:400px" role="img" aria-label="Right-angled triangle with sides ${a}, ${b} and hypotenuse ${c}">
   <polygon points="120,40 120,240 360,240" fill="#DDF5E8" stroke="#1D1A2C" stroke-width="3" stroke-linejoin="round"/>
   <polyline points="120,218 142,218 142,240" fill="none" stroke="#1D1A2C" stroke-width="2"/>
   <text x="108" y="148" text-anchor="end" font-family="STIX Two Text,serif" font-size="25" fill="#1D1A2C">${m9Lab(a)}</text>
   <text x="240" y="276" text-anchor="middle" font-family="STIX Two Text,serif" font-size="25" fill="#1D1A2C">${m9Lab(b)}</text>
   <text x="250" y="128" font-family="STIX Two Text,serif" font-size="25" fill="#1D1A2C">${m9Lab(c)}</text>
  </svg></div>`;
}

   const R=m9Fr(q,p),Rn=m9Fr(-q,p);const lhs=(p===1?'':p*p)+'x^2';const eq=r()<.5?lhs+'='+q*q:lhs+'-'+q*q+'=0';

 'Cross method equations':seed=>{const r=rng(seed);
   if(r()<.2){let k;do{k=ri(r,-9,9)}while(k===0);const eq=poly([[1,'x^2'],[2*k,'x'],[k*k,'']])+'=0';

/* Engine note: M('x<3') mis-renders a strict "<" (the escaped &lt; gets its letters italicised).
   M10() formats maths with a real "<" for anything this file builds itself; m10L() prepares lines that the
   engine formats with M() (working lines, trap fixes): it uses a look-alike "＜" only while the engine bug exists. */
const M10_LTOK=!/<i>l<\/i>|&amp;lt/.test(M('a<b'));
function m10L(s){s=String(s).replace(/<=/g,'≤');return M10_LTOK?s:s.replace(/\s*<\s*/g,' ＜ ')}
function M10(s){return M(String(s).replace(/<=/g,'≤')).replace(/&(?:<i>l<\/i>|l)(?:<i>t<\/i>|t);/g,'&lt;')}
function m10Sol(lines,title){return '<div class="h">'+(title||'Worked solution')+'</div>'+lines.map(([w,why])=>'<div class="ln"><span>'+M10(w)+'</span><span class="why">'+(why||'')+'</span></div>').join('')}
/* static number line: the engine's labels (15px in a ~560-unit viewBox) shrink to ~8px on a phone, so enlarge them here */
function m10NL(range,v,closed,dir){return '<div class="diagwrap">'+numlineSVG(range,{v,closed,dir},false).svg.replace(/font-size="15"/g,'font-size="25"').replace(/ y="90"/g,' y="97"').replace(/r="10"/g,'r="13"')+'</div>'}
function m10Fr(n,d){if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;n/=g;d/=g;return d===1?String(n):(n<0?'-':'')+'{'+Math.abs(n)+'}/{'+d+'}'}

const M10_WORD={'>':'more than','<':'less than','>=':'at least','<=':'at most'};
function m10Rect(len,wid){
  const L=s=>String(s).replace(/x/g,'𝑥').replace(/-/g,' − ').replace(/\+/g,' + ');
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 420 260" style="max-width:400px" role="img" aria-label="Rectangle of length ${len} and width ${wid}">
   <rect x="110" y="50" width="260" height="150" fill="#FFE3DA" stroke="#1D1A2C" stroke-width="3"/>
   <text x="240" y="38" text-anchor="middle" font-family="STIX Two Text,serif" font-size="25" fill="#1D1A2C">${L(len)}</text>

  </svg></div>`;
}
/* hook reveal: 2 < 5 on the right, and their negatives swap order on the left */
function m10Mirror(){
  const X=v=>210+v*30;let t='';
  for(let v=-6;v<=6;v++)t+=`<line x1="${X(v)}" y1="112" x2="${X(v)}" y2="124" stroke="#1D1A2C" stroke-width="2"/><text x="${X(v)}" y="150" text-anchor="middle" font-family="Lexend,sans-serif" font-size="18" fill="#1D1A2C">${String(v).replace('-','−')}</text>`;
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 420 200" style="max-width:440px" role="img" aria-label="Number line: 2 is left of 5, but −2 is right of −5">
   <line x1="15" y1="118" x2="405" y2="118" stroke="#1D1A2C" stroke-width="2"/>${t}
   <circle cx="${X(2)}" cy="118" r="8" fill="#2E66F5"/><circle cx="${X(5)}" cy="118" r="8" fill="#2E66F5"/>

   <path d="M${X(2)} 104 Q ${X(0)} 40 ${X(-2)} 104" fill="none" stroke="#7A4DFF" stroke-width="2" stroke-dasharray="5 4"/>
   <path d="M${X(5)} 104 Q ${X(0)} 6 ${X(-5)} 104" fill="none" stroke="#7A4DFF" stroke-width="2" stroke-dasharray="5 4"/>
   <text x="${X(3.5)}" y="186" text-anchor="middle" font-family="Lexend,sans-serif" font-size="19" fill="#2E66F5">5 is bigger</text>
   <text x="${X(-3.5)}" y="186" text-anchor="middle" font-family="Lexend,sans-serif" font-size="19" fill="#EE5A3C">−2 is bigger</text>
  </svg></div>`;
}

 'Inequality word problems':seed=>{const r=rng(seed);const nm=['Aiden','Bala','Chen Wei','Divya','Farah','Hui Min','Nurul','Siti'][ri(r,0,7)];

MDEF.m10={
 intro:'Not everything in life is "equals". You need <b>at least</b> 50 marks to pass, a ride allows riders <b>at most</b> 100 kg, a bus fare must be <b>less than</b> your budget. Today you learn to write, solve and draw these <b>inequalities</b>, and the one sneaky rule that catches almost everyone.',
 goals:[
  'read and write the symbols '+M10('>')+', '+M10('<')+', '+M10('>=')+' and '+M10('<=')+', and turn words like "at most" into symbols',
  'show inequalities such as '+M10('x>2')+' and '+M10('x<=-1')+' on a number line with open and closed circles',
  'solve linear inequalities like '+M10('3x-2>=7')+' the same way as equations',
  'flip the inequality sign when you multiply or divide by a negative number',
  'solve inequalities with brackets and fractions, and find the largest or smallest integer that works',
  'solve word problems such as "at most $50"'
 ],
 hook:{
  title:'5 is bigger than 2. Is −5 bigger than −2?',

  poll:{q:'Is −5 > −2?',opts:['Yes, the order stays the same','No, the order flips'],right:1,
    feedback:['Lots of people think so! Drag the slider below to a negative value and watch the last row.','Nice! Drag the slider to see it happen for every negative number.']},
  widget:{type:'slider',title:'Multiply both 5 and 2 by k',var:'k',min:-4,max:4,step:1,value:2,
    rows:[{label:M('5k'),expr:'5*k'},{label:M('2k'),expr:'2*k'},{label:M('5k-2k')+' (positive means 5k is bigger)',expr:'3*k'}],
    note:'Drag k below 0. What happens to the sign of the last row? Which number is bigger now?'},
  reveal:'<b>The order flips!</b> On a number line, '+M10('-5')+' is to the <b>left</b> of '+M10('-2')+', so '+M10('-5<-2')+'. Multiplying by a negative number mirrors everything around 0.'+m10Mirror()+
    '<div class="formula">'+M10('5>2')+' &nbsp;but&nbsp; '+M10('-5<-2')+'</div><div class="small" style="margin-top:6px">This is the one new rule for inequalities: <b>multiply or divide by a negative number → flip the sign.</b></div>'
 },
 define:[
  {q:'What do '+M10('>')+', '+M10('<')+', '+M10('>=')+' and '+M10('<=')+' mean?',a:'<div style="text-align:left">'+M10('x>3')+': '+M('x')+' is more than 3<br>'+M10('x<3')+': '+M('x')+' is less than 3<br>'+M10('x>=3')+': at least 3 (3 or more)<br>'+M10('x<=3')+': at most 3 (3 or less)</div><div class="small">The sign always opens towards the bigger side.</div>'},
  {q:'What is an <u>inequality</u>?',a:'A statement that two sides are <b>not</b> equal, but one is bigger.<div class="formula">'+M10('x+3>7')+'</div>'},
  {q:'What is the <u>solution</u> of an inequality?',a:'<b>All</b> the values that make it true: usually a whole range of numbers.<div class="small">'+M10('x>4')+' includes 4.1, 5, 37, 1000… but not 4 itself.</div>'},
  {q:'<u>Open</u> circle or <u>closed</u> circle?',a:'○ Open: the number is <b>not</b> included ('+M10('>')+', '+M10('<')+').<br>● Closed: the number <b>is</b> included ('+M10('>=')+', '+M10('<=')+').'},
  {q:'Example: what does '+M10('x<=-2')+' look like on a number line?',a:m10NL([-6,3],-2,true,'left')+'<div class="small">Closed circle at −2 (it is included), arrow to the left (smaller numbers).</div>'}
 ],

   flips:[{q:'When must I flip the inequality sign?',a:'<b>Only</b> when you multiply or divide both sides by a <b>negative</b> number.<div class="formula">'+M10('-3x>12')+'</div><div class="formula" style="margin-top:6px">'+M10('x<-4')+'</div>'},

/* Working lines and trap fixes are formatted by the engine's M(): prepare their "<" signs (see note at the top). */
(function m10Prep(d){
  const fixQ=q=>{if(!q)return;if(q.sol)q.sol=q.sol.map(([a,b])=>[m10L(a),b]);if(q.twin)fixQ(q.twin)};
  d.concepts.forEach(c=>{(c.checks||[]).forEach(fixQ);(Array.isArray(c.widget)?c.widget:[c.widget]).forEach(w=>{if(w&&w.type==='anim')w.lines.forEach(l=>{if(/</.test(l.t))l.html=M10(l.t)})})});
  d.PRACTICE.forEach(fixQ);d.WSQ.forEach(fixQ);fixQ(d.BONUS);
  d.worked.forEach(W=>W.steps.forEach(s=>{if(s.input)fixQ(s.input)}));
  d.TRAPS.forEach(t=>{t.fix=t.fix.map(m10L)});
})(MDEF.m10);

/* "ax+by=c" as an M-string (keeps 1s and signs tidy) */
function m11Eq(a,b,c){return poly([[a,'x'],[b,'y']])+'='+c}
/* sketch (not to scale) of a line cutting the axes at P and Q, with triangle OPQ shaded */
function m11Sketch(eq){
  const T=(x,y,t,o)=>`<text x="${x}" y="${y}" ${o||''} font-family="STIX Two Text,serif" font-size="20" fill="#1D1A2C">${t}</text>`;
  return `<div class="diagwrap"><svg class="diag" viewBox="0 0 380 300" style="max-width:380px" role="img" aria-label="Sketch of the line ${eq} cutting the x-axis at P and the y-axis at Q">
   <defs><marker id="m11ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D1A2C"/></marker></defs>
   <polygon points="70,240 270,240 70,60" fill="#DDF5E8"/>
   <line x1="40" y1="240" x2="350" y2="240" stroke="#1D1A2C" stroke-width="2" marker-end="url(#m11ah)"/>
   <line x1="70" y1="270" x2="70" y2="22" stroke="#1D1A2C" stroke-width="2" marker-end="url(#m11ah)"/>
   <line x1="60" y1="51" x2="300" y2="267" stroke="#2E66F5" stroke-width="3.5"/>
   <circle cx="270" cy="240" r="5" fill="#1D1A2C"/><circle cx="70" cy="60" r="5" fill="#1D1A2C"/>
   ${T(346,262,'x','font-style="italic"')}${T(80,30,'y','font-style="italic"')}
   ${T(52,262,'O')}${T(262,266,'P')}${T(44,68,'Q')}
   <text x="200" y="120" font-family="STIX Two Text,serif" font-size="19" fill="#2E66F5" font-weight="600">${eq}</text>
   <text x="300" y="292" text-anchor="end" font-family="Lexend,sans-serif" font-size="12" fill="#6A6680">not drawn to scale</text>
  </svg></div>`;
}
/* static graph with phone-readable labels (the engine's 14px labels shrink to ~9px on a phone) */
function m11G(spec){return graphHTML(spec).replace(/font-size="14"/g,'font-size="19"').replace(/font-size="15"/g,'font-size="21"').replace(/font-size="16"/g,'font-size="19"')}
/* "y = mx + k" for ax + by = c (b divides c): returns {ans: typeable, m: M-string} */
function m11YForm(a,b,c){
  const g=gcd(a,b),n=a/g,d=b/g,k=c/b;
  const xt=d===1?poly([[-n,'x']]):'-{'+n+'}/{'+d+'}x';
  const xa=d===1?poly([[-n,'x']]):'-'+n+'/'+d+'*x';
  const kt=k===0?'':(k>0?'+'+k:String(k));
  return {ans:xa+kt,m:'y='+xt+kt,grad:d===1?String(-n):'-{'+n+'}/{'+d+'}',gradAns:d===1?-n:'-'+n+'/'+d,k};
}

Object.assign(GEN,{
 'Solutions of ax + by = c':seed=>{const r=rng(seed);let a,b,x0,y0,c;
   do{a=ri(r,2,5);b=ri(r,1,4);x0=ri(r,-2,4);y0=ri(r,-2,5);c=a*x0+b*y0}while(c<=0||x0===0||y0===0);
   const after=a*x0;
   const sol=[[a+'('+x0+')+'+poly([[b,'k']])+'='+c,'put x = '+x0],[poly([[after,''],[b,'k']])+'='+c,''],[poly([[b,'k']])+'='+(c-after),'']];
   if(b!==1)sol.push(['k='+y0,'']);
   return {type:'num',q:'The point '+M('('+x0+', k)')+' lies on the line '+M(m11Eq(a,b,c))+'. Find the value of '+M('k')+'.',ans:y0,verify:{eq:a+'*('+x0+')+'+b+'*k='+c,v:'k'},
     hint:'Which number goes in for x? After substituting, what equation in k is left?',sol}},
 'Table of values for a line':seed=>{const r=rng(seed);const b=ri(r,1,2),a1=ri(r,1,3),c1=ri(r,3,7);const a=a1*b,c=c1*b;
   const xs=[-1,0,1,2,3];
   return {type:'multi',layout:'table',q:'Complete the table of values for '+M(m11Eq(a,b,c))+'.',ask:'Fill in every empty box. On a phone, swipe the table sideways to see every column.',colHead:M('x'),rowHead:M('y'),cols:xs.map(x=>String(x).replace('-','−')),
     fields:xs.map(x=>x===0?{given:c1}:{ans:c1-a1*x}),verify:{fn:c1+'-'+a1+'x'},
     hint:'Can you make y the subject first? What happens to the sign when x is negative?',
     sol:[[m11Eq(a,b,c),''],[poly([[b,'y']])+'='+c+'-'+poly([[a,'x']]),''],...(b===1?[]:[['y='+c1+'-'+poly([[a1,'x']]),'divide every term by '+b]]),['x=-1: y='+c1+'+'+a1+'='+(c1+a1),''],['x=3: y='+c1+'-'+(3*a1)+'='+(c1-3*a1),'']]}},
 'Plotting a straight line':seed=>{const r=rng(seed);let a,c;do{a=ri(r,1,3);c=ri(r,2,8)}while(c-2*a<-2);
   return {type:'plot',q:'Draw the line '+M(m11Eq(a,1,c))+' by plotting the points where '+M('x=0')+', '+M('x=1')+' and '+M('x=2')+'.',
     grid:{xmin:-2,xmax:6,ymin:-3,ymax:9},target:[[0,c],[1,c-a],[2,c-2*a]],line:true,verify:{eq:m11Eq(a,1,c)},
     hint:'For each x-value, what must y be to make the equation true? Which way do you go first on the grid?',
     sol:[['x=0: y='+c,''],['x=1: y='+(c-a),''],['x=2: y='+(c-2*a),'']]}},
 'Rearranging to y = mx + c':seed=>{const r=rng(seed);const a=ri(r,1,6),b=ri(r,2,4),k=ri(r,1,5);const c=b*k;const Y=m11YForm(a,b,c);
   return {type:'expr',q:'Express '+M(m11Eq(a,b,c))+' in the form '+M('y=mx+c')+'.',ans:Y.ans,lhs:'y',verify:{equals:'('+c+'-'+a+'x)/'+b},ask:'Type y = … in the form mx + c.',
     hint:'What do you do to both sides to leave the y-term alone? Then what do you divide every term by?',
     sol:[[m11Eq(a,b,c),''],[b+'y='+poly([[-a,'x'],[c,'']]),'subtract '+(a===1?'':a)+'x'],[Y.m,'divide every term by '+b]]}},
 'Axis intercepts':seed=>{const r=rng(seed);let p,q;do{p=ri(r,2,6);q=ri(r,2,6)}while(p===q);
   let c=p*q/gcd(p,q),a=c/p,b=c/q;const g=gcd(a,b);a/=g;b/=g;c/=g;
   return {type:'multi',q:'The line '+M(m11Eq(a,b,c))+' cuts the '+M('x')+'-axis at '+M('A')+' and the '+M('y')+'-axis at '+M('B')+'. Find the coordinates of '+M('A')+' and '+M('B')+'.',
     fields:[{label:M('A')+' (',ans:p,v:'x',after:', 0)'},{label:M('B')+' (0, ',ans:q,v:'y',after:')'}],verify:{eq:[a+'*x='+c,b+'*y='+c]},ask:'Type the missing coordinate in each box.',
     hint:'On the x-axis, what is y always equal to? And on the y-axis, what is x?',
     sol:[['y=0: '+poly([[a,'x']])+'='+c,'on the x-axis'],['x='+p,'A('+p+', 0)'],['x=0: '+poly([[b,'y']])+'='+c,'on the y-axis'],['y='+q,'B(0, '+q+')']]}},
 'Horizontal and vertical lines':seed=>{const r=rng(seed);let h,k1,k2;do{h=ri(r,-6,6);k1=ri(r,-4,6);k2=ri(r,-4,6)}while(Math.abs(h)<2||k1===k2);
   const vert=r()<.5;const P=vert?'('+h+', '+k1+')':'('+k1+', '+h+')',Q=vert?'('+h+', '+k2+')':'('+k2+', '+h+')';const L=vert?'x':'y',O=vert?'y':'x';
   return {type:'mcq',q:'Which is the equation of the line through '+M(P)+' and '+M(Q)+'?',opts:[M(L+'='+h),M(O+'='+h),M('y='+h+'x'),M('x+y='+h)],verify:{manual:'both points share '+L+' = '+h},
     hint:'Which coordinate is the same for both points? Is the line horizontal or vertical?',
     sol:[[L+'='+h,'both points have '+L+' = '+h+', so the line is '+(vert?'vertical':'horizontal')]]}}
});

MDEF.m11={
